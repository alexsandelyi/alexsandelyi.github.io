<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EFE4">
<title>커뮤니티 — 일빵</title>
<link rel="stylesheet" href="board.css">
<style>
/* 이 페이지의 틀만. 목록·글쓰기 창 모양은 board.css 가 맡는다 —
   런처 안에 붙는 게시판과 같은 것을 써야 두 곳이 어긋나지 않는다. */
:root{ --bg:#F4EFE4; --ink:#0E0C0B; --faint:#8A8177; --line-strong:#241E19;
       --font:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font);
     font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%}
.wrap{max-width:880px; margin:0 auto; padding:24px 16px 64px}
.top{display:flex; align-items:center; gap:16px; margin-bottom:24px}
.back{border:1px solid var(--line-strong); background:#fff; padding:6px 14px;
      border-radius:999px; font-size:14px; text-decoration:none; color:inherit}
.back:hover{background:#F5EBD2}
h1{margin:0; font-size:28px; letter-spacing:-.02em}
.count{color:var(--faint); font-size:14px; margin-left:auto}
.bar{display:flex; gap:8px; margin-bottom:16px}
.cb-post{background:#FCFAF6; border:1px solid #D8CFBE; padding:16px}
@media (max-width:520px){ .wrap{padding:16px 12px 56px} h1{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../">← 목록</a>
    <h1>커뮤니티</h1>
    <span class="count" id="count"></span>
  </div>

  <div class="bar">
    <button class="cb-btn" id="btnWrite" type="button">글 쓰기</button>
  </div>

  <div class="cb-list" id="list"></div>
  <nav class="cb-pager" id="pager" aria-label="페이지"></nav>
</div>

<script src="js/01-api.js"></script>
<script src="js/02-board.js"></script>
<script>
'use strict';
// 독립 페이지에서는 주소에 ?page= 를 반영한다 — 새로고침·뒤로가기·공유.
const board = createBoard({
  list: document.getElementById('list'),
  pager: document.getElementById('pager'),
  count: document.getElementById('count'),
  syncUrl: true
});
document.getElementById('btnWrite').addEventListener('click', board.openWrite);

const pageFromUrl = () => {
  const n = Number(new URLSearchParams(location.search).get('page'));
  return Number.isFinite(n) && n >= 1 ? Math.floor(n) : 1;
};
addEventListener('popstate', () => board.load(pageFromUrl()));
board.load(pageFromUrl());
</script>
</body>
</html>
