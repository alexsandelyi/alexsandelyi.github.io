<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Match 3 플레이</title>
<link rel="icon" href="data:,"><style>html,body,#embed-match3{margin:0;width:100%;height:100%;overflow:hidden;background:#153927}#embed-match3 table,canvas{width:100%!important;height:100%!important}canvas{display:block;touch-action:none}textarea{display:none}</style>
</head><body><div id="embed-match3"></div><script src="match3/match3.nocache.js"></script><script>
(() => {
  // The GWT runtime creates a second iframe inside this page. Relay its
  // lifecycle messages to web.js, and forward pause commands back to it.
  const source = 'ilbbang-match3';
  window.addEventListener('message', event => {
    if (event.data?.source !== source || event.source === window) return;
    let targetOrigin = '*';
    try { targetOrigin = window.parent.location.origin || '*'; } catch (ignored) {}
    window.parent.postMessage(event.data, targetOrigin);
  });
  window.setMatch3Paused = value => {
    const moduleWindow = document.getElementById('match3')?.contentWindow;
    moduleWindow?.setMatch3Paused?.(!!value);
  };
})();
</script></body></html>
