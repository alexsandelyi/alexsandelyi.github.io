function finishLeagueMatch() {
  const fixture = leagueUserFixture(competition);
  const [a,b] = fixture;
  const userIsA = a === competition.userTeam;
  applyTableResult(competition.table, a, b,
    userIsA ? score[0] : score[1], userIsA ? score[1] : score[0]);
  for (const [x,y] of competition.rounds[competition.round]) {
    if (x === competition.userTeam || y === competition.userTeam) continue;
    const result = simulateFixture(x, y);
    applyTableResult(competition.table, x, y, result[0], result[1]);
  }
  competition.history.push({
    round:competition.round + 1, away:selectedTeams[1],
    gf:score[0], ga:score[1]
  });
  competition.round++;
  if (competition.round >= competition.rounds.length) finishLeagueStage();
  else { saveGame(); showLeagueReady(); }
}

function finishLeagueStage() {
  const ranked = rankedTable(competition.table);
  const rank = ranked.findIndex(r => r.team === competition.userTeam) + 1;
  const tableText = standingsText(competition);
  const ov = document.getElementById('overlay');
  if (competition.type === 'season') {
    if (rank === 1) competition.trophies.league++;
    competition.phase = 'cup'; competition.cupRound = 0;
    competition.cupOpponents = shuffledOpponents(competition.userTeam);
    competition.cupHistory = [];
    saveGame(); showCupReady(); return;
  }
  competition = null; saveGame(); state = 'end'; setConfigVisible(false);
  setModeButtons('btnLeague', '새 리그');
  document.getElementById('btnCancelCompetition').hidden = true;
  ov.querySelector('h1').textContent = `리그 ${rank}위`;
  document.getElementById('howto').textContent = '14경기를 모두 마쳤습니다.';
  document.getElementById('modeInfo').textContent = tableText;
  ov.classList.remove('hidden');
}

function showCupReady() {
  state = 'title';
  const ov = document.getElementById('overlay');
  const opponent = competition.cupOpponents[competition.cupRound];
  selectedTeams[0] = competition.userTeam; selectedTeams[1] = opponent;
  selectedFormation[1] = TEAM_DEFS[opponent].formation; tacticOverride[1] = null;
  ov.querySelector('h1').textContent =
    `시즌 ${competition.seasonNo} · 컵 ${competition.cupRound + 1}라운드`;
  document.getElementById('howto').textContent =
    `${TEAM_DEFS[competition.userTeam].name} vs ${TEAM_DEFS[opponent].name}`;
  document.getElementById('modeInfo').textContent = [
    competition.lastMatch,
    `누적 우승 · 리그 ${competition.trophies.league} / 컵 ${competition.trophies.cup}`
  ].filter(Boolean).join('\n\n');
  setConfigVisible(false);
  setModeButtons('btnSeason', competition.cupRound ? '다음 컵 경기' : '컵 시작');
  ov.classList.remove('hidden');
}

function startCupMatch() {
  const opponent = competition.cupOpponents[competition.cupRound];
  selectedTeams[0] = competition.userTeam; selectedTeams[1] = opponent;
  selectedFormation[1] = TEAM_DEFS[opponent].formation; tacticOverride[1] = null;
  saveGame(); startMatch('1p');
}

function finishSeasonCupMatch(won, result) {
  competition.cupHistory.push({
    round:competition.cupRound + 1, away:selectedTeams[1], result, won
  });
  competition.shootout = null; shootout = null;
  if (!won) {
    competition.phase = 'complete'; competition.cupWon = false;
    saveGame(); showSeasonComplete(false); return;
  }
  competition.cupRound++;
  if (competition.cupRound >= 3) {
    competition.trophies.cup++; competition.phase = 'complete';
    competition.cupWon = true;
    saveGame(); showSeasonComplete(true); return;
  }
  saveGame(); showCupReady();
}

function showSeasonComplete(cupWon) {
  state = 'end';
  const ov = document.getElementById('overlay');
  ov.querySelector('h1').textContent = `시즌 ${competition.seasonNo} 완료`;
  document.getElementById('howto').textContent =
    cupWon ? '컵 우승으로 시즌을 마쳤습니다.' : '컵에서 탈락해 시즌을 마쳤습니다.';
  document.getElementById('modeInfo').textContent =
    `누적 우승 · 리그 ${competition.trophies.league} / 컵 ${competition.trophies.cup}`;
  setConfigVisible(false); setModeButtons('btnSeason', '다음 시즌');
  document.getElementById('btnCancelCompetition').textContent = '시즌 끝내기';
  ov.classList.remove('hidden');
}

function beginAction(teamIdx) {
  if (state === 'setpiece' && setpiece && setpiece.side === teamIdx) {
    takeSetpiece('shoot'); return;
  }
  if (state !== 'play') return;
  const p = ctrl[teamIdx];
  if (!p) return;
  if (ball.owner === p) {
    p.shootHeld = true;
    p.shootCharge = Math.max(0.12, p.shootCharge);
  } else {
    act(teamIdx, 'tackle');
  }
}

function endAction(teamIdx) {
  const p = ctrl[teamIdx];
  if (!p || !p.shootHeld) return;
  p.shootHeld = false;
  p.actShoot = Math.max(0.25, Math.min(1, p.shootCharge));
  p.shootCharge = 0;
}

function act(teamIdx, kind, power = 0) {
  if (state === 'setpiece' && setpiece && setpiece.side === teamIdx) {
    takeSetpiece(kind); return;
  }
  if (state !== 'play') return;
  const p = ctrl[teamIdx];
  if (!p) return;
  if (kind === 'switch') { cycleControlled(teamIdx); return; }
  if (kind === 'tackle') {
    if (ball.owner !== p && p.tackleCd <= 0) {
      p.tackleT = 0.22; p.tackleCd = 0.85;
    }
  } else if (ball.owner === p) {
    if (kind === 'pass') { p.actPass = 0.25; p.kickPower = power; }
    if (kind === 'through') { p.actThrough = 0.25; p.kickPower = power; }
  }
}

// ── 물리 ───────────────────────────────────────────────────────────
// 경기장이 1v1 판(1000x620)의 2배 이상이라 속도도 그만큼 올렸다.
const P_ACCEL = 150, P_MAX = 190, P_FRICTION = 4;
const B_MAX = 800;

// 공 감속은 두 항의 합이다 — 잔디 구름 저항(속도 무관 상수) + 공기 저항
// (속도 제곱). 전에는 초당 배율 하나(v 에 비례)로 뭉갰는데, 그러면 빠를
// 때는 맞고 느릴 때 너무 안 멈춰서 공이 20초씩 굴러가는 꼬리가 남았다.
//   지면: a = ROLL_A + AIR_K·v²
//   공중: a = AIR_K·v²          (구름 저항 없음)
// 잔디 구름 저항. 구름저항 계수 Crr 는 잔디 위에서 0.05~0.15 이고
// a = Crr·g 다. 0.6m/s²(Crr 0.061)은 공이 너무 잘 굴러서 0.122 로 올렸다.
const ROLL_A = 1.2 * M;              // 24 단위/s² = 1.2m/s² (Crr 0.122)
// 공기 저항 k = 0.5·ρ·Cd·A/m. 축구공 지름 0.22m·무게 0.43kg·Cd 0.25,
// 공기 밀도 1.225 → 0.01354 /m. 논리단위로는 k/M 이다.
const AIR_K = 0.01354 / M;           // 15m/s 에서 3.05m/s²

// ── 공 높이 (z) ────────────────────────────────────────────────────
// 지면 z=0. 공중에서는 구름저항 대신 공기저항을 쓴다 — 띄운 공이 멀리
// 빠르게 가는 것이 "속도가 조절된다"는 감각의 물리적 근거다.
const GRAVITY = 9.81 * M;            // 196.2 단위/s²
const CROSSBAR = 2.44 * M;           // 48.8 — 규정 크로스바 높이
const BOUNCE_Z = 0.5;                // 잔디 반발. 튈 때마다 높이 절반 이하
const BOUNCE_XY = 0.8;               // 바운스에서 잃는 수평 속도
const GROUND_EPS = 1;                // 0.05m 이하는 지면으로 본다
const BOUNCE_MIN_VZ = 12;            // 이보다 느리면 튀지 않고 붙는다
// 높이 구간 (aerial-play.md 「높이 구간」). 중간 구간을 비워두는 것이
// 핵심이다 — 없으면 공중볼이 땅볼처럼 처리돼 z 를 넣은 의미가 사라진다.
const FOOT_H = 0.5 * M;              // 10 — 트래핑·드리블·일반 킥·태클
const CHEST_H = 1.5 * M;             // 30 — 여기까지는 몸에 튕기기만 한다
const HEAD_H = 2.3 * M;              // 46 — 헤딩 상한
const GK_HIGH_H = 2.6 * M;           // 52 — 골키퍼 점프·다이빙
const HEAD_CD = 0.6;                 // 연속 헤딩 드리블 차단
const HEAD_V = 300;                  // 15m/s — 헤딩은 발킥보다 느리다
const HEAD_ERR = 0.30;               // 조준 오차(rad). 발보다 나쁘다
const GK_CLEAR_V = 560;              // 28m/s — 골키퍼 펀트. B_MAX 안이다
const GK_CLEAR_DIST = 45 * M;        // 펀트 목표 낙하 거리
// 그리기용 과장값(실측 아님). 톱다운에서 높이를 읽으려면 필요하다.
const BALL_LIFT = 0.5;               // z 1단위당 화면 위로 0.5단위
const BALL_GROW = 200, BALL_GROW_MAX = 1.8;
const TOUCH_V = 120, PASS_V = 340, SHOOT_V = 660;
const TRAP_R = R_PLAYER + R_BALL + 7, TRAP_V = 620;
const OWNER_SPEED = 0.88, REOWN_CD = 0.35;
const SPEED_WALK = 5 / 3.6 * M, SPEED_JOG = 11 / 3.6 * M;
const SPEED_RUN = 20 / 3.6 * M, SPEED_SPRINT = P_MAX;
const TACKLE_TRIGGER = 32, SHOT_BLOCK_REACH = 36;
const OPPONENT_SPEED_MUL = [1, 1, 1];
// 평소에는 라인 초과분을 되돌리되, 공을 소유한 동안 FW가 짧은 침투
// 구간을 갖는다. 어려울수록 구간이 짧고 드물어 라인을 더 잘 지킨다.
const OFFSIDE_DISCIPLINE = [0, 0.72, 0.90];
const OFFSIDE_RUN_PERIOD = [0, 2, 4];
const OFFSIDE_RUN_REWARD = [0, 260, 120];
const AI_ACTION_RATE = 0.88;
// AI 파라미터만으로 기준 승률을 회복하지 못해 남긴 단조 1P 보조.
// 쉬움≥보통≥어려움이며 한 값으로 슛·태클·GK 범위를 함께 조절한다.
const HUMAN_ASSIST = [1.00, 0.35, 0];

function movePlayer(p, ax, ay, dt, maxSpeed = P_MAX) {
  const m = Math.hypot(ax, ay);
  if (m > 0.001) { ax /= m; ay /= m; }
  p.vx += ax * P_ACCEL * dt;
  p.vy += ay * P_ACCEL * dt;
  if (m < 0.01) { const f = Math.exp(-P_FRICTION * dt); p.vx *= f; p.vy *= f; }
  const cap = Math.max(0, maxSpeed);
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > cap) { p.vx = p.vx / sp * cap; p.vy = p.vy / sp * cap; }
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, p.x));
  p.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, p.y));
  if (p.kickCd > 0) p.kickCd -= dt;
  if (p.trapCd > 0) p.trapCd -= dt;
  if (p.tackleCd > 0) p.tackleCd -= dt;
  if (p.tackleT > 0) p.tackleT -= dt;
  if (p.blockT > 0) p.blockT -= dt;
  if (p.headCd > 0) p.headCd -= dt;
  if (p.actShoot > 0) p.actShoot -= dt;
  if (p.actPass > 0) p.actPass -= dt;
  if (p.actThrough > 0) p.actThrough -= dt;
  if (p.shootHeld) p.shootCharge = Math.min(1, p.shootCharge + dt / 1.05);
}

function staminaLimitedSpeed(p, requested, dt) {
  let target = Math.max(0, Math.min(SPEED_SPRINT, requested));
  const staminaLoad = 1.25 - p.stats.stamina / 220;
  if (target >= SPEED_SPRINT * .9) {
    if (p.energy <= .08) target = SPEED_RUN;
    else p.energy -= dt * .015 * staminaLoad;
  } else if (target >= SPEED_RUN * .9) {
    p.energy -= dt * .003 * staminaLoad;
  } else if (target >= SPEED_JOG * .9) {
    p.energy -= dt * .0012 * staminaLoad;
  } else if (target <= SPEED_WALK * 1.05) {
    p.energy -= dt * .0004 * staminaLoad;
  }
  p.energy = Math.max(0, Math.min(1, p.energy));
  // 피로는 조깅 이상에서 페이스를 떨어뜨리고, 5km/h 걷기는 회복 가능한
  // 기준 보행 속도로 유지한다.
  const fatigue = target >= SPEED_JOG * .9 ? .70 + p.energy * .30 : 1;
  return target * fatigue;
}

function abilityAdjustedSpeed(p, requested, limited) {
  // 걷기·조깅은 전 선수의 공통 행동 속도, 달리기 이상만 속도 능력치 차이다.
  return limited * (requested <= SPEED_JOG * 1.05 ? 1 : p.speedMul);
}

const inGoalMouth = (y) => y > (FH - GOAL_H) / 2 && y < (FH + GOAL_H) / 2;

function defendingAtGoal(x) {
  const ownDir = x <= 0 ? 1 : -1;
  return attackDir[0] === ownDir ? 0 : 1;
}

function secondLastDefenderLine(side) {
  const dir = attackDir[side];
  const projected = teams[1 - side].map(p => p.x * dir).sort((a, b) => b - a);
  return projected.length > 1 ? projected[1] / dir : (dir === 1 ? FW : 0);
}

function markOffside(p) {
  if (level === 0) { offside = null; return; }
  const dir = attackDir[p.side];
  const lineX = secondLastDefenderLine(p.side);
  const threshold = Math.max(lineX * dir, ball.x * dir) + 18;
  const offenders = teams[p.side].filter(t =>
    t !== p && !t.isGK && (t.x - FW / 2) * dir > 0 && t.x * dir > threshold
  );
  offside = offenders.length ? { side:p.side, offenders, lineX, timer:3 } : null;
}

function callOffside(p) {
  if (!offside || offside.side !== p.side || !offside.offenders.includes(p)) return false;
  matchStats.offsides[p.side]++;
  notice = { text:'오프사이드', timer:1.2, color:'#F2CE7A' };
  const side = 1 - p.side;
  offside = null;
  beginSetpiece('free', side, { x:p.x, y:p.y });
  return true;
}

function outOfPlay(x, y) {
  const last = ball.lastTouch ? ball.lastTouch.side : 0;
  if (y < 0 || y > FH) {
    const spot = { x:Math.max(80, Math.min(FW - 80, x)), y:y < 0 ? 0 : FH };
    beginSetpiece('throw', 1 - last, spot);
    return true;
  }
  if (x < 0 || x > FW) {
    // 크로스바 위로 넘어간 공은 골이 아니다. 아래 골킥·코너로 떨어진다.
    if (inGoalMouth(y) && ball.z < CROSSBAR) {
      goal(1 - defendingAtGoal(x));
      return true;
    }
    const defender = defendingAtGoal(x);
    const attacker = 1 - defender;
    if (last === attacker) {
      const gx = x < 0 ? GA_D * 0.7 : FW - GA_D * 0.7;
      beginSetpiece('goalkick', defender, { x:gx, y:FH / 2 });
    } else {
      beginSetpiece('corner', attacker, {
        x:x < 0 ? 0 : FW, y:y < FH / 2 ? 0 : FH
      });
    }
    return true;
  }
  return false;
}

function updateBall(dt) {
  ball.prevX = ball.x; ball.prevY = ball.y;
  if (ball.freeCd > 0) ball.freeCd -= dt;
  if (ball.owner) {
    const p = ball.owner;
    let ax = p.aimX, ay = p.aimY;
    if (Math.hypot(ax, ay) < 0.1) {
      const v = Math.hypot(p.vx, p.vy);
      if (v > 10) { ax = p.vx / v; ay = p.vy / v; }
      else { ax = attackDir[p.side]; ay = 0; }
    }
    const d = R_PLAYER + R_BALL + 4;
    ball.x = p.x + ax * d;
    ball.y = p.y + ay * d;
    ball.z = 0; ball.vz = 0;            // 드리블 중에는 발밑에 붙어 있다
    ball.vx = p.vx; ball.vy = p.vy;
    // 골라인을 공과 함께 넘는 마지막 터치도 문전 슛 시도로 분류한다.
    const crossedGoal = attackDir[p.side] === 1 ? ball.x >= FW : ball.x <= 0;
    if (crossedGoal && inGoalMouth(ball.y)) {
      matchStats.shots[p.side]++;
      ball.shotSide = p.side; ball.shotCounted = ball.blockCounted = ball.headShot = false;
    }
    return;
  }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;

  // 지면에 붙어 있고 수직 속도도 없으면 중력을 적분하지 않는다.
  // 그러지 않으면 매 프레임 vz 가 음수로 쌓여 미세 바운스가 남는다.
  if (ball.z > 0 || ball.vz !== 0) {
    ball.vz -= GRAVITY * dt;
    ball.z += ball.vz * dt;
    if (ball.z <= 0) {
      ball.z = 0;
      if (-ball.vz > BOUNCE_MIN_VZ) {
        ball.vz = -ball.vz * BOUNCE_Z;
        ball.vx *= BOUNCE_XY; ball.vy *= BOUNCE_XY;
      } else ball.vz = 0;
    }
  }

  const airborne = ball.z > GROUND_EPS;
  // 감속은 진행 반대 방향으로만 작용한다. 공중에서는 속도 벡터 전체(수직
  // 포함)에, 지면에서는 수평에만 건다. 한 프레임 감속이 현재 속도보다
  // 크면 0 으로 자른다 — 안 그러면 공이 뒤로 굴러간다.
  const v = airborne
    ? Math.hypot(ball.vx, ball.vy, ball.vz)
    : Math.hypot(ball.vx, ball.vy);
  if (v > 0) {
    const a = (airborne ? 0 : ROLL_A) + AIR_K * v * v;
    const scale = a * dt >= v ? 0 : (v - a * dt) / v;
    ball.vx *= scale; ball.vy *= scale;
    if (airborne) ball.vz *= scale;
  }
  if (!airborne && ball.vz === 0 && Math.hypot(ball.vx, ball.vy) < 5) {
    ball.vx = 0; ball.vy = 0;
  }
}

function takePossession(p) {
  if (p.trapCd > 0 || ball.freeCd > 0) return false;
  if (ball.z > FOOT_H) return false;              // 낮은 공만 트래핑한다
  if (callOffside(p)) return true;
  // 후보가 아닌 선수에게 패스가 정상 도달하면 이전 후보는 더는 유효하지 않다.
  if (offside) offside = null;
  ball.owner = p; ball.lastTouch = p;
  ball.shotSide = -1; ball.shotCounted = ball.blockCounted = ball.headShot = false;
  ball.z = 0; ball.vz = 0;
  ball.vx = p.vx; ball.vy = p.vy;
  return true;
}

function releaseBall(p, vx, vy, vz = 0) {
  ball.owner = null; ball.lastTouch = p; ball.freeCd = 0.08;
  ball.shotSide = -1; ball.shotCounted = ball.blockCounted = ball.headShot = false;
  p.trapCd = REOWN_CD; p.kickCd = Math.max(p.kickCd, 0.22);
  const sp = Math.hypot(vx, vy);
  ball.vx = sp > B_MAX ? vx / sp * B_MAX : vx;
  ball.vy = sp > B_MAX ? vy / sp * B_MAX : vy;
  ball.vz = vz;
}

const SET_WAIT = {
  throw:0.8, goalkick:1.0, corner:1.5, free:1.5, kickoff:0.7, penalty:2.0
};

function beginSetpiece(type, side, spot) {
  offside = null;
  matchStats.setpieces[type] = (matchStats.setpieces[type] || 0) + 1;
  if (matchStats.events.length < 20)
    matchStats.events.push({ event:type, side, x:Math.round(spot.x), y:Math.round(spot.y) });
  if (type === 'corner') matchStats.corners[side]++;
  ball.owner = null; ball.vx = ball.vy = 0; ball.freeCd = 0.1;
  ball.z = 0; ball.vz = 0;
  ball.shotSide = -1; ball.shotCounted = ball.blockCounted = ball.headShot = false;
  ball.x = Math.max(0, Math.min(FW, spot.x));
  ball.y = Math.max(0, Math.min(FH, spot.y));
  ball.prevX = ball.x; ball.prevY = ball.y;
  let taker = null, bd = Infinity;
  for (const p of teams[side]) {
    if (p.isGK && type !== 'goalkick') continue;
    const d = Math.hypot(p.x - ball.x, p.y - ball.y);
    if (d < bd) { bd = d; taker = p; }
  }
  if (!taker) taker = teams[side][0];
  const inwardX = ball.x < FW / 2 ? 1 : -1;
  const inwardY = ball.y < FH / 2 ? 1 : -1;
  const ox = type === 'throw' ? 0 : -attackDir[side] * (R_PLAYER + R_BALL + 8);
  const oy = type === 'throw' ? inwardY * 90 : 0;
  taker.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, ball.x + ox));
  taker.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, ball.y + oy));
  taker.vx = taker.vy = 0;
  if (type === 'throw') {
    for (const sidePlayers of teams) for (const p of sidePlayers) {
      if (p !== taker) p.y = Math.max(120, Math.min(FH - 120, p.y));
    }
  }
  for (const p of teams[1 - side]) {
    if (type === 'penalty' && p.isGK) {
      const gx = attackDir[p.side] === 1 ? R_PLAYER : FW - R_PLAYER;
      p.x = gx; p.y = FH / 2; p.vx = p.vy = 0;
      continue;
    }
    const dx = p.x - ball.x, dy = p.y - ball.y;
    const d = Math.hypot(dx, dy);
    if (d < CIRCLE_R && d > 0) {
      p.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, ball.x + dx / d * CIRCLE_R));
      p.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, ball.y + dy / d * CIRCLE_R));
    } else if (d === 0) {
      p.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, ball.x + inwardX * CIRCLE_R));
    }
  }
  setpiece = {
    type, side, spot:{ x:ball.x, y:ball.y }, taker,
    timer:SET_WAIT[type] || 1, ready:false, auto:3
  };
  state = 'setpiece';
}

// 목표 지점에 떨어지도록 수직 속도를 정한다. 체공 t 동안 수평으로
// 날아간 거리가 목표와 맞아야 받는 선수가 따라갈 수 있다.
function loftFor(dist, v, maxT = 2.6) {
  if (v <= 0) return 0;
  return GRAVITY * Math.min(maxT, dist / v) / 2;
}

// 슛의 로프트. 잘 뜨면 크로스바 위로 다 날아가 득점이 사라지므로
// 골문에 닿는 시점의 높이를 크로스바 아래로 역산해서 정한다.
function shotLift(dist, v, power) {
  const lp = Math.max(0, (power - 0.4) / 0.6);   // 짧게 누르면 땅볼
  if (v <= 0 || lp <= 0) return 0;
  const t = dist / v;
  // 정점도 크로스바를 넘지 않게 잘라 먼 거리 슛이 부풀지 않게 한다.
  return Math.min((CROSSBAR * 0.72 * lp + GRAVITY * t * t / 2) / t,
    Math.sqrt(2 * GRAVITY * CROSSBAR));
}

// 공중볼 낙하 지점. z(t)=0 의 해석해를 쓰고 수평은 등속으로 근사한다.
// 수치 적분을 돌리지 않으려는 것이다 (aerial-play.md 「AI 판단」).
function ballLanding() {
  if (ball.owner || ball.z <= 0) return { x:ball.x, y:ball.y, t:0 };
  const t = (ball.vz + Math.sqrt(ball.vz * ball.vz + 2 * GRAVITY * ball.z)) / GRAVITY;
  return { x:ball.x + ball.vx * t, y:ball.y + ball.vy * t, t };
}

// 각도 보간. ±π 경계를 넘어가도 짧은 쪽으로 돈다.
function angLerp(a, b, t) {
  const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * t;
}

function takeSetpiece(kind = 'pass') {
  if (!setpiece) return;
  const s = setpiece, p = s.taker;
  let tx, ty, v, lift = 0;
  const needsTarget = s.type === 'kickoff' || (s.type === 'free' && kind !== 'shoot');
  const target = needsTarget ? passTarget(p, kind === 'through') : null;
  const isShot = s.type === 'penalty' || kind === 'shoot';
  if (s.type === 'penalty') {
    const a = aimAt(s.side); tx = a.x; ty = a.y; v = SHOOT_V;
  } else if (s.type === 'throw') {
    // 던지기는 15m/s. 현실 전환 때 재조정되지 않아 820(148km/h)이었다.
    tx = Math.max(180, Math.min(FW - 180, ball.x + attackDir[s.side] * 180));
    ty = ball.y < FH / 2 ? 350 : FH - 350;
    v = 300;
  } else if (s.type === 'corner') {
    const goalX = attackDir[s.side] === 1 ? FW : 0;
    tx = goalX - attackDir[s.side] * PA_D * 0.55;
    ty = FH / 2; v = PASS_V;
  } else if (s.type === 'goalkick') {
    // 골킥은 26m/s. 전환 전 1150(207km/h)은 슛보다 빨랐다.
    tx = p.x + attackDir[s.side] * 1000;
    ty = FH / 2 + (Math.random() * 2 - 1) * 320; v = 520;
  } else if (s.type === 'kickoff') {
    const mate = target || teams[s.side].find(t => t !== p && !t.isGK);
    tx = mate ? mate.x : p.x + attackDir[s.side] * 300;
    ty = mate ? mate.y : p.y; v = 260;
  } else if (target && kind !== 'shoot') {
    tx = target.x + (kind === 'through' ? attackDir[s.side] * 130 : 0);
    ty = target.y; v = PASS_V * 0.9;
  } else {
    const a = aimAt(s.side); tx = a.x; ty = a.y;
    v = kind === 'shoot' ? SHOOT_V * 0.85 : PASS_V * 0.8;
  }
  const ang = Math.atan2(ty - ball.y, tx - ball.x);
  const dist = Math.hypot(tx - ball.x, ty - ball.y);
  // 코너·골킥·스로인은 띄운다. 킥오프와 슛은 땅으로 간다.
  if (s.type === 'corner' || s.type === 'goalkick') lift = loftFor(dist, v);
  else if (s.type === 'throw') lift = loftFor(dist, v, 1.4);
  else if (s.type === 'free' && !isShot) lift = loftFor(dist, v, 1.0) * 0.6;
  v = Math.min(v, B_MAX);
  ball.lastTouch = p; ball.owner = null; ball.freeCd = 0.12;
  ball.vx = Math.cos(ang) * v; ball.vy = Math.sin(ang) * v;
  ball.z = 0; ball.vz = lift;
  const goalBound = goalBoundKick(p.side, ball.x, ball.y, ball.vx, ball.vy);
  ball.shotSide = isShot || goalBound ? p.side : -1;
  ball.shotCounted = ball.blockCounted = false;
  if (isShot || goalBound) matchStats.shots[p.side]++;
  if (matchStats.events.length < 20)
    matchStats.events.push({ event:'kick', type:s.type, vx:Math.round(ball.vx), vy:Math.round(ball.vy) });
  p.kickCd = 0.3; setpiece = null; state = 'play';
}

function stepSetpiece(dt) {
  if (!setpiece) { state = 'play'; return; }
  advanceClock(dt, true);
  if (state !== 'setpiece') return;
  if (setpiece.timer > 0) {
    setpiece.timer -= dt;
    return;
  }
  const human = setpiece.side === 0;
  if (!human) { takeSetpiece('pass'); return; }
  setpiece.ready = true;
  setpiece.auto -= dt;
  if (setpiece.auto <= 0) takeSetpiece('pass');
}

// 공용 슛 분산. 난이도별 시도율을 만들지 않고 200경기 성공률로 보정한다.
function aimAt(side) {
  return { x:attackDir[side] === 1 ? FW : 0,
    y:FH / 2 + (Math.random() * 2 - 1) * GOAL_H * 6.00 };
}

function goalBoundKick(side, x, y, vx, vy) {
  const gx = attackDir[side] === 1 ? FW : 0;
  if (vx * attackDir[side] <= 0) return false;
  const t = (gx - x) / vx;
  return t >= 0 && inGoalMouth(y + vy * t);
}

function passLaneRisk(from, to, defenders) {
  const ux = to.x - from.x, uy = to.y - from.y;
  const u2 = ux * ux + uy * uy;
  let risk = 0;
  for (const o of defenders) {
    const q = u2 ? Math.max(0, Math.min(1,
      ((o.x - from.x) * ux + (o.y - from.y) * uy) / u2)) : 0;
    const lane = Math.hypot(o.x - (from.x + ux * q), o.y - (from.y + uy * q));
    if (lane < 100) risk += (100 - lane) * 4;
  }
  return risk;
}

// 패스 대상: 앞쪽에 있고 가까운 동료
function passTarget(p, through = false) {
  const dir = attackDir[p.side];
  const tactic = teamTactics(p.side);
  let best = null, bestScore = Infinity;
  for (const t of teams[p.side]) {
    if (t === p || t.isGK) continue;
    const ahead = (t.x - p.x) * dir;
    if (ahead < 40) continue;                        // 뒤나 옆은 제외
    const d = Math.hypot(t.x - p.x, t.y - p.y);
    if (d < 120) continue;                           // 너무 가까우면 의미 없다
    const laneRisk = passLaneRisk(p, t, teams[1 - p.side]);
    const edgePenalty = Math.max(0, 150 - Math.min(t.y, FH - t.y)) * 3;
    // 넓게 벌린 팀은 가까운 중앙 선수만 고르지 않고 빈 측면의 전진
    // 패스도 적극적으로 선택한다. 기본 폭(.30) 이하는 기존 판정을 유지한다.
    const outletReward = Math.abs(t.y - FH / 2) *
      Math.max(0, tactic.width - .30) * 4;
    const runReward = level > 0 && t.role === 'FW' &&
      (Math.floor(clock / 4) + t.no) % OFFSIDE_RUN_PERIOD[level] === 0
      ? OFFSIDE_RUN_REWARD[level] : 0;
    const sc = d - ahead * (through ? 0.95 : 0.6) +
      laneRisk + edgePenalty - outletReward - runReward;
    if (sc < bestScore) { bestScore = sc; best = t; }
  }
  return best;
}

function kickOwned(p, kind, power = 0.65) {
  if (ball.owner !== p || p.kickCd > 0) return false;
  let tx, ty, v, lift = 0;
  const aimMag = Math.hypot(p.aimX, p.aimY);
  const dir = attackDir[p.side];
  // 누른 시간이 그대로 높이다 (aerial-play.md 「킥 높이 제어」).
  // 0.4 이하는 땅볼로 둬서 짧게 누르면 예전과 같게 나간다.
  const lp = Math.max(0, (power - 0.4) / 0.6);
  if (kind === 'shoot') {
    matchStats.shots[p.side]++;
    if (p.manualAim && aimMag > 0.2) {
      tx = p.x + p.aimX / aimMag * 1000; ty = p.y + p.aimY / aimMag * 1000;
    } else {
      const a = aimAt(p.side); tx = a.x; ty = a.y;
    }
    v = SHOOT_V * p.shotMul * (0.62 + 0.38 * power) *
      (mode === '1p' && p === ctrl[0] ? 1 + HUMAN_ASSIST[level] * 0.8 : 1);
    // 골라인까지의 거리로 역산해 크로스바 아래에 머물게 한다.
    lift = shotLift(Math.max(120, dir === 1 ? FW - p.x : p.x), v, power);
  } else {
    const through = kind === 'through';
    const t = passTarget(p, through);
    if (t) {
      const lead = through ? Math.min(230, Math.hypot(t.vx, t.vy) * 0.55 + 90) : 0;
      const tm = Math.hypot(t.vx, t.vy);
      tx = t.x + (tm > 5 ? t.vx / tm : attackDir[p.side]) * lead;
      ty = t.y + (tm > 5 ? t.vy / tm : 0) * lead;
      const d = Math.hypot(tx - p.x, ty - p.y);
      v = Math.min(PASS_V * p.passMul * (through ? 1.12 : 1),
        420 + d * p.passMul * (through ? 1.0 : 0.9));
      // 측면 깊은 위치에서 중앙으로 보내면 크로스다. 체공을 길게 줘서
      // 받는 선수가 낙하 지점까지 따라갈 수 있게 한다.
      const cross = Math.min(p.y, FH - p.y) < FH * 0.24 &&
        (dir === 1 ? p.x : FW - p.x) > FW * 0.58 &&
        Math.abs(t.y - FH / 2) < FH * 0.30;
      if (cross) {
        matchStats.crosses[p.side]++;
        lift = loftFor(d, v, 1.6);
      } else if (through && lp > 0.5) {
        v *= 0.7; lift = loftFor(d, v, 2.0);        // 칩 — 수비선 뒤로
      } else if (lp > 0) {
        v *= 0.9; lift = loftFor(d, v, 1.1) * lp;   // 로빙 패스
      }
    } else if (aimMag > 0.2) {
      tx = p.x + p.aimX / aimMag * 800; ty = p.y + p.aimY / aimMag * 800;
      v = PASS_V * p.passMul * (through ? 0.95 : 0.8);
      if (lp > 0) { v *= 0.9; lift = loftFor(800, v, 1.1) * lp; }
    } else {
      const a = aimAt(p.side); tx = a.x; ty = a.y; v = PASS_V * 0.8;
    }
  }
  if (kind === 'pass' || kind === 'through') markOffside(p);
  const ang = Math.atan2(ty - p.y, tx - p.x);
  const vx = Math.cos(ang) * v, vy = Math.sin(ang) * v;
  releaseBall(p, vx, vy, lift);
  if (kind === 'shoot') ball.shotSide = p.side;
  else if (goalBoundKick(p.side, p.x, p.y, vx, vy)) {
    matchStats.shots[p.side]++;
    ball.shotSide = p.side;
  }
  p.actShoot = p.actPass = p.actThrough = 0;
  return true;
}

function ballContactPoint(p) {
  let x = ball.x, y = ball.y;
  if (!ball.owner && ball.shotSide === 1 - p.side) {
    const ux = ball.x - ball.prevX, uy = ball.y - ball.prevY;
    const u2 = ux * ux + uy * uy;
    if (u2 > 0) {
      const q = Math.max(0, Math.min(1,
        ((p.x - ball.prevX) * ux + (p.y - ball.prevY) * uy) / u2));
      const px = ball.prevX + ux * q, py = ball.prevY + uy * q;
      if (Math.hypot(px - p.x, py - p.y) < Math.hypot(x - p.x, y - p.y)) {
        x = px; y = py;
      }
    }
  }
  return { x, y };
}

// 무릎~가슴(0.5~1.5m). 아무도 제대로 다루지 못하고 몸에 튕긴다.
function deflectBall(p, nx, ny) {
  matchStats.deflections[p.side]++;
  const carry = Math.max(0, p.vx * nx + p.vy * ny);
  const v = TOUCH_V * 0.8 + carry * 0.35;
  let vx = ball.vx * 0.35 + nx * v, vy = ball.vy * 0.35 + ny * v;
  const sp = Math.hypot(vx, vy);
  if (sp > B_MAX) { vx = vx / sp * B_MAX; vy = vy / sp * B_MAX; }
  ball.vx = vx; ball.vy = vy;
  ball.vz = Math.abs(ball.vz) * 0.35 + 30;      // 몸에 맞고 살짝 뜬다
  ball.freeCd = Math.max(ball.freeCd, 0.06);
  p.trapCd = Math.max(p.trapCd, 0.18);
}

// 헤딩(1.5~2.3m). 발로 닿을 수 없는 높이를 처리하는 유일한 수단이다.
// 소유로 전환하지 않는 것이 헤딩 드리블을 막는 장치다.
function headBall(p, nx, ny) {
  if (p.headCd > 0) return;
  p.headCd = HEAD_CD;
  matchStats.headers[p.side]++;
  const dir = attackDir[p.side];
  const attacking = (dir === 1 ? FW - p.x : p.x) < FW * 0.32;
  let ang, v, lift;
  if (attacking) {
    const a = aimAt(p.side);
    ang = Math.atan2(a.y - p.y, a.x - p.x);
    v = HEAD_V; lift = 18;
    matchStats.shots[p.side]++;
    ball.shotSide = p.side; ball.shotCounted = ball.blockCounted = ball.headShot = false;
    ball.headShot = true;
  } else {
    // 수비·중원 헤딩은 걷어내기 — 멀리 그리고 높이.
    ang = Math.atan2((FH / 2 - p.y) * 0.35 + (Math.random() * 2 - 1) * 260, dir * 800);
    v = HEAD_V * 1.15; lift = 120;
    ball.shotSide = -1; ball.shotCounted = ball.blockCounted = ball.headShot = false;
  }
  if (p.manualAim) ang = angLerp(ang, Math.atan2(p.aimY, p.aimX), 0.6);
  // 발보다 정확도가 나쁘다. 공격은 shot, 수비는 defense 로 오차를 줄인다.
  const skill = (attacking ? p.stats.shot : p.stats.defense) / 99;
  ang += (Math.random() * 2 - 1) * HEAD_ERR * (1 - skill * 0.55);
  ball.vx = Math.cos(ang) * v; ball.vy = Math.sin(ang) * v;
  ball.vz = lift;
  ball.freeCd = Math.max(ball.freeCd, 0.12);
  p.trapCd = Math.max(p.trapCd, HEAD_CD);
}

function collide(p) {
  // 높이 게이트. 헤딩 구간 위는 골키퍼만 닿는다. 헤딩 쿨다운 중이면
  // 헤딩 구간에 아예 닿지 못한다 — 안 그러면 공만 밀어내며 lastTouch 를
  // 계속 가져간다.
  const reachH = p.isGK ? GK_HIGH_H : p.headCd > 0 ? CHEST_H : HEAD_H;
  if (ball.z > reachH) return;
  const contact = ballContactPoint(p);
  const dx = contact.x - p.x, dy = contact.y - p.y;
  const gkAssist = p.isGK && p.side === 0 && mode === '1p'
    ? 1 + HUMAN_ASSIST[level] : 1;
  // 보통을 1로 정규화해 기존 물리 도달 거리를 보존하고, 난이도의 gk 축은
  // 실제 다이빙 도달 범위를 단조롭게 바꾼다.
  const gkDifficulty = p.isGK ? p.gkDifficulty / LEVELS[1].gk : 1;
  const blockReach = !p.isGK && p.blockT > 0 && ball.shotSide === 1 - p.side
    ? SHOT_BLOCK_REACH * p.defenseMul : 0;
  const d = Math.hypot(dx, dy),
    min = p.reach * gkAssist * gkDifficulty + R_BALL + blockReach;
  if (d >= min || d === 0) return;
  if (!ball.owner && callOffside(p)) return;
  const nx = dx / d, ny = dy / d;

  if (ball.owner) {
    const owner = ball.owner;
    if (owner === p || owner.side === p.side) return;
    const rel = Math.hypot(p.vx - owner.vx, p.vy - owner.vy);
    const assist = mode === '1p' && p.side === 0 ? HUMAN_ASSIST[level] : 0;
    const contest = p.defenseMul / (p.defenseMul + owner.defenseMul);
    if ((p.tackleT > 0 && Math.random() < contest + .18 + assist) ||
        rel > P_MAX * 0.72) {
      owner.trapCd = REOWN_CD;
      ball.owner = null; ball.freeCd = 0.06; ball.lastTouch = p;
      ball.x = p.x + nx * min; ball.y = p.y + ny * min;
      ball.vx = p.vx * 0.75 + nx * TOUCH_V;
      ball.vy = p.vy * 0.75 + ny * TOUCH_V;
      p.tackleT = 0;
    }
    return;
  }

  ball.x = p.x + nx * min; ball.y = p.y + ny * min;
  ball.lastTouch = p;

  // 골키퍼는 잡아서 앞으로 크게 걷어낸다. 다른 선수처럼 튕겨내면
  // 골문 앞에서 공이 계속 맴돌아 결국 실점한다.
  if (p.isGK) {
    if (ball.shotSide === 1 - p.side && !ball.shotCounted) {
      matchStats.onTarget[ball.shotSide]++; ball.shotCounted = true;
    }
    if (p.gkClaim) { matchStats.gkClaims[p.side]++; p.gkClaim = false; }
    ball.shotSide = -1; ball.shotCounted = ball.blockCounted = ball.headShot = false;
    p.kickCd = 0.35;
    const dir = attackDir[p.side];
    const ang = Math.atan2((FH / 2 - p.y) * 0.6 + (Math.random() * 2 - 1) * 300, dir * 900);
    // 잡은 공을 손에서 놓고 펀트한다. 전에는 1150(207km/h)으로 슛보다
    // 빨랐고 B_MAX 클램프도 우회했다.
    ball.vx = Math.cos(ang) * GK_CLEAR_V;
    ball.vy = Math.sin(ang) * GK_CLEAR_V;
    ball.z = 0;
    ball.vz = loftFor(GK_CLEAR_DIST, GK_CLEAR_V, 1.8);
    return;
  }

  if (ball.shotSide === 1 - p.side) {
    if (!ball.blockCounted) matchStats.blocks[p.side]++;
    ball.blockCounted = true;
  }

  // 높이 구간별 경합. 발 구간에서만 트래핑·드리블·의도한 킥이 나온다.
  if (ball.z > CHEST_H) { headBall(p, nx, ny); return; }
  if (ball.z > FOOT_H) { deflectBall(p, nx, ny); return; }

  let vx, vy, deliberateKick = false;
  if (p.actShoot > 0 && p.kickCd <= 0) {
    deliberateKick = true;
    p.actShoot = 0; p.kickCd = 0.3;
    matchStats.shots[p.side]++;
    ball.shotSide = p.side; ball.shotCounted = ball.blockCounted = ball.headShot = false;
    const a = aimAt(p.side);
      const ang = Math.atan2(a.y - p.y, a.x - p.x);
      vx = Math.cos(ang) * SHOOT_V * p.shotMul; vy = Math.sin(ang) * SHOOT_V * p.shotMul;
  } else if (p.actPass > 0 && p.kickCd <= 0) {
    deliberateKick = true;
    p.actPass = 0; p.kickCd = 0.25;
    markOffside(p);
    const t = passTarget(p);
    if (t) {
      const ang = Math.atan2(t.y - p.y, t.x - p.x);
      const d2 = Math.hypot(t.x - p.x, t.y - p.y);
      const v = Math.min(PASS_V * p.passMul, 420 + d2 * 0.9 * p.passMul);
      vx = Math.cos(ang) * v; vy = Math.sin(ang) * v;
    } else {
      const a = aimAt(p.side);
      const ang = Math.atan2(a.y - p.y, a.x - p.x);
      vx = Math.cos(ang) * PASS_V * 0.8 * p.passMul;
      vy = Math.sin(ang) * PASS_V * 0.8 * p.passMul;
    }
  } else if (p.actThrough > 0 && p.kickCd <= 0) {
    deliberateKick = true;
    p.actThrough = 0; p.kickCd = 0.25;
    markOffside(p);
    const t = passTarget(p, true);
    const tx = t ? t.x + attackDir[p.side] * 150 : p.x + attackDir[p.side] * 600;
    const ty = t ? t.y : p.y;
    const ang = Math.atan2(ty - p.y, tx - p.x);
    vx = Math.cos(ang) * PASS_V; vy = Math.sin(ang) * PASS_V;
  } else if (Math.hypot(ball.vx - p.vx, ball.vy - p.vy) < TRAP_V &&
             d < TRAP_R && takePossession(p)) {
    return;
  } else {
    // 빠른 공은 트래핑하지 못하고 몸에 튕긴다
    const carry = Math.max(0, p.vx * nx + p.vy * ny);
    const v = TOUCH_V + carry * 0.5;
    vx = nx * v + p.vx * 0.3; vy = ny * v + p.vy * 0.3;
  }
  if (deliberateKick && ball.shotSide < 0 &&
      goalBoundKick(p.side, ball.x, ball.y, vx, vy)) {
    matchStats.shots[p.side]++;
    ball.shotSide = p.side; ball.shotCounted = ball.blockCounted = ball.headShot = false;
  }
  const sp = Math.hypot(vx, vy);
  ball.vx = sp > B_MAX ? vx / sp * B_MAX : vx;
  ball.vy = sp > B_MAX ? vy / sp * B_MAX : vy;
}

function inPenaltyArea(side, x, y) {
  if (y < (FH - PA_W) / 2 || y > (FH + PA_W) / 2) return false;
  return attackDir[side] === 1 ? x > FW - PA_D : x < PA_D;
}

function callFoul(tackler, victim) {
  if (state !== 'play' || tackleFoulGuard) return;
  tackleFoulGuard = true;
  tackler.tackleT = 0; tackler.tackleCd = Math.max(tackler.tackleCd, 1);
  matchStats.fouls[tackler.side]++;
  const rel = Math.hypot(tackler.vx - victim.vx, tackler.vy - victim.vy);
  if (rel > 420) {
    tackler.yellow = 1; matchStats.cards[tackler.side]++;
    notice = { text:'파울 · 옐로카드', timer:1.2, color:'#F2CE4A' };
  } else {
    notice = { text:'파울', timer:1.0, color:'#F2F7F4' };
  }
  if (ball.owner) { ball.owner.trapCd = REOWN_CD; ball.owner = null; }
  if (inPenaltyArea(victim.side, victim.x, victim.y)) {
    beginSetpiece('penalty', victim.side, {
      x:attackDir[victim.side] === 1 ? FW - PEN_SPOT : PEN_SPOT, y:FH / 2
    });
  } else {
    beginSetpiece('free', victim.side, { x:victim.x, y:victim.y });
  }
}

// 선수끼리 겹치지 않게 (22명 → 231쌍, Canvas 2D 로 충분히 가볍다)
let tackleFoulGuard = false;
function separateAll() {
  tackleFoulGuard = false;
  const all = teams[0].concat(teams[1]);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy), min = R_PLAYER * 2;
    if (d >= min || d === 0) continue;
    if (a.side !== b.side) {
      const tackler = a.tackleT > 0 ? a : b.tackleT > 0 ? b : null;
      const victim = tackler === a ? b : a;
      if (tackler) {
        const ballDist = Math.hypot(ball.x - tackler.x, ball.y - tackler.y);
        if (ballDist > d + R_BALL * 0.6) {
          callFoul(tackler, victim);
          if (state !== 'play') return;
        }
      }
    }
    const push = (min - d) / 2, nx = dx / d, ny = dy / d;
    a.x -= nx * push; a.y -= ny * push;
    b.x += nx * push; b.y += ny * push;
    a.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, a.x));
    a.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, a.y));
    b.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, b.x));
    b.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, b.y));
  }
}

function goal(side) {
  const attackingLastTouch = !ball.owner && ball.lastTouch &&
    ball.lastTouch.side === side;
  if (ball.shotSide === side || attackingLastTouch) {
    if (ball.shotSide !== side) matchStats.shots[side]++;
    matchStats.shotGoals[side]++;
    if (!ball.shotCounted) matchStats.onTarget[side]++;
  } else {
    matchStats.nonShotGoals[side]++;
    matchStats[ball.owner ? 'carryGoals' : 'looseGoals'][side]++;
    if (!ball.owner) {
      const ownGoal = ball.lastTouch && ball.lastTouch.side !== side;
      matchStats[ownGoal ? 'ownGoals' : 'attackingLooseGoals'][side]++;
    }
  }
  if (ball.headShot && ball.shotSide === side) matchStats.headGoals[side]++;
  score[side]++; lastScorer = side;
  ball.owner = null; setpiece = null;
  state = 'goal'; goalTimer = GOAL_PAUSE;
  syncHud();
}

// ── AI ─────────────────────────────────────────────────────────────
// 팀에서 공에 가장 가까운 필드 선수만 공을 쫓고, 나머지는 포메이션 위치를
// 공 위치에 따라 밀고 당긴 지점을 지킨다. 전원이 공만 쫓으면 뭉쳐버린다.
function nearestToBall(side, exclude) {
  let best = null, bd = Infinity;
  for (const p of teams[side]) {
    if (p.isGK || p === exclude) continue;
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function nearestChasers(side, exclude) {
  let first = null, second = null, d1 = Infinity, d2 = Infinity;
  for (const p of teams[side]) {
    if (p.isGK || p === exclude) continue;
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < d1) { second = first; d2 = d1; first = p; d1 = d; }
    else if (d < d2) { second = p; d2 = d; }
  }
  return teamTactics(side).chasers > 1 && second ? [first, second] : [first];
}

// 포메이션 위치를 공 쪽으로 이동시킨 목표 지점
function slotTarget(p, offsideLine = null) {
  const h = homePos(p);
  const tactic = teamTactics(p.side);
  const shiftX = (ball.x - FW / 2) * tactic.press;
  // 폭은 공 쪽으로 전원이 몰리는 정도가 아니라, 대형 자체가 좌우로
  // 벌어지는 정도다. 공을 따라가는 이동은 작게 유지해 넓은 전개가
  // 두 명 압박을 자연스럽게 분산시키게 한다.
  const spread = .72 + tactic.width * 1.55;
  const shiftY = (ball.y - FH / 2) * .18;
  let tx = h.x + shiftX;
  let ty = FH / 2 + (h.y - FH / 2) * spread + shiftY;
  // 수비는 자기 진영을 크게 벗어나지 않는다
  if (p.role === 'DF') {
    tx = attackDir[p.side] === 1
      ? Math.min(tx, FW * tactic.line)
      : Math.max(tx, FW * (1 - tactic.line));
  }
  if (level > 0 && (p.role === 'MF' || p.role === 'FW')) {
    const line = offsideLine ?? secondLastDefenderLine(p.side);
    const dir = attackDir[p.side];
    const safe = line - dir * 36;
    const excess = (tx - safe) * dir;
    const phase = Math.floor(clock / 4) + p.no;
    const attackingSide = ball.owner ? ball.owner.side :
      (ball.lastTouch ? ball.lastTouch.side : -1);
    const riskyRun = p.role === 'FW' && attackingSide === p.side &&
      ball.owner !== p && phase % OFFSIDE_RUN_PERIOD[level] === 0;
    if (riskyRun) {
      const risky = line + dir * 160;
      if ((risky - tx) * dir > 0) tx = risky;
    } else if (excess > 0) {
      tx = safe + dir * excess * (1 - OFFSIDE_DISCIPLINE[level]);
    }
  }
  return {
    x:Math.max(R_PLAYER, Math.min(FW - R_PLAYER, tx)),
    y:Math.max(100, Math.min(FH - 100, ty))
  };
}

function segmentPointDistance(p, a, b) {
  const ux = b.x - a.x, uy = b.y - a.y;
  const u2 = ux * ux + uy * uy;
  const q = u2 ? Math.max(0, Math.min(1,
    ((p.x - a.x) * ux + (p.y - a.y) * uy) / u2)) : 0;
  const x = a.x + ux * q, y = a.y + uy * q;
  return { q, x, y, distance:Math.hypot(p.x - x, p.y - y) };
}

function defensiveTarget(p, fallback, isChaser) {
  if (isChaser || p.isGK || p.role === 'FW' || !ball.owner ||
      ball.owner.side === p.side) return fallback;

  const owner = ball.owner;
  const ownGoal = { x:attackDir[p.side] === 1 ? 0 : FW, y:FH / 2 };
  const markers = teams[p.side].filter(t => !t.isGK && t.role !== 'FW')
    .sort((a, b) => a.y - b.y || a.no - b.no);
  const threats = teams[owner.side].filter(t => !t.isGK && t !== owner)
    .sort((a, b) => a.y - b.y || a.no - b.no);
  const markerIndex = markers.indexOf(p);
  let target = fallback;

  // 대형 슬롯을 버리지 않되, 대응 공격수보다 골문 쪽에 선다.
  if (markerIndex >= 0 && threats.length) {
    const threatIndex = Math.min(threats.length - 1,
      Math.floor(markerIndex * threats.length / markers.length));
    const threat = threats[threatIndex];
    const gx = ownGoal.x - threat.x, gy = ownGoal.y - threat.y;
    const gm = Math.max(1, Math.hypot(gx, gy));
    const mark = { x:threat.x + gx / gm * 52, y:threat.y + gy / gm * 52 };
    target = { x:mark.x * .72 + fallback.x * .28,
      y:mark.y * .72 + fallback.y * .28 };
  }

  // 공격이 고르는 것과 같은 레인 위험 함수·패스 대상을 공유한다.
  const receiver = passTarget(owner);
  if (receiver) {
    const laneMid = { x:owner.x + (receiver.x - owner.x) * .52,
      y:owner.y + (receiver.y - owner.y) * .52 };
    const guards = markers.slice().sort((a, b) =>
      Math.hypot(a.x - laneMid.x, a.y - laneMid.y) -
      Math.hypot(b.x - laneMid.x, b.y - laneMid.y)).slice(0, 2);
    if (guards.includes(p) && passLaneRisk(owner, receiver, [p]) < 160) {
      const lane = segmentPointDistance(p, owner, receiver);
      const q = Math.max(.28, Math.min(.76, lane.q));
      target = { x:owner.x + (receiver.x - owner.x) * q,
        y:owner.y + (receiver.y - owner.y) * q };
    }
  }

  // 페널티 지역 쪽에서는 두 수비수가 슈터와 골문 사이를 직접 막는다.
  const goalDistance = Math.hypot(owner.x - ownGoal.x, owner.y - ownGoal.y);
  if (p.role === 'DF' && goalDistance < FW * .38) {
    const gx = ownGoal.x - owner.x, gy = ownGoal.y - owner.y;
    const gm = Math.max(1, Math.hypot(gx, gy));
    const block = { x:owner.x + gx / gm * 88, y:owner.y + gy / gm * 88 };
    const blockers = teams[p.side].filter(t => t.role === 'DF')
      .sort((a, b) => Math.hypot(a.x - block.x, a.y - block.y) -
        Math.hypot(b.x - block.x, b.y - block.y)).slice(0, 3);
    const bi = blockers.indexOf(p);
    if (bi >= 0) {
      p.blockT = Math.max(p.blockT, .25);
      const offset = (bi - 1) * 20;
      target = { x:block.x - gy / gm * offset, y:block.y + gx / gm * offset };
    }
  }

  return {
    x:Math.max(R_PLAYER, Math.min(FW - R_PLAYER, target.x)),
    y:Math.max(R_PLAYER, Math.min(FH - R_PLAYER, target.y))
  };
}

function gkTarget(p) {
  const dir = attackDir[p.side];
  const gx = dir === 1 ? 0 : FW;

  // 크로스가 들어오면 나와서 잡는다. 항상 나오면 골문이 비고 안 나오면
  // 크로스가 무적이 되므로, 낙하 지점까지 제때 갈 수 있을 때만 나간다.
  // keeping 이 판단 거리를 늘려서 결정이 양극단으로 굳지 않게 한다.
  p.gkClaim = false;
  if (ball.z > FOOT_H && !ball.owner) {
    const land = ballLanding();
    if (land.t > 0.25 && inPenaltyArea(p.side, land.x, land.y)) {
      const reach = SPEED_RUN * land.t * (0.70 + p.stats.keeping / 99 * 0.50);
      if (Math.hypot(land.x - p.x, land.y - p.y) < reach) {
        p.gkClaim = true;
        return { x:land.x, y:land.y, claim:true };
      }
    }
  }

  // 골라인에서 조금 나와 공과 골문 중심을 잇는 선 위에 선다
  const t = Math.max(0, Math.min(1, 1 - Math.abs(ball.x - gx) / (FW * 0.35)));
  const out = 40 + t * (PA_D * 0.55);
  const keeping = .78 + p.stats.keeping / 99 * .18;
  const ty = FH / 2 + (ball.y - FH / 2) * keeping;
  return {
    x:gx + dir * out,
    y:Math.max((FH - GOAL_H) / 2 - 30, Math.min((FH + GOAL_H) / 2 + 30, ty)),
    claim:false
  };
}

function aiPlayer(p, dt, L, isChaser, offsideLine = null) {
  if (p.isGK) p.gkDifficulty = L.gk;
  p.aiT -= dt;
  if (p.aiT <= 0) {
    p.aiT = L.react * (p.isGK ? 0.5 : 1);
    let t;
    if (p.isGK) {
      t = gkTarget(p);
      // 하이볼을 잡으러 나가는 중이면 골문 폭 제한을 걸지 않는다.
      if (!t.claim) {
        // 골키퍼 반응은 별도 계수 — 난이도가 낮으면 늦게 붙는다
        t.y = FH / 2 + (t.y - FH / 2) * Math.min(1, L.gk);
        t.y = Math.max((FH - GOAL_H) / 2 - 30,
          Math.min((FH + GOAL_H) / 2 + 30, t.y));
      }
    } else if (ball.owner === p) {
      const dir = attackDir[p.side];
      t = { x:p.x + dir * 320, y:p.y + (FH / 2 - p.y) * 0.16 };
    } else if (isChaser) {
      const dir = attackDir[p.side];
      // 공중볼은 지금 위치가 아니라 낙하 지점으로 간다.
      const aim = ball.z > FOOT_H ? ballLanding() : ball;
      t = {
        x:aim.x - dir * (R_PLAYER + R_BALL + 4),
        y:aim.y + (Math.random() * 2 - 1) * L.aimErr
      };
    } else {
      const slot = slotTarget(p, offsideLine);
      t = defensiveTarget(p, slot, isChaser);
    }
    p.aiTx = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, t.x));
    p.aiTy = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, t.y));
  }

  let ax = p.aiTx - p.x, ay = p.aiTy - p.y;
  const d = Math.hypot(ax, ay);
  if (d > 6) {
    ax /= d; ay /= d;
  } else {
    // 위치를 지키는 동안에도 완전히 정지하지 않고 짧게 걸으며 시야를 잡는다.
    const patrol = clock * .7 + p.no * 1.7 + p.side * Math.PI;
    ax = Math.cos(patrol); ay = Math.sin(patrol);
  }

  let targetSpeed = SPEED_WALK;
  if (p.isGK) {
    // 하이볼을 잡으러 나갈 때만 전력으로 뛴다.
    targetSpeed = p.gkClaim ? SPEED_SPRINT : d > 120 ? SPEED_JOG : SPEED_WALK;
  } else if (ball.owner === p) {
    targetSpeed = SPEED_RUN;
  } else if (isChaser) {
    const chaseDistance = Math.hypot(ball.x - p.x, ball.y - p.y);
    targetSpeed = chaseDistance > 240 && p.energy > .08 ? SPEED_SPRINT
      : chaseDistance > 80 ? SPEED_RUN : SPEED_JOG;
  } else {
    const attacking = ball.owner && ball.owner.side === p.side;
    const forwardRun = attacking && p.role === 'FW' && d > 160 && p.energy > .08;
    targetSpeed = forwardRun ? SPEED_SPRINT
      : d > 430 ? SPEED_RUN : d > 140 ? SPEED_JOG : SPEED_WALK;
  }

  // 공이 발 앞에 있으면 슛이나 패스
  const bd = Math.hypot(ball.x - p.x, ball.y - p.y);
  if (ball.owner && ball.owner.side !== p.side && bd < TACKLE_TRIGGER && p.tackleCd <= 0) {
    p.tackleT = 0.22; p.tackleCd = 0.85;
  }
  if (bd < R_PLAYER + R_BALL + 24 && p.kickCd <= 0) {
    const dir = attackDir[p.side];
    const toGoal = dir === 1 ? FW - p.x : p.x;
    const exploitHighLine = teamTactics(p.side).width > .38 &&
      teamTactics(1 - p.side).line > .65;
    // 측면 깊은 위치면 크로스를 우선 검토한다. kickOwned 가 같은 조건에서
    // 체공을 붙이므로 여기서는 패스를 고르기만 하면 된다.
    const crossSpot = Math.min(p.y, FH - p.y) < FH * 0.24 && toGoal < FW * 0.42;
    if (p.isGK) {
      // 처리는 collide() 안에서 직접 한다 (잡아서 걷어내기)
    } else if (toGoal < FW * 0.39 && !crossSpot && Math.random() < AI_ACTION_RATE) {
      p.actShoot = 0.65; p.kickPower = 0.65;                  // 골문 근처면 슛
    } else if (crossSpot && Math.random() < AI_ACTION_RATE * .9) {
      p.actPass = 0.15; p.kickPower = 1;                      // 측면에서 크로스
    } else if (exploitHighLine && Math.random() < AI_ACTION_RATE * .8) {
      // 수비선이 높고 배후가 비면 칩으로 넘긴다.
      p.actThrough = 0.15; p.kickPower = 0.85;
    } else if (Math.random() < AI_ACTION_RATE * 0.8) {
      p.actPass = 0.15; p.kickPower = 0.2;                    // 아니면 땅볼 패스
    }
  }
  return { ax, ay, targetSpeed };
}

// ── 사람 입력 ──────────────────────────────────────────────────────
function readHuman(i) {
  let sx = 0, sy = 0;
  let keyboard = false;
  if (keys.KeyA || keys.ArrowLeft) { sx -= 1; keyboard = true; }
  if (keys.KeyD || keys.ArrowRight) { sx += 1; keyboard = true; }
  if (keys.KeyW || keys.ArrowUp) { sy -= 1; keyboard = true; }
  if (keys.KeyS || keys.ArrowDown) { sy += 1; keyboard = true; }
  if (stick.active) { sx += stick.dx; sy += stick.dy; }
  // 화면 위로 밀면 상대 골문(필드 +x) 쪽. 회전 시 입력도 같이 돌려야 한다.
  const sprint = !!keys.Semicolon;
  const walking = !!keys.Quote;
  const inputMag = Math.min(1, Math.hypot(sx, sy));
  const base = view.rot ? { ax:-sy, ay:sx } : { ax:sx, ay:sy };
  const v = { ax:base.ax * attackDir[i], ay:base.ay * attackDir[i] };
  v.targetSpeed = inputMag <= .01 ? 0
    : keyboard ? (walking ? SPEED_WALK : sprint ? SPEED_SPRINT : SPEED_RUN)
      : SPEED_SPRINT * inputMag;
  v.sprint = sprint; v.human = true; return v;
}

// 조작 대상 자동 전환. 히스테리시스를 둬서 두 선수가 비슷할 때 깜빡이지 않게 한다.
function pickControlled(teamIdx) {
  const side = teamIdx;
  const cur = ctrl[teamIdx];
  const best = nearestToBall(side, null);
  if (!cur) { ctrl[teamIdx] = best; return; }
  if (ctrlLock[teamIdx] > 0) return;
  if (cur.isGK) { ctrl[teamIdx] = best; return; }
  const dCur = Math.hypot(ball.x - cur.x, ball.y - cur.y);
  const dBest = best ? Math.hypot(ball.x - best.x, ball.y - best.y) : Infinity;
  if (best && best !== cur && dBest < dCur - 90) ctrl[teamIdx] = best;
}

function cycleControlled(teamIdx) {
  const players = teams[teamIdx]
    .filter(p => !p.isGK)
    .sort((a, b) => Math.hypot(ball.x - a.x, ball.y - a.y) -
                    Math.hypot(ball.x - b.x, ball.y - b.y));
  if (!players.length) return;
  const at = players.indexOf(ctrl[teamIdx]);
  ctrl[teamIdx] = players[(at + 1 + players.length) % players.length];
  ctrlLock[teamIdx] = 1.2;
}

function syncTouchActions() {
  const p = ctrl[0];
  const owned = p && ball.owner === p;
  shootBtn.textContent = owned ? '슛' : '태클';
  passBtn.textContent = owned ? '패스' : '전환';
  // 충전 게이지로 지금 얼마나 뜰지 보이게 한다. 소유 중에만 의미가 있다.
  setCharge(shootBtn, owned && p.shootHeld ? p.shootCharge : 0);
  setCharge(passBtn, owned && passHeld
    ? Math.min(1, (performance.now() - passHoldTimer) / KICK_CHARGE_MS) : 0);
}

function setCharge(btn, v) {
  btn.style.setProperty('--charge', v.toFixed(3));
}

// ── 루프 ───────────────────────────────────────────────────────────
function endHalf() {
  if (half === 1) {
    half = 2;
    attackDir[0] *= -1; attackDir[1] *= -1;
    clock = MATCH_SEC / 2; addedBank = 0; inAdded = false;
    state = 'halftime'; goalTimer = 1.5;
    ball.owner = null; ball.vx = ball.vy = 0;
    syncClock();
  } else {
    clock = 0; endMatch();
  }
}

function advanceClock(dt, stopped = false) {
  clock -= dt;
  if (stopped && !inAdded) addedBank += dt;
  if (clock > 0) return;
  if (!inAdded && addedBank > 0.05) {
    clock = addedBank; addedBank = 0; inAdded = true;
  } else {
    clock = 0; endHalf();
  }
  syncClock();
}

function step(dt) {
  if (notice.timer > 0) notice.timer -= dt;
  if (offside) {
    offside.timer -= dt;
    if (offside.timer <= 0) offside = null;
  }
  if (state === 'halftime') {
    goalTimer -= dt;
    if (goalTimer <= 0) {
      resetPositions(1);
      beginSetpiece('kickoff', 1, { x:FW / 2, y:FH / 2 });
    }
    return;
  }
  if (state === 'setpiece') {
    stepSetpiece(dt); syncClock(); return;
  }
  if (state === 'goal') {
    advanceClock(dt, true);
    if (state !== 'goal') return;
    goalTimer -= dt;
    if (goalTimer <= 0) {
      const kick = lastScorer === 0 ? 1 : 0;
      resetPositions(kick);
      beginSetpiece('kickoff', kick, { x:FW / 2, y:FH / 2 });
    }
    return;
  }
  if (state !== 'play') return;

  advanceClock(dt, false);
  if (state !== 'play') return;
  if (ball.owner) matchStats.possession[ball.owner.side] += dt;

  const L = LEVELS[level];
  ctrlLock[0] = Math.max(0, ctrlLock[0] - dt);
  ctrlLock[1] = Math.max(0, ctrlLock[1] - dt);
  pickControlled(0);

  const chaser = [
    new Set(nearestChasers(0, null)),
    new Set(nearestChasers(1, null))
  ];
  const offsideLine = level > 0
    ? [secondLastDefenderLine(0), secondLastDefenderLine(1)] : [null, null];

  for (const side of [0, 1]) {
    const human = side === 0;
    const inp = human ? readHuman(side) : null;
    for (const p of teams[side]) {
      if (human && p === ctrl[side]) {
        const im = Math.hypot(inp.ax, inp.ay);
        p.manualAim = !!inp.human && im > 0.15;
        if (p.manualAim) { p.aimX = inp.ax / im; p.aimY = inp.ay / im; }
        const ownerMul = ball.owner === p ? OWNER_SPEED : 1;
        const targetSpeed = staminaLimitedSpeed(p, inp.targetSpeed || 0, dt);
        movePlayer(p, inp.ax, inp.ay, dt,
          abilityAdjustedSpeed(p, inp.targetSpeed || 0, targetSpeed) * ownerMul);
      } else if (human) {
        // 사람 팀의 나머지 선수는 아군 AI (난이도와 무관하게 보통 수준)
        const a = aiPlayer(p, dt, LEVELS[1],
          chaser[side].has(p) && p !== ctrl[side], offsideLine[side]);
        const targetSpeed = staminaLimitedSpeed(p, a.targetSpeed, dt);
        movePlayer(p, a.ax, a.ay, dt,
          abilityAdjustedSpeed(p, a.targetSpeed, targetSpeed));
      } else {
        const a = aiPlayer(p, dt, L, chaser[side].has(p), offsideLine[side]);
        const targetSpeed = staminaLimitedSpeed(p, a.targetSpeed, dt);
        movePlayer(p, a.ax, a.ay, dt,
          abilityAdjustedSpeed(p, a.targetSpeed, targetSpeed) *
          (mode === '1p' ? OPPONENT_SPEED_MUL[level] : 1));
      }
    }
  }

  separateAll();
  if (state !== 'play') return;
  if (ball.owner) {
    const p = ball.owner;
    if (p.actShoot > 0) kickOwned(p, 'shoot', p.actShoot);
    else if (p.actThrough > 0) kickOwned(p, 'through', p.kickPower);
    else if (p.actPass > 0) kickOwned(p, 'pass', p.kickPower);
  }
  updateBall(dt);
  if (state !== 'play') return;                        // 소유한 채 득점한 경우 중단
  for (const side of [0, 1]) for (const p of teams[side]) collide(p);
  if (outOfPlay(ball.x, ball.y)) return;
  updateCamera(dt);
  syncClock();
  syncTouchActions();
}

function endMatch() {
  state = 'end';
  const summary = matchSummaryText();
  if (competition) competition.lastMatch = summary;
  if (mode === '1p') saveBest(score[0] - score[1]);
  const knockout = competition && (competition.type === 'tournament' ||
    (competition.type === 'season' && competition.phase === 'cup'));
  if (knockout) {
    if (score[0] === score[1]) { beginShootout(); return; }
    finishTournamentMatch(score[0] > score[1]);
    return;
  }
  if (competition && (competition.type === 'league' ||
      (competition.type === 'season' && competition.phase === 'league'))) {
    finishLeagueMatch(); return;
  }
  const ov = document.getElementById('overlay');
  const win = score[0] > score[1] ? '승리' : score[0] < score[1] ? '패배' : '무승부';
  ov.querySelector('h1').textContent = `${win}  ${score[0]} : ${score[1]}`;
  document.getElementById('howto').innerHTML = mode === '1p'
    ? `${LEVELS[level].name} 난이도 경기가 끝났습니다.` : '경기가 끝났습니다.';
  document.getElementById('btn1p').textContent = '다시 하기';
  const home = document.getElementById('btnHome');
  home.hidden = false; home.textContent = '처음으로';
  document.getElementById('levelRow').style.display = mode === '1p' ? '' : 'none';
  document.getElementById('lengthRow').style.display = '';
  document.getElementById('modeInfo').textContent = summary;
  ov.classList.remove('hidden');
  showBest();
}

function matchSummaryText() {
  const total = matchStats.possession[0] + matchStats.possession[1];
  const homePoss = total ? Math.round(matchStats.possession[0] / total * 100) : 50;
  const awayPoss = 100 - homePoss;
  return [
    `기록                우리  상대`,
    `점유율             ${homePoss}%   ${awayPoss}%`,
    `슛 / 유효슈팅      ${matchStats.shots[0]}/${matchStats.onTarget[0]}   ` +
      `${matchStats.shots[1]}/${matchStats.onTarget[1]}`,
    `코너               ${matchStats.corners[0]}     ${matchStats.corners[1]}`,
    `파울 / 카드        ${matchStats.fouls[0]}/${matchStats.cards[0]}   ` +
      `${matchStats.fouls[1]}/${matchStats.cards[1]}`
  ].join('\n');
}

// ── 그리기 ─────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#152528';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  applyFieldTransform();
  drawPitch();
  if (offside) drawOffsideLine();
  for (const side of [0, 1]) for (const p of teams[side]) drawPlayer(p);
  drawBall();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawMinimap();
  if (state === 'goal') drawGoalText();
  if (state === 'setpiece') drawSetpieceText();
  if (state === 'halftime') drawBannerText('하프타임', C.away);
  if (notice.timer > 0) drawNotice();
}

function drawOffsideLine() {
  ctx.save();
  ctx.strokeStyle = '#F2CE7A'; ctx.lineWidth = 5;
  ctx.setLineDash([18, 14]);
  ctx.beginPath(); ctx.moveTo(offside.lineX, 0); ctx.lineTo(offside.lineX, FH); ctx.stroke();
  ctx.restore();
}

function drawPitch() {
  ctx.fillStyle = C.turf;
  ctx.fillRect(0, 0, FW, FH);
  ctx.fillStyle = C.turfAlt;
  const stripes = 14, sw = FW / stripes;
  for (let i = 0; i < stripes; i += 2) ctx.fillRect(i * sw, 0, sw, FH);

  ctx.strokeStyle = C.line; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, FW - 4, FH - 4);
  ctx.beginPath(); ctx.moveTo(FW / 2, 0); ctx.lineTo(FW / 2, FH); ctx.stroke();
  ctx.beginPath(); ctx.arc(FW / 2, FH / 2, CIRCLE_R, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = C.line;
  ctx.beginPath(); ctx.arc(FW / 2, FH / 2, 7, 0, Math.PI * 2); ctx.fill();

  for (const gx of [0, FW]) {
    const dir = gx === 0 ? 1 : -1;
    ctx.strokeRect(gx === 0 ? 0 : FW - PA_D, (FH - PA_W) / 2, PA_D, PA_W);
    ctx.strokeRect(gx === 0 ? 0 : FW - GA_D, (FH - GA_W) / 2, GA_D, GA_W);
    ctx.beginPath(); ctx.arc(gx + dir * PEN_SPOT, FH / 2, 7, 0, Math.PI * 2); ctx.fill();
  }

  for (const x of [0, FW]) for (const y of [0, FH]) {
    const a0 = x === 0 ? (y === 0 ? 0 : -Math.PI / 2) : (y === 0 ? Math.PI / 2 : Math.PI);
    ctx.beginPath(); ctx.arc(x, y, 20, a0, a0 + Math.PI / 2); ctx.stroke();
  }

  // 골문
  const gy = (FH - GOAL_H) / 2;
  ctx.lineWidth = 10;
  ctx.strokeStyle = C.home;
  ctx.beginPath(); ctx.moveTo(3, gy); ctx.lineTo(3, gy + GOAL_H); ctx.stroke();
  ctx.strokeStyle = C.away;
  ctx.beginPath(); ctx.moveTo(FW - 3, gy); ctx.lineTo(FW - 3, gy + GOAL_H); ctx.stroke();
}

function drawRadius(physicalRadius, minDiameterPx) {
  return Math.max(physicalRadius,
    minDiameterPx * view.dpr / (2 * Math.max(view.scale, 1e-6)));
}

function drawPlayer(p) {
  const isCtrl = p === ctrl[0];
  const base = p.side === 0
    ? (p.isGK ? C.gkHome : C.home)
    : (p.isGK ? C.gkAway : C.away);
  const r = drawRadius(R_PLAYER, DRAW_PLAYER_MIN_PX);

  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(p.x + r * .18, p.y + r * .25,
    r, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = base;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  if (p.blockT > 0) {
    ctx.strokeStyle = base; ctx.lineWidth = r * .65; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y - r * 1.35);
    ctx.lineTo(p.x, p.y + r * 1.35); ctx.stroke();
  }

  // 조작 중인 선수는 흰 테두리 + 위쪽 삼각 표시 (22명 중에서 찾기 쉽게)
  if (isCtrl) {
    ctx.strokeStyle = '#F2F7F4'; ctx.lineWidth = Math.max(2, r * .18);
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.22, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.translate(p.x, p.y - r * 1.75);
    if (view.rot) ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#F2F7F4';
    const marker = r * .42;
    ctx.beginPath(); ctx.moveTo(0, marker); ctx.lineTo(-marker, -marker * .55);
    ctx.lineTo(marker, -marker * .55); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (p.yellow) {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (view.rot) ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#F2CE4A';
    ctx.fillRect(r * .48, -r * 1.12, r * .42, r * .62);
    ctx.restore();
  }

  // 등번호는 세워서 그린다
  ctx.save();
  ctx.translate(p.x, p.y);
  if (view.rot) ctx.rotate(Math.PI / 2);
  ctx.fillStyle = '#152528';
  ctx.font = '700 ' + Math.max(7, r * 1.05) + 'px ' + bodyFont();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.isGK ? 'GK' : String(p.no), 0, 1);
  ctx.restore();
}

function drawBall() {
  const base = drawRadius(R_BALL, DRAW_BALL_MIN_PX);
  const r = base * Math.min(BALL_GROW_MAX, 1 + ball.z / BALL_GROW);
  const lift = ball.z * BALL_LIFT;

  // 화면 위쪽은 가로 화면에서 필드 -y, 세로 화면에서 필드 +x 다.
  // 변환이 화면y = -s·필드x 로 사상하기 때문이다. 필드 좌표로 그냥 빼면
  // 세로 화면에서 공이 위가 아니라 옆으로 뜬다.
  const ox = view.rot ? lift : 0;
  const oy = view.rot ? 0 : -lift;

  // 그림자는 지면에 남는다. 공과 벌어지는 거리가 높이의 주된 단서다.
  const sh = base * (1 - Math.min(.45, ball.z / 600));
  ctx.fillStyle = `rgba(0,0,0,${Math.max(.12, .34 - ball.z / 900).toFixed(3)})`;
  ctx.beginPath();
  ctx.ellipse(ball.x, ball.y, sh, sh * .8, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = C.ball;
  ctx.beginPath(); ctx.arc(ball.x + ox, ball.y + oy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#152528';
  ctx.beginPath(); ctx.arc(ball.x + ox, ball.y + oy, r * 0.42, 0, Math.PI * 2); ctx.fill();
}

// 미니맵은 화면 좌표로 그린다(경기장 변환·회전과 무관하게 항상 가로).
// 위치는 우측 상단 — 아래쪽은 조이스틱(좌)과 슛·패스 버튼(우)이 차지한다.
function drawMinimap() {
  const pad = 10 * view.dpr;
  const mw = Math.min(canvas.width * 0.40, 320 * view.dpr);
  const mh = mw * (FH / FW);
  const mx = canvas.width - mw - pad, my = pad;
  const sx = mw / FW, sy = mh / FH;

  ctx.fillStyle = C.mapBg;
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = '#52777E'; ctx.lineWidth = 1.4 * view.dpr;
  ctx.strokeRect(mx + .5, my + .5, mw - 1, mh - 1);
  ctx.beginPath(); ctx.moveTo(mx + mw / 2, my); ctx.lineTo(mx + mw / 2, my + mh); ctx.stroke();

  // 현재 화면에 보이는 범위
  const sp = viewSpan();
  ctx.strokeStyle = 'rgba(242,247,244,.72)';
  ctx.lineWidth = 1.5 * view.dpr;
  ctx.strokeRect(mx + (cam.x - sp.x / 2) * sx, my + (cam.y - sp.y / 2) * sy, sp.x * sx, sp.y * sy);

  const r = Math.max(DRAW_PLAYER_MIN_PX * .12 * view.dpr, mw * 0.012);
  for (const side of [0, 1]) for (const p of teams[side]) {
    ctx.fillStyle = p.side === 0 ? C.home : C.away;
    ctx.beginPath(); ctx.arc(mx + p.x * sx, my + p.y * sy, r, 0, Math.PI * 2); ctx.fill();
    if (p === ctrl[0]) {
      ctx.strokeStyle = '#F2F7F4'; ctx.lineWidth = 1.8 * view.dpr;
      ctx.beginPath(); ctx.arc(mx + p.x * sx, my + p.y * sy,
        r + 2.2 * view.dpr, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.fillStyle = C.ball;
  const br = Math.max(DRAW_BALL_MIN_PX * .15 * view.dpr, r * .7);
  ctx.beginPath(); ctx.arc(mx + ball.x * sx, my + ball.y * sy, br, 0, Math.PI * 2); ctx.fill();
}

function drawGoalText() {
  ctx.fillStyle = 'rgba(21,37,40,.5)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = lastScorer === 0 ? C.home : C.away;
  ctx.font = '700 ' + Math.round(Math.min(canvas.width, canvas.height) * 0.16) + 'px ' + bodyFont();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('골!', canvas.width / 2, canvas.height / 2);
}

function drawBannerText(text, color = C.ball) {
  ctx.fillStyle = 'rgba(21,37,40,.48)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = color;
  ctx.font = '700 ' + Math.round(Math.min(canvas.width, canvas.height) * 0.10) + 'px ' + bodyFont();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
}

function drawSetpieceText() {
  if (!setpiece) return;
  const names = {
    throw:'스로인', goalkick:'골킥', corner:'코너킥',
    free:'프리킥', kickoff:'킥오프', penalty:'페널티킥'
  };
  ctx.fillStyle = 'rgba(21,37,40,.72)';
  ctx.fillRect(canvas.width / 2 - 90 * view.dpr, 12 * view.dpr, 180 * view.dpr, 34 * view.dpr);
  ctx.fillStyle = setpiece.side === 0 ? C.home : C.away;
  ctx.font = `700 ${14 * view.dpr}px ${bodyFont()}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(names[setpiece.type], canvas.width / 2, 29 * view.dpr);
}

function drawNotice() {
  ctx.fillStyle = 'rgba(21,37,40,.82)';
  ctx.fillRect(canvas.width / 2 - 110 * view.dpr, 52 * view.dpr, 220 * view.dpr, 36 * view.dpr);
  ctx.fillStyle = notice.color;
  ctx.font = `700 ${15 * view.dpr}px ${bodyFont()}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(notice.text, canvas.width / 2, 70 * view.dpr);
}

function bodyFont() { return getComputedStyle(document.body).fontFamily; }

// ── HUD·기록 ───────────────────────────────────────────────────────
function syncHud() {
  document.getElementById('sHome').textContent = score[0];
  document.getElementById('sAway').textContent = score[1];
  syncClock();
}
function syncClock() {
  const t = Math.max(0, Math.ceil(clock));
  document.getElementById('clock').textContent =
    `${half}H ` + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') +
    (inAdded ? '+' : '');
}

const OLD_KEY = 'ilbbang.soccer11.v1';
const SAVE_KEY = 'ilbbang.soccer11.v2';
function emptyRecord() { return { w:0, d:0, l:0, bestGd:0 }; }
function normalizeMatchSec(value) {
  const sec = +value;
  if (sec === 180) return 360;
  return [360, 600, 1200].includes(sec) ? sec : 600;
}
function defaultSave() {
  return {
    version:2,
    settings:{ level:1, matchSec:600, teams:[0,0], formation:'4-4-2', tactics:null },
    records:{ 0:emptyRecord(), 1:emptyRecord(), 2:emptyRecord() },
    progress:null
  };
}

function loadSaveData() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch {}
  const hadV2 = !!data && data.version === 2;
  if (!hadV2) data = defaultSave();
  data.settings = Object.assign(defaultSave().settings, data.settings || {});
  data.settings.matchSec = normalizeMatchSec(data.settings.matchSec);
  data.records = data.records || {};
  for (let i = 0; i < 3; i++) {
    if (!hadV2 || !data.records[i]) {
      try {
        data.records[i] = JSON.parse(localStorage.getItem(OLD_KEY + '.rec' + i)) ||
          emptyRecord();
      } catch { data.records[i] = emptyRecord(); }
    }
  }
  try {
    if (!hadV2) {
      const oldLevel = +localStorage.getItem(OLD_KEY + '.lvl');
      const oldSec = +localStorage.getItem(OLD_KEY + '.matchSec');
      if (Number.isInteger(oldLevel) && oldLevel >= 0 && oldLevel <= 2)
        data.settings.level = oldLevel;
      if ([180,360,600].includes(oldSec))
        data.settings.matchSec = normalizeMatchSec(oldSec);
    }
  } catch {}
  return data;
}

function saveGame() {
  if (!saveData) return;
  saveData.settings = {
    level, matchSec:MATCH_SEC, teams:selectedTeams.slice(),
    formation:selectedFormation[0],
    tactics:tacticOverride[0] ? Object.assign({}, tacticOverride[0]) : null
  };
  saveData.progress = competition ? JSON.parse(JSON.stringify(competition)) : null;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch {}
}

function loadRec(n = level) {
  return saveData && saveData.records[n] ? saveData.records[n] : emptyRecord();
}
function saveBest(gd) {
  const r = loadRec();
  if (gd > 0) r.w++; else if (gd === 0) r.d++; else r.l++;
  if (gd > r.bestGd) r.bestGd = gd;
  saveGame();
}
function showBest() {
  const r = loadRec();
  document.getElementById('best').textContent = (r.w + r.d + r.l)
    ? `${LEVELS[level].name} 전적 ${r.w}승 ${r.d}무 ${r.l}패 · 최다 득점차 +${r.bestGd}` : '';
}
function selectLevel(n) {
  level = n;
  for (const b of document.querySelectorAll('.lvl')) b.classList.toggle('sel', +b.dataset.lvl === n);
  saveGame();
  showBest();
}

function selectLength(sec) {
  MATCH_SEC = sec;
  for (const b of document.querySelectorAll('.len'))
    b.classList.toggle('sel', +b.dataset.sec === sec);
  saveGame();
  if (state === 'title') { clock = MATCH_SEC / 2; half = 1; syncClock(); }
}

function syncTeamPanel() {
  const team = TEAM_DEFS[selectedTeams[0]];
  document.getElementById('homeTeam').value = String(selectedTeams[0]);
  document.getElementById('awayTeam').value = String(selectedTeams[1]);
  document.getElementById('formationPick').value = selectedFormation[0];
  document.getElementById('teamRating').textContent =
    `${team.name} 종합 ${ratingBars(team)} · 속도/슛/패스/수비/체력/선방`;
  const t = teamTactics(0);
  document.getElementById('lineTactic').value = Math.round(t.line * 100);
  document.getElementById('pressTactic').value = Math.round(t.press * 100);
  document.getElementById('widthTactic').value = Math.round(t.width * 100);
  document.getElementById('chaserTactic').value = String(t.chasers);
}

function selectTeam(side, n) {
  selectedTeams[side] = Math.max(0, Math.min(TEAM_DEFS.length - 1, n));
  selectedFormation[side] = TEAM_DEFS[selectedTeams[side]].formation;
  tacticOverride[side] = null;
  syncTeamPanel();
  saveGame();
}

function initTeamUi() {
  for (const id of ['homeTeam', 'awayTeam']) {
    const el = document.getElementById(id);
    for (let i = 0; i < TEAM_DEFS.length; i++) {
      const o = document.createElement('option');
      o.value = String(i); o.textContent = `${TEAM_DEFS[i].name} ${ratingBars(TEAM_DEFS[i])}`;
      el.appendChild(o);
    }
  }
  const formation = document.getElementById('formationPick');
  for (const name of Object.keys(FORMATIONS)) {
    const o = document.createElement('option'); o.value = name; o.textContent = name;
    formation.appendChild(o);
  }
  document.getElementById('homeTeam').addEventListener('change', e => selectTeam(0, +e.target.value));
  document.getElementById('awayTeam').addEventListener('change', e => selectTeam(1, +e.target.value));
  formation.addEventListener('change', e => {
    selectedFormation[0] = e.target.value; saveGame();
  });
  for (const id of ['lineTactic','pressTactic','widthTactic','chaserTactic']) {
    document.getElementById(id).addEventListener('input', () => {
      tacticOverride[0] = {
        line:+document.getElementById('lineTactic').value / 100,
        press:+document.getElementById('pressTactic').value / 100,
        width:+document.getElementById('widthTactic').value / 100,
        chasers:+document.getElementById('chaserTactic').value
      };
      saveGame();
    });
  }
  syncTeamPanel();
}

// ── 시작 ───────────────────────────────────────────────────────────
const HOWTO = isTouch
  ? '공을 잡으면 이동 방향으로 조준합니다. <span class="keys">슛/태클</span> · <span class="keys">패스/선수전환</span> 버튼의 의미가 소유 여부에 따라 바뀝니다.<br>패스 버튼을 길게 누르면 스루패스, 스틱 세기가 걷기부터 스프린트까지 속도를 정합니다.'
  : '<span class="keys">WASD/방향키</span> 이동·조준 · <span class="keys">;</span> 스프린트 · <span class="keys">\'</span> 걷기<br><span class="keys">Enter</span> 슛(공이 없으면 태클) · <span class="keys">오른쪽 Shift</span> 패스 · <span class="keys">/</span> 스루패스 · <span class="keys">.</span> 선수전환<br>슛·패스는 누른 길이가 세기와 높이를 정합니다.';

function showTitle() {
  state = 'title';
  solo = false; soloPlayer = null;      // 연습 모드는 제목 화면으로 나오면 꺼진다
  const ov = document.getElementById('overlay');
  ov.querySelector('h1').textContent = '동네 축구';
  document.getElementById('howto').innerHTML = HOWTO;
  document.getElementById('btn1p').textContent = 'AI와 대전';
  document.getElementById('btnHome').hidden = true;
  setConfigVisible(true);
  document.getElementById('modeInfo').textContent = '';
  resetModeButtons();
  document.getElementById('btnCancelCompetition').textContent = '진행 포기';
  if (competition) {
    const id = competition.type === 'tournament' ? 'btnTournament' :
      competition.type === 'league' ? 'btnLeague' : 'btnSeason';
    setModeButtons(id, competition.type === 'tournament' ? '토너먼트 이어하기' :
      competition.type === 'league' ? '리그 이어하기' : '시즌 이어하기');
  }
  ov.classList.remove('hidden');
  showBest();
}

for (const b of document.querySelectorAll('.lvl'))
  b.addEventListener('click', () => selectLevel(+b.dataset.lvl));
for (const b of document.querySelectorAll('.len'))
  b.addEventListener('click', () => selectLength(+b.dataset.sec));
document.getElementById('btn1p').addEventListener('click', () => startMatch('1p'));
document.getElementById('btnHome').addEventListener('click', showTitle);
document.getElementById('btnPractice').addEventListener('click', startPractice);
document.getElementById('btnTournament').addEventListener('click', () => {
  if (!competition) startTournament();
  else if (competition.shootout) {
    shootout = competition.shootout; showShootoutScreen();
  } else startTournamentMatch();
});
document.getElementById('btnLeague').addEventListener('click', () => {
  if (!competition) startLeague('league'); else startLeagueMatch();
});
document.getElementById('btnSeason').addEventListener('click', () => {
  if (!competition) { startLeague('season'); return; }
  if (competition.shootout) {
    shootout = competition.shootout; showShootoutScreen(); return;
  }
  if (competition.phase === 'league') startLeagueMatch();
  else if (competition.phase === 'cup') startCupMatch();
  else {
    competition = createLeague(competition.userTeam, 'season',
      competition.seasonNo + 1, competition.trophies);
    saveGame(); showLeagueReady();
  }
});
document.getElementById('btnCancelCompetition').addEventListener('click', () => {
  competition = null; shootout = null; saveGame();
  document.getElementById('btnCancelCompetition').textContent = '진행 포기';
  showTitle();
});
for (const b of document.querySelectorAll('[data-pk]'))
  b.addEventListener('click', () => takePenaltyRound(+b.dataset.pk));

document.getElementById('howto').innerHTML = HOWTO;
saveData = loadSaveData();
const settings = saveData.settings;
competition = saveData.progress &&
  ['tournament','league','season'].includes(saveData.progress.type)
  ? saveData.progress : null;
selectedTeams[0] = Math.max(0, Math.min(TEAM_DEFS.length - 1, +(settings.teams || [0])[0] || 0));
selectedTeams[1] = Math.max(0, Math.min(TEAM_DEFS.length - 1, +(settings.teams || [0,0])[1] || 0));
selectedFormation[0] = FORMATIONS[settings.formation]
  ? settings.formation : TEAM_DEFS[selectedTeams[0]].formation;
selectedFormation[1] = TEAM_DEFS[selectedTeams[1]].formation;
tacticOverride[0] = settings.tactics || null;
if (competition) {
  selectedTeams[0] = competition.userTeam;
  const restoredOpponent = competition.type === 'tournament'
    ? competition.opponents[competition.round]
    : competition.phase === 'cup'
      ? competition.cupOpponents[competition.cupRound]
      : competition.phase === 'league'
        ? (leagueUserFixture(competition) || []).find(n => n !== competition.userTeam)
        : selectedTeams[1];
  selectedTeams[1] = restoredOpponent ?? 0;
  selectedFormation[1] = TEAM_DEFS[selectedTeams[1]].formation;
  shootout = competition.shootout || null;
}
initTeamUi();
selectLevel(Math.min(2, Math.max(0, +settings.level || 1)));
selectLength(normalizeMatchSec(settings.matchSec));
if (competition) {
  if (shootout) showShootoutScreen();
  else if (competition.type === 'tournament') showTournamentReady();
  else if (competition.phase === 'league') showLeagueReady();
  else if (competition.phase === 'cup') showCupReady();
  else showSeasonComplete(!!competition.cupWon);
}

resize();
requestAnimationFrame(resize);        // 초기 flex/header 레이아웃이 확정된 뒤 한 번 보정
buildTeams();
resetPositions(0);

// ── 연습 모드 ──────────────────────────────────────────────────────
// 혼자 조작 감각을 시험하는 모드. 나머지 선수를 구석에 치우고 시계를
// 멈춘다. 제목 화면의 「연습 모드」 버튼으로만 켜지며, 그 전에는 아래
// 코드가 한 줄도 돌지 않는다.
let solo = false;
let soloKeeper = false, soloRival = false, soloHelp = true;
let soloPlayer = null;

function soloKept(p) {
  if (p === soloPlayer) return true;
  if (soloKeeper && p.isGK && p.side === 1) return true;
  if (soloRival && p.side === 1 && p.no === 5) return true;
  return false;
}

// 치운 선수는 목표 지점을 자기 자리로 고정해 가속하지 않게 한다.
function soloTick() {
  if (!solo) return;
  if (state === 'title' || state === 'end') { soloPlayer = null; return; }

  // buildTeams() 가 선수 객체를 새로 만들므로 배열에 남아 있는지로 확인한다.
  // 옛 객체를 붙들면 조작이 먹지 않는다.
  if (!soloPlayer || teams[0].indexOf(soloPlayer) < 0) {
    soloPlayer = teams[0][9];
    soloPlayer.x = FW / 2 - 80; soloPlayer.y = FH / 2;
    soloPlayer.vx = soloPlayer.vy = 0;
    soloPlayer.aimX = attackDir[0]; soloPlayer.aimY = 0;
    ctrl[0] = soloPlayer;
    setpiece = null; offside = null; state = 'play';
    soloBall(0);
  }
  ctrl[0] = soloPlayer;            // 치운 선수에게 조작이 넘어가지 않게 한다
  ctrlLock[0] = 1;

  if (state === 'play') { clock = MATCH_SEC / 2; addedBank = 0; inAdded = false; }
  for (const side of [0, 1]) for (const p of teams[side]) {
    if (soloKept(p)) continue;
    p.x = 70 + p.no * 26; p.y = side === 0 ? 70 : FH - 70;
    p.vx = p.vy = 0; p.aiT = 1e9; p.aiTx = p.x; p.aiTy = p.y;
    p.tackleT = 0; p.blockT = 0; p.gkClaim = false;
  }
}

function soloBall(z) {
  const p = soloPlayer || ctrl[0];
  if (!p) return;
  ball.lastTouch = null; ball.freeCd = 0;
  ball.z = z; ball.vx = ball.vy = ball.vz = 0;
  ball.shotSide = -1; ball.shotCounted = ball.blockCounted = ball.headShot = false;
  setpiece = null; offside = null;
  if (state !== 'play') state = 'play';

  if (z <= FOOT_H) {
    // 지면 리셋은 소유까지 준다. 접촉 반경이 0.41m 뿐이라 공을 앞에
    // '놓기만' 하면 손이 닿지 않아 소유가 안 되고, 그 상태에서는
    // 패스·슛이 조용히 아무 일도 하지 않는다.
    p.trapCd = 0;
    ball.owner = p;
    ball.x = ball.prevX = p.x; ball.y = ball.prevY = p.y;
  } else {
    // 공중 리셋은 자유공이어야 튕김·헤딩을 시험할 수 있다.
    ball.owner = null;
    const d = R_PLAYER + R_BALL + 10;
    ball.x = ball.prevX = p.x + (p.aimX || attackDir[0]) * d;
    ball.y = ball.prevY = p.y + (p.aimY || 0) * d;
    p.trapCd = 0.4;
  }
}

function startPractice() {
  solo = true;
  soloPlayer = null; soloKeeper = false; soloRival = false; soloHelp = true;
  competition = null; shootout = null;
  startMatch('1p');
  soloTick();                        // 첫 프레임 전에 배치를 끝낸다
}

function exitPractice() {
  if (!solo) return;
  solo = false; soloPlayer = null;
  showTitle();
}

// 연습 모드가 꺼져 있으면 즉시 빠져나간다. 버튼으로만 켜진다.
addEventListener('keydown', e => {
  if (!solo || e.repeat) return;
  if (e.code === 'Escape') { e.preventDefault(); exitPractice(); return; }
  const keysUsed = ['KeyB','KeyV','KeyG','KeyT','KeyH',
                    'Digit1','Digit2','Digit3','Digit4'];
  if (!keysUsed.includes(e.code)) return;
  e.preventDefault();
  if (e.code === 'KeyB' || e.code === 'Digit1') soloBall(0);
  if (e.code === 'Digit2') soloBall(0.75 * M);     // 가슴 구간
  if (e.code === 'Digit3') soloBall(1.8 * M);      // 헤딩 구간
  if (e.code === 'Digit4') soloBall(4 * M);        // 아무도 못 닿는 높이
  if (e.code === 'KeyV') { ball.vx = ball.vy = ball.vz = 0; }
  if (e.code === 'KeyG') soloKeeper = !soloKeeper;
  if (e.code === 'KeyT') soloRival = !soloRival;
  if (e.code === 'KeyH') soloHelp = !soloHelp;
});

function drawSoloHud() {
  if (!solo) return;
  const dpr = view.dpr, pad = 10 * dpr, lh = 16 * dpr;
  const p = soloPlayer;
  const band = ball.z <= FOOT_H ? '발' : ball.z <= CHEST_H ? '가슴'
    : ball.z <= HEAD_H ? '헤딩' : ball.z <= GK_HIGH_H ? 'GK만' : '무접촉';
  const lines = [
    `공 높이 ${(ball.z / M).toFixed(2)}m (${band})  ` +
      `속도 ${(Math.hypot(ball.vx, ball.vy) / M * 3.6).toFixed(1)}km/h  ` +
      `수직 ${(ball.vz / M).toFixed(1)}m/s`,
    `선수 ${p ? (Math.hypot(p.vx, p.vy) / M * 3.6).toFixed(1) : '-'}km/h  ` +
      `체력 ${p ? Math.round(p.energy * 100) : '-'}%  ` +
      `소유 ${ball.owner === p ? '나' : ball.owner ? '상대' : '없음'}  ` +
      `충전 ${p ? (p.shootCharge || 0).toFixed(2) : '-'}`,
    `상대GK ${soloKeeper ? 'ON' : 'off'}  상대선수 ${soloRival ? 'ON' : 'off'}  ` +
      `슛 ${matchStats.shots[0]}  헤딩 ${matchStats.headers[0]}  득점 ${score[0]}`
  ];
  if (soloHelp) lines.push(
    'B 공 리셋 · 1~4 높이(0/0.75/1.8/4m) · V 공 정지 · G 상대GK · T 상대선수 · ' +
    'H 도움말 · Esc 나가기');

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = `${12 * dpr}px ${bodyFont()}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const w = Math.max(...lines.map(t => ctx.measureText(t).width)) + pad * 2;
  const boxH = lh * lines.length + pad;
  ctx.fillStyle = 'rgba(21,37,40,.82)';
  ctx.fillRect(pad, canvas.height - pad - boxH, w, boxH);
  ctx.fillStyle = '#F2F7F4';
  lines.forEach((t, i) =>
    ctx.fillText(t, pad * 2, canvas.height - pad - boxH + pad / 2 + lh * i));
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);   // 백그라운드 복귀 시 점프 방지
  last = now;
  soloTick();
  step(dt);
  draw();
  drawSoloHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
