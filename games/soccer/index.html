<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동네 축구 11v11 — 일빵</title>
<style>
  :root {
    /* 런처(청자 팔레트)에서 그대로 가져온 색 */
    --bg-canvas:#152528; --bg-surface:#1D3236; --bg-raised:#264046;
    --text-strong:#F2F7F4; --text-body:#D5E4E1; --text-muted:#8FA8A7;
    --accent:#F58A5E; --accent-hover:#FFA079; --accent-fg:#23140C;
    --border-subtle:#2B474C; --gold:#F2CE7A;
    --font: "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--bg-canvas); color:var(--text-body); font-family:var(--font);
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none;
  }
  header {
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:9px 12px; border-bottom:1px solid var(--border-subtle);
  }
  .back {
    color:var(--text-muted); text-decoration:none; font-size:13px;
    padding:6px 10px; border-radius:8px; border:1px solid var(--border-subtle); flex:0 0 auto;
  }
  .scoreboard { flex:1; display:flex; align-items:center; justify-content:center; gap:10px; }
  .team { font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .team.home { color:var(--accent); }
  .team.away { color:var(--gold); }
  .score { font-size:24px; font-weight:700; color:var(--text-strong);
           font-variant-numeric:tabular-nums; letter-spacing:1px; }
  .clock { flex:0 0 auto; font-size:14px; color:var(--text-strong);
           font-variant-numeric:tabular-nums; min-width:68px; text-align:right; }

  #stage { flex:1; position:relative; min-height:0; }
  canvas { display:block; width:100%; height:100%; }

  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(21,37,40,.88); padding:22px; overflow:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:clamp(22px,5.5vw,38px); color:var(--text-strong); font-weight:700; }
  #overlay p { font-size:13.5px; color:var(--text-muted); line-height:1.75; max-width:36em; }
  .keys { color:var(--text-body); font-weight:700; }
  .btnrow { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }
  button {
    font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer;
    padding:12px 20px; border-radius:10px; border:1px solid var(--accent);
    background:var(--accent); color:var(--accent-fg);
  }
  button.ghost { background:transparent; color:var(--text-body); border-color:var(--border-subtle); }
  button:active { transform:translateY(1px); }
  #levelRow button { padding:8px 16px; font-size:14px; }
  #levelRow button.sel, #lengthRow button.sel {
    background:var(--bg-raised); color:var(--gold); border-color:var(--gold);
  }
  #lengthRow button { padding:7px 13px; font-size:13px; }
  .best { font-size:12.5px; color:var(--gold); }
  .teamSetup {
    display:grid; grid-template-columns:auto minmax(120px,1fr); gap:7px 9px;
    align-items:center; width:min(390px,100%); font-size:12px; text-align:left;
  }
  select, input[type="range"] {
    width:100%; font:inherit; color:var(--text-body); background:var(--bg-raised);
    border:1px solid var(--border-subtle); border-radius:7px; padding:7px;
  }
  .rating { grid-column:1/-1; color:var(--gold); text-align:center; min-height:18px; }
  .modeInfo {
    width:min(430px,100%); color:var(--text-body); font-size:13px;
    line-height:1.65; white-space:pre-line;
  }
  .pkRow button { min-width:84px; }
  [hidden] { display:none !important; }
  details.tactics {
    width:min(390px,100%); border:1px solid var(--border-subtle);
    border-radius:9px; padding:7px 10px; color:var(--text-muted); font-size:12px;
  }
  details.tactics summary { cursor:pointer; text-align:center; }
  .tacticGrid { display:grid; grid-template-columns:auto 1fr; gap:7px; margin-top:9px; }

  /* 모바일 조작 */
  #touch { position:absolute; inset:0; display:none; }
  #touch.on { display:block; }
  #stick {
    position:absolute; left:0; top:0; width:132px; height:132px; margin:-66px 0 0 -66px;
    border-radius:50%; border:2px solid var(--border-subtle); background:rgba(38,64,70,.45);
    display:none; pointer-events:none;
  }
  #stick.on { display:block; }
  #knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px;
          border-radius:50%; background:var(--accent); opacity:.9; }
  .actbtn {
    position:absolute; border-radius:50%; pointer-events:auto; font-weight:700;
    border:2px solid var(--accent); background:rgba(245,138,94,.2); color:var(--accent);
    padding:0; white-space:nowrap;      /* 기본 padding 때문에 '패스'가 두 줄로 깨졌다 */
    overflow:hidden; isolation:isolate;
  }
  /* 충전 게이지. 버튼을 늘리지 않고 지금 얼마나 뜰지 보여준다.
     --charge 0~1 을 아래에서 위로 채운다. 글자는 z-index 로 위에 남긴다. */
  .actbtn::after {
    content:''; position:absolute; left:0; right:0; bottom:0; z-index:-1;
    height:calc(var(--charge, 0) * 100%);
    background:currentColor; opacity:.42;
  }
  #shoot { right:18px; bottom:18px; width:82px; height:82px; font-size:15px; }
  #pass  { right:106px; bottom:40px; width:66px; height:66px; font-size:13px;
           border-color:var(--gold); background:rgba(242,206,122,.18); color:var(--gold); }
  .actbtn:active { filter:brightness(1.5); }
  .actbtn.held { transform:scale(.94); filter:brightness(1.45); }
</style>
</head>
<body>

<header>
  <a class="back" href="../../">← 목록</a>
  <div class="scoreboard">
    <span class="team home" id="nameHome">우리</span>
    <span class="score"><span id="sHome">0</span> : <span id="sAway">0</span></span>
    <span class="team away" id="nameAway">AI</span>
  </div>
  <div class="clock" id="clock">3:00</div>
</header>

<div id="stage">
  <canvas id="c"></canvas>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="pass" class="actbtn">패스</button>
    <button id="shoot" class="actbtn">슛</button>
  </div>

  <div id="overlay">
    <h1>동네 축구</h1>
    <p id="howto"></p>
    <div class="btnrow" id="levelRow">
      <button class="lvl ghost" data-lvl="0">쉬움</button>
      <button class="lvl ghost" data-lvl="1">보통</button>
      <button class="lvl ghost" data-lvl="2">어려움</button>
    </div>
    <div class="btnrow" id="lengthRow">
      <button class="len ghost" data-sec="360">6분</button>
      <button class="len ghost" data-sec="600">10분</button>
      <button class="len ghost" data-sec="1200">20분</button>
    </div>
    <div class="teamSetup" id="teamSetup">
      <label for="homeTeam">우리 팀</label><select id="homeTeam"></select>
      <label for="awayTeam">상대 팀</label><select id="awayTeam"></select>
      <label for="formationPick">포메이션</label><select id="formationPick"></select>
      <div class="rating" id="teamRating"></div>
    </div>
    <details class="tactics" id="tacticsPanel">
      <summary>우리 팀 전술</summary>
      <div class="tacticGrid">
        <label for="lineTactic">수비선</label><input id="lineTactic" type="range" min="45" max="70">
        <label for="pressTactic">압박</label><input id="pressTactic" type="range" min="25" max="55">
        <label for="widthTactic">폭</label><input id="widthTactic" type="range" min="20" max="45">
        <label for="chaserTactic">추격</label>
        <select id="chaserTactic"><option value="1">1명</option><option value="2">2명</option></select>
      </div>
    </details>
    <div class="btnrow" id="quickRow">
      <button id="btn1p">AI와 대전</button>
      <button id="btnHome" class="ghost" hidden>처음으로</button>
      <button id="btnPractice" class="ghost">연습 모드</button>
    </div>
    <div class="btnrow" id="modeRow">
      <button id="btnTournament" class="ghost">8팀 토너먼트</button>
      <button id="btnLeague" class="ghost">14경기 리그</button>
      <button id="btnSeason" class="ghost">시즌</button>
      <button id="btnCancelCompetition" class="ghost" hidden>진행 포기</button>
    </div>
    <div class="btnrow pkRow" id="pkRow" hidden>
      <button data-pk="0" class="ghost">왼쪽</button>
      <button data-pk="1" class="ghost">가운데</button>
      <button data-pk="2" class="ghost">오른쪽</button>
    </div>
    <div class="modeInfo" id="modeInfo"></div>
    <div class="best" id="best"></div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// 동네 축구 11v11 — 톱다운, 카메라 추적
//
// 좌표계: 경기장은 항상 논리 단위(1m = 20단위)로 계산하고, 화면 크기와
// 회전은 그리기·입력 변환 단계에서만 반영한다. 창 크기나 기기 화면비가
// 경기 결과를 바꾸지 않게 하려는 것이다.
//
// 실제 규격(105m x 68m)을 그대로 옮겼다. 페널티박스·골에어리어·센터서클·
// 페널티마크 치수도 실측값이다. 골문만은 예외로 넓혔다 — 실제 7.32m
// (=146단위)로 두면 골키퍼가 있는 상태에서 득점이 거의 불가능하다.
// ═══════════════════════════════════════════════════════════════════

const M = 20;                        // 1미터 = 20 논리단위
const FW = 105 * M, FH = 68 * M;     // 2100 x 1360
const GOAL_H = 146;                  // 7.32m 규정
const PA_D = 16.5 * M, PA_W = 40.3 * M;   // 페널티 에어리어
const GA_D = 5.5 * M,  GA_W = 18.32 * M;  // 골 에어리어
const CIRCLE_R = 9.15 * M;
const PEN_SPOT = 11 * M;

const R_PLAYER = 6, R_BALL = 2.2;    // 물리 반경: 지름 0.6m / 0.22m
let GK_REACH_MUL = 6.0;
// 물리 축척과 화면 가독성을 분리한다. 실제 반경은 충돌에만 쓰고 그리기는
// CSS px 최소 지름을 보장한다. 카메라 줌은 2단계에서 별도로 정한다.
const DRAW_PLAYER_MIN_PX = 18, DRAW_BALL_MIN_PX = 8;
const CAMERA_LANDSCAPE_W = 40 * M, CAMERA_PORTRAIT_W = 26 * M;
const CAMERA_LEAD_MAX = 6 * M;

let MATCH_SEC = 600;
const GOAL_PAUSE = 1.6;

const C = {
  turf:'#1D3236', turfAlt:'#233C41', line:'#33565C',
  home:'#F58A5E', away:'#F2CE7A', ball:'#F2F7F4',
  gkHome:'#8FD1C4', gkAway:'#C9A6E0',
  mapBg:'rgba(21,37,40,.82)', mapLine:'#3D6169'
};

// AI 난이도. 상대 팀 11명 전체에 적용된다(우리 팀 동료는 항상 '보통' 수준).
// react=목표 재계산 간격, aimErr=공을 향할 때의 조준 오차,
// gk=골키퍼 반응. 물리 속도는 팀 능력치, 행동 시도율은 공통 상수다.
// 값은 결정론적 봇으로 난이도별 200경기 이상 자동 대전해 검증한다.
// 최종 목표 승률 80% / 53% / 23%, 10분 경기 총 2~3골.
//
// 0.84~0.94 상대 속도 배수 스윕을 각 200경기로 측정했을 때 과거 30경기의
// 급변은 재현되지 않았다. 난이도 차이는 react(반응 지연), aimErr(조준
// 오차), gk(골키퍼 위치·다이빙)를 포함한 전체 조합으로 관리하고 단계마다 측정한다.
const LEVELS = [
  { name:'쉬움',  react:0.90, aimErr:280, gk:0.85 },
  { name:'보통',  react:0.28, aimErr:100, gk:1.15 },
  { name:'어려움', react:0.08, aimErr:10,  gk:1.55 }
];
let level = 1;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── 화면·카메라 ────────────────────────────────────────────────────
// rot=true(세로 화면)면 경기장을 90° 돌려 세로로 쓴다. 안 돌리면 가로로
// 긴 경기장이 폰 폭에 맞춰져 납작한 띠가 된다.
let view = { scale:1, rot:false, w:0, h:0, dpr:1 };
let cam = { x:FW / 2, y:FH / 2 };

function resize() {
  const stage = document.getElementById('stage');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = stage.clientWidth, h = stage.clientHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const rot = h > w;
  const scale = cameraScale(w, h, rot, dpr);
  view = { rot, scale, w, h, dpr };
}
window.addEventListener('resize', resize);
if (typeof ResizeObserver !== 'undefined')
  new ResizeObserver(resize).observe(document.getElementById('stage'));

// 화면에 보이는 경기장 범위(논리단위)
function viewSpan() {
  const s = view.scale;
  return view.rot
    ? { x:canvas.height / s, y:canvas.width / s }    // 세로: 화면높이=필드x
    : { x:canvas.width / s,  y:canvas.height / s };
}

function cameraScale(w, h, rot, dpr = 1) {
  const primarySpan = rot ? CAMERA_PORTRAIT_W : CAMERA_LANDSCAPE_W;
  const primary = w * dpr / primarySpan;
  // 아주 납작하거나 긴 창에서도 반대 축으로 경기장 밖을 보이지 않는다.
  const secondary = h * dpr / (rot ? FW : FH);
  return Math.max(primary, secondary);
}

function updateCamera(dt) {
  const sp = viewSpan();
  const speed = Math.hypot(ball.vx, ball.vy);
  const lead = Math.min(CAMERA_LEAD_MAX, speed * .22);
  const leadX = speed > 1 ? ball.vx / speed * lead : 0;
  const leadY = speed > 1 ? ball.vy / speed * lead : 0;
  const focusX = ball.x + leadX, focusY = ball.y + leadY;
  // 공을 따라가되 경기장 밖이 보이지 않게 가둔다.
  // 보이는 범위가 경기장보다 크면 그 축은 가운데 고정.
  const tx = sp.x >= FW ? FW / 2 : Math.max(sp.x / 2, Math.min(FW - sp.x / 2, focusX));
  const ty = sp.y >= FH ? FH / 2 : Math.max(sp.y / 2, Math.min(FH - sp.y / 2, focusY));
  const k = 1 - Math.exp(-7 * dt);     // 부드럽게 따라감(즉시 스냅은 눈이 피로하다)
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
}

// 경기장 좌표 → 화면. 회전 시 필드 x=0(우리 골문)이 화면 아래로 온다.
function applyFieldTransform() {
  const s = view.scale;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (view.rot) {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.transform(0, -s, s, 0, 0, 0);
    // 이 translate 는 회전 '전' 좌표계에 적용되므로 필드 순서(x, y) 그대로다.
    // (y, x) 로 뒤집어 쓰면 카메라가 엉뚱한 곳을 보게 된다.
    ctx.translate(-cam.x, -cam.y);
  } else {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(s, s);
    ctx.translate(-cam.x, -cam.y);
  }
}

// ── 입력 ───────────────────────────────────────────────────────────
const keys = Object.create(null);
addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  // Space 는 이제 안 쓰지만 페이지 스크롤을 막으려고 기본 동작만 끈다.
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftRight',
       'Enter','Slash','Quote','Semicolon','Period'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') beginAction(0);          // 슛 (공이 없으면 태클)
  if (e.code === 'Period') act(0, 'switch');
  // 패스·스루는 뗄 때 발사한다. 누른 길이가 그대로 킥 높이가 된다.
  if (PASS_KEYS[e.code]) holdStart[e.code] = performance.now();
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Enter') endAction(0);
  const pk = PASS_KEYS[e.code];
  if (pk && holdStart[e.code]) {
    act(pk[0], pk[1], holdPower(holdStart[e.code]));
    holdStart[e.code] = 0;
  }
});
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  for (const k in holdStart) holdStart[k] = 0;
  endAction(0);
});

// 킥 충전 시간. shootCharge 와 같은 1.05초를 쓴다.
const KICK_CHARGE_MS = 1050;
const PASS_KEYS = { ShiftRight:[0, 'pass'], Slash:[0, 'through'] };
const holdStart = Object.create(null);
const holdPower = (t0) =>
  Math.max(0, Math.min(1, (performance.now() - t0) / KICK_CHARGE_MS));

const touchLayer = document.getElementById('touch');
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const STICK_MAX = 52;
let stick = { active:false, id:null, cx:0, cy:0, dx:0, dy:0 };
const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouch) touchLayer.classList.add('on');

touchLayer.addEventListener('pointerdown', e => {
  if (e.target.classList.contains('actbtn')) return;
  if (stick.active) return;
  stick.active = true; stick.id = e.pointerId;
  stick.cx = e.clientX; stick.cy = e.clientY; stick.dx = 0; stick.dy = 0;
  const r = touchLayer.getBoundingClientRect();
  stickEl.style.left = (e.clientX - r.left) + 'px';
  stickEl.style.top = (e.clientY - r.top) + 'px';
  stickEl.classList.add('on');
  knobEl.style.transform = 'translate(0,0)';
  touchLayer.setPointerCapture(e.pointerId);
});
touchLayer.addEventListener('pointermove', e => {
  if (!stick.active || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.cx, dy = e.clientY - stick.cy;
  const d = Math.hypot(dx, dy);
  if (d > STICK_MAX) { dx = dx / d * STICK_MAX; dy = dy / d * STICK_MAX; }
  stick.dx = dx / STICK_MAX; stick.dy = dy / STICK_MAX;
  knobEl.style.transform = `translate(${dx}px,${dy}px)`;
});
function endStick(e) {
  if (!stick.active || (e && e.pointerId !== stick.id)) return;
  stick.active = false; stick.id = null; stick.dx = stick.dy = 0;
  stickEl.classList.remove('on');
}
touchLayer.addEventListener('pointerup', endStick);
touchLayer.addEventListener('pointercancel', endStick);
const shootBtn = document.getElementById('shoot');
const passBtn = document.getElementById('pass');
shootBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); shootBtn.setPointerCapture(e.pointerId);
  shootBtn.classList.add('held'); beginAction(0);
});
shootBtn.addEventListener('pointerup', e => {
  e.preventDefault(); shootBtn.classList.remove('held'); endAction(0);
});
shootBtn.addEventListener('pointercancel', () => {
  shootBtn.classList.remove('held'); endAction(0);
});
let passHoldTimer = 0, passHeld = false;
passBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); passBtn.setPointerCapture(e.pointerId);
  passBtn.classList.add('held');
  passHoldTimer = performance.now(); passHeld = true;
});
passBtn.addEventListener('pointerup', e => {
  e.preventDefault(); passBtn.classList.remove('held'); passHeld = false;
  const owned = ctrl[0] && ball.owner === ctrl[0];
  const held = performance.now() - passHoldTimer;
  act(0, owned ? (held >= 420 ? 'through' : 'pass') : 'switch',

function shuffledOpponents(home, random = Math.random) {
  const a = TEAM_DEFS.map((_, i) => i).filter(i => i !== home);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, 3);
}

function penaltyFinished(pk) {
  const played = pk.shots[0];
  if (played < 5)
    return Math.abs(pk.scored[0] - pk.scored[1]) > 5 - played;
  return pk.scored[0] !== pk.scored[1];
}

function makeLeagueRounds(teamCount = TEAM_DEFS.length) {
  let ring = Array.from({length:teamCount}, (_, i) => i);
  const first = [];
  for (let r = 0; r < teamCount - 1; r++) {
    const fixtures = [];
    for (let i = 0; i < teamCount / 2; i++) {
      const a = ring[i], b = ring[teamCount - 1 - i];
      fixtures.push((r + i) % 2 ? [b, a] : [a, b]);
    }
    first.push(fixtures);
    ring = [ring[0], ring[ring.length - 1], ...ring.slice(1, -1)];
  }
  return first.concat(first.map(round => round.map(([a,b]) => [b,a])));
}

function emptyTable() {
  return TEAM_DEFS.map((_, team) => ({team,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
}

function applyTableResult(table, a, b, ga, gb) {
  const A = table[a], B = table[b];
  A.p++; B.p++; A.gf += ga; A.ga += gb; B.gf += gb; B.ga += ga;
  if (ga > gb) { A.w++; B.l++; A.pts += 3; }
  else if (gb > ga) { B.w++; A.l++; B.pts += 3; }
  else { A.d++; B.d++; A.pts++; B.pts++; }
}

function rankedTable(table) {
  return table.slice().sort((a,b) =>
    b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) ||
    b.gf - a.gf || a.team - b.team);
}

function createLeague(home, type = 'league', seasonNo = 1, trophies = null) {
  return {
    type, phase:'league', userTeam:home, round:0,
    rounds:makeLeagueRounds(), table:emptyTable(), history:[],
    seasonNo, trophies:trophies || {league:0,cup:0}, shootout:null

}

function sampleGoals(strength) {
  const lambda = Math.max(.55, Math.min(3.2, 1.65 + strength / 32));
  let p = 1, k = 0, limit = Math.exp(-lambda);
  do { k++; p *= Math.random(); } while (p > limit && k < 10);
  return k - 1;
}

function simulateFixture(a, b) {
  const diff = teamRating(TEAM_DEFS[a]) - teamRating(TEAM_DEFS[b]);
  return [sampleGoals(diff), sampleGoals(-diff)];
}

function clampStat(n) { return Math.max(1, Math.min(99, n)); }
function teamRating(t) {
  const s = t.stats;
  return (s.speed + s.shot + s.pass + s.defense + s.stamina + s.keeping) / 6;
}
function ratingBars(t) {
  const n = Math.max(1, Math.min(5, Math.round(teamRating(t) / 20)));
  return '●'.repeat(n) + '○'.repeat(5 - n);
}
function playerStats(team, f, i) {
  const s = team.stats, jitter = (i * 7 % 9) - 4;
  return {
    speed:clampStat(s.speed + jitter + (f.role === 'FW' ? 3 : 0)),
    shot:clampStat(s.shot + jitter + (f.role === 'FW' ? 10 : f.role === 'MF' ? 2 : -7)),
    pass:clampStat(s.pass - jitter + (f.role === 'MF' ? 8 : 0)),
    defense:clampStat(s.defense + (f.role === 'DF' ? 10 : f.role === 'FW' ? -8 : 0)),
    stamina:clampStat(s.stamina + jitter),
    keeping:clampStat(f.role === 'GK' ? s.keeping : 1)
  };
}

function buildTeams() {

      const stats = playerStats(team, f, i);
      return {
      side, role:f.role, no:i, isGK:f.role === 'GK',
      hx:f.x, hy:f.y,                       // 정규화 홈 위치
      stats,
      // P_MAX가 전체 선수의 실제 상한이다. 능력치는 그 아래에서만 차이를 낸다.
      speedMul:.78 + stats.speed / 99 * .22,
      shotMul:.84 + stats.shot / 99 * .28,
      passMul:.84 + stats.pass / 99 * .26,
      defenseMul:.76 + stats.defense / 99 * .46,
      energy:1,
      // 골키퍼는 공에 대해서만 몸보다 넓게 닿는다 = 다이빙 선방.
      // 이게 없으면 골문을 실측(146)까지 좁혀도 경기당 7골이 넘는다.
      reach:f.role === 'GK'
        ? R_PLAYER * GK_REACH_MUL * (.82 + stats.keeping / 99 * .30) : R_PLAYER,
      x:0, y:0, vx:0, vy:0,

function resetPositions(kickSide) {

    p.x = h.x; p.y = h.y; p.vx = p.vy = 0;
    p.kickCd = p.trapCd = p.tackleCd = p.tackleT = p.blockT = p.headCd = 0;
    p.actShoot = p.actPass = p.actThrough = 0;
    p.shootHeld = false; p.shootCharge = 0;

    // 킥오프: 공을 넣는 팀만 센터서클 안으로 한 명 들여보낸다
    if (p.role === 'FW' && p.no === 9 && side === kickSide) {
      p.x = FW / 2 - attackDir[side] * R_PLAYER * 2;
      p.y = FH / 2;
    }
  }

function penaltyGoal(shooter, keeper, guessed) {

  const keeping = TEAM_DEFS[keeper].stats.keeping;
  const chance = Math.max(.52, Math.min(.88, .72 + (shot - keeping) / 250));
  return Math.random() < chance * (guessed ? .46 : 1);
}

}

function takePenaltyRound(dir) {
  if (state !== 'shootout' || !shootout) return;
  const awayDir = Math.floor(Math.random() * 3);
  const awayKeeper = Math.floor(Math.random() * 3);
  const homeKeeper = Math.floor(Math.random() * 3);
  const hg = penaltyGoal(selectedTeams[0], selectedTeams[1], dir === awayKeeper);
  const ag = penaltyGoal(selectedTeams[1], selectedTeams[0], awayDir === homeKeeper);
  shootout.shots[0]++; shootout.shots[1]++;
  if (hg) shootout.scored[0]++;
  if (ag) shootout.scored[1]++;
  shootout.rounds.push([hg ? 1 : 0, ag ? 1 : 0]);
  updateShootoutText(`우리 ${hg ? '성공' : '실패'} · 상대 ${ag ? '성공' : '실패'}`);
  saveGame();
  if (penaltyFinished(shootout)) {
    const won = shootout.scored[0] > shootout.scored[1];
    setTimeout(() => finishTournamentMatch(won,
      `승부차기 ${shootout.scored[0]}:${shootout.scored[1]}`), 450);
  }
}

    ov.querySelector('h1').textContent = '토너먼트 우승!';

}
