<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동네 축구 11v11 — 일빵</title>
<style>
  :root {
    /* 런처(청자 팔레트)에서 그대로 가져온 색 */
    --bg-canvas:#152528; --bg-surface:#1D3236; --bg-raised:#264046;
    --text-strong:#F2F7F4; --text-body:#D5E4E1; --text-muted:#8FA8A7;
    --accent:#F58A5E; --accent-hover:#FFA079; --accent-fg:#23140C;
    --border-subtle:#2B474C; --gold:#F2CE7A;
    --font: "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--bg-canvas); color:var(--text-body); font-family:var(--font);
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none;
  }
  header {
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:9px 12px; border-bottom:1px solid var(--border-subtle);
  }
  .back {
    color:var(--text-muted); text-decoration:none; font-size:13px;
    padding:6px 10px; border-radius:8px; border:1px solid var(--border-subtle); flex:0 0 auto;
  }
  .scoreboard { flex:1; display:flex; align-items:center; justify-content:center; gap:10px; }
  .team { font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .team.home { color:var(--accent); }
  .team.away { color:var(--gold); }
  .score { font-size:24px; font-weight:700; color:var(--text-strong);
           font-variant-numeric:tabular-nums; letter-spacing:1px; }
  .clock { flex:0 0 auto; font-size:14px; color:var(--text-strong);
           font-variant-numeric:tabular-nums; min-width:68px; text-align:right; }

  #stage { flex:1; position:relative; min-height:0; }
  canvas { display:block; width:100%; height:100%; }

  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(21,37,40,.88); padding:22px; overflow:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:clamp(22px,5.5vw,38px); color:var(--text-strong); font-weight:700; }
  #overlay p { font-size:13.5px; color:var(--text-muted); line-height:1.75; max-width:36em; }
  .keys { color:var(--text-body); font-weight:700; }
  .btnrow { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }
  button {
    font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer;
    padding:12px 20px; border-radius:10px; border:1px solid var(--accent);
    background:var(--accent); color:var(--accent-fg);
  }
  button.ghost { background:transparent; color:var(--text-body); border-color:var(--border-subtle); }
  button:active { transform:translateY(1px); }
  #levelRow button { padding:8px 16px; font-size:14px; }
  #levelRow button.sel, #lengthRow button.sel {
    background:var(--bg-raised); color:var(--gold); border-color:var(--gold);
  }
  #lengthRow button { padding:7px 13px; font-size:13px; }
  .best { font-size:12.5px; color:var(--gold); }
  .teamSetup {
    display:grid; grid-template-columns:auto minmax(120px,1fr); gap:7px 9px;
    align-items:center; width:min(390px,100%); font-size:12px; text-align:left;
  }
  select, input[type="range"] {
    width:100%; font:inherit; color:var(--text-body); background:var(--bg-raised);
    border:1px solid var(--border-subtle); border-radius:7px; padding:7px;
  }
  .rating { grid-column:1/-1; color:var(--gold); text-align:center; min-height:18px; }
  .modeInfo {
    width:min(430px,100%); color:var(--text-body); font-size:13px;
    line-height:1.65; white-space:pre-line;
  }
  .pkRow button { min-width:84px; }
  [hidden] { display:none !important; }
  details.tactics {
    width:min(390px,100%); border:1px solid var(--border-subtle);
    border-radius:9px; padding:7px 10px; color:var(--text-muted); font-size:12px;
  }
  details.tactics summary { cursor:pointer; text-align:center; }
  .tacticGrid { display:grid; grid-template-columns:auto 1fr; gap:7px; margin-top:9px; }

  /* 모바일 조작 */
  #touch { position:absolute; inset:0; display:none; }
  #touch.on { display:block; }
  #stick {
    position:absolute; left:0; top:0; width:132px; height:132px; margin:-66px 0 0 -66px;
    border-radius:50%; border:2px solid var(--border-subtle); background:rgba(38,64,70,.45);
    display:none; pointer-events:none;
  }
  #stick.on { display:block; }
  #knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px;
          border-radius:50%; background:var(--accent); opacity:.9; }
  .actbtn {
    position:absolute; border-radius:50%; pointer-events:auto; font-weight:700;
    border:2px solid var(--accent); background:rgba(245,138,94,.2); color:var(--accent);
    padding:0; white-space:nowrap;      /* 기본 padding 때문에 '패스'가 두 줄로 깨졌다 */
  }
  #shoot { right:18px; bottom:18px; width:82px; height:82px; font-size:15px; }
  #pass  { right:106px; bottom:40px; width:66px; height:66px; font-size:13px;
           border-color:var(--gold); background:rgba(242,206,122,.18); color:var(--gold); }
  .actbtn:active { filter:brightness(1.5); }
  .actbtn.held { transform:scale(.94); filter:brightness(1.45); }
</style>
</head>
<body>

<header>
  <a class="back" href="../../">← 목록</a>
  <div class="scoreboard">
    <span class="team home" id="nameHome">우리</span>
    <span class="score"><span id="sHome">0</span> : <span id="sAway">0</span></span>
    <span class="team away" id="nameAway">AI</span>
  </div>
  <div class="clock" id="clock">3:00</div>
</header>

<div id="stage">
  <canvas id="c"></canvas>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="pass" class="actbtn">패스</button>
    <button id="shoot" class="actbtn">슛</button>
  </div>

  <div id="overlay">
    <h1>동네 축구</h1>
    <p id="howto"></p>
    <div class="btnrow" id="levelRow">
      <button class="lvl ghost" data-lvl="0">쉬움</button>
      <button class="lvl ghost" data-lvl="1">보통</button>
      <button class="lvl ghost" data-lvl="2">어려움</button>
    </div>
    <div class="btnrow" id="lengthRow">
      <button class="len ghost" data-sec="180">3분</button>
      <button class="len ghost" data-sec="360">6분</button>
      <button class="len ghost" data-sec="600">10분</button>
    </div>
    <div class="teamSetup" id="teamSetup">
      <label for="homeTeam">우리 팀</label><select id="homeTeam"></select>
      <label for="awayTeam">상대 팀</label><select id="awayTeam"></select>
      <label for="formationPick">포메이션</label><select id="formationPick"></select>
      <div class="rating" id="teamRating"></div>
    </div>
    <details class="tactics" id="tacticsPanel">
      <summary>우리 팀 전술</summary>
      <div class="tacticGrid">
        <label for="lineTactic">수비선</label><input id="lineTactic" type="range" min="45" max="70">
        <label for="pressTactic">압박</label><input id="pressTactic" type="range" min="25" max="55">
        <label for="widthTactic">폭</label><input id="widthTactic" type="range" min="20" max="45">
        <label for="chaserTactic">추격</label>
        <select id="chaserTactic"><option value="1">1명</option><option value="2">2명</option></select>
      </div>
    </details>
    <div class="btnrow" id="quickRow">
      <button id="btn1p">AI와 대전</button>
      <button id="btn2p" class="ghost">2인 대전</button>
    </div>
    <div class="btnrow" id="modeRow">
      <button id="btnTournament" class="ghost">8팀 토너먼트</button>
      <button id="btnLeague" class="ghost">14경기 리그</button>
      <button id="btnSeason" class="ghost">시즌</button>
      <button id="btnCancelCompetition" class="ghost" hidden>진행 포기</button>
    </div>
    <div class="btnrow pkRow" id="pkRow" hidden>
      <button data-pk="0" class="ghost">왼쪽</button>
      <button data-pk="1" class="ghost">가운데</button>
      <button data-pk="2" class="ghost">오른쪽</button>
    </div>
    <div class="modeInfo" id="modeInfo"></div>
    <div class="best" id="best"></div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// 동네 축구 11v11 — 톱다운, 카메라 추적
//
// 좌표계: 경기장은 항상 논리 단위(1m = 20단위)로 계산하고, 화면 크기와
// 회전은 그리기·입력 변환 단계에서만 반영한다. 창 크기나 기기 화면비가
// 경기 결과를 바꾸지 않게 하려는 것이다.
//
// 실제 규격(105m x 68m)을 그대로 옮겼다. 페널티박스·골에어리어·센터서클·
// 페널티마크 치수도 실측값이다. 골문만은 예외로 넓혔다 — 실제 7.32m
// (=146단위)로 두면 골키퍼가 있는 상태에서 득점이 거의 불가능하다.
// ═══════════════════════════════════════════════════════════════════

const M = 20;                        // 1미터 = 20 논리단위
const FW = 105 * M, FH = 68 * M;     // 2100 x 1360
// 골문만 실측(7.32m = 146)에서 확대했다. 골키퍼가 있는 상태에서 146 으로
// 두면 득점이 거의 안 난다. 공 소유 모델 도입 후 300에서 총득점이 목표보다
// 낮아져 골문 330과 슛 속도 1650 조합으로 조정했다.
const GOAL_H = 330;
const PA_D = 16.5 * M, PA_W = 40.3 * M;   // 페널티 에어리어
const GA_D = 5.5 * M,  GA_W = 18.32 * M;  // 골 에어리어
const CIRCLE_R = 9.15 * M;
const PEN_SPOT = 11 * M;

const R_PLAYER = 26, R_BALL = 13;
let GK_REACH_MUL = 1.4;
// 줌은 고정하지 않는다. 화면이 크면 경기장 전체를 보여주고, 작을 때만
// 선수가 읽히는 최소 크기를 지키며 카메라가 공을 따라간다.
// (고정 줌으로 두면 데스크톱에서도 경기장의 60% 만 보여 답답하고,
//  반대로 전체를 늘 담으면 폰에서 선수가 지름 15px 로 뭉개진다)
const MIN_PLAYER_PX = 26;            // 선수 지름 가독 하한 (CSS px)

let MATCH_SEC = 180;
const GOAL_PAUSE = 1.6;

const C = {
  turf:'#1D3236', turfAlt:'#233C41', line:'#33565C',
  home:'#F58A5E', away:'#F2CE7A', ball:'#F2F7F4',
  gkHome:'#8FD1C4', gkAway:'#C9A6E0',
  mapBg:'rgba(21,37,40,.82)', mapLine:'#3D6169'
};

// AI 난이도. 상대 팀 11명 전체에 적용된다(우리 팀 동료는 항상 '보통' 수준).
// speed=최대속도 배수, react=목표 재계산 간격(사람의 반응 시간에 해당),
// aimErr=공을 향할 때의 조준 오차, shoot=슛·패스 시도 확률, gk=골키퍼 반응.
// 값은 결정론적 봇으로 난이도별 200경기 이상 자동 대전해 검증한다.
// 목표 승률 80% / 53% / 23%, 경기당 총 5~6골.
//
// 0.84~0.94 상대 속도 배수 스윕을 각 200경기로 측정했을 때 과거 30경기의
// 급변은 재현되지 않았다. 난이도 차이는 react(반응 지연), aimErr(조준
// 오차), gk(골키퍼 반응)를 포함한 전체 조합으로 관리하고 단계마다 측정한다.
const LEVELS = [
  { name:'쉬움',  react:0.90, aimErr:280, shoot:0.75, gk:0.35 },
  { name:'보통',  react:0.28, aimErr:100, shoot:0.88, gk:0.85 },
  { name:'어려움', react:0.15, aimErr:55,  shoot:0.88, gk:0.95 }
];
let level = 1;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── 화면·카메라 ────────────────────────────────────────────────────
// rot=true(세로 화면)면 경기장을 90° 돌려 세로로 쓴다. 안 돌리면 가로로
// 긴 경기장이 폰 폭에 맞춰져 납작한 띠가 된다.
let view = { scale:1, rot:false, w:0, h:0, dpr:1 };
let cam = { x:FW / 2, y:FH / 2 };

function resize() {
  const stage = document.getElementById('stage');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = stage.clientWidth, h = stage.clientHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const rot = h > w;
  // 회전 시 경기장 길이(FW)는 화면 높이에 놓인다.
  const fit = rot ? Math.min(h / FW, w / FH) : Math.min(w / FW, h / FH);
  const sCss = Math.max(fit, MIN_PLAYER_PX / (R_PLAYER * 2));
  view = { rot, scale:sCss * dpr, w, h, dpr, whole:sCss <= fit + 1e-6 };
}
window.addEventListener('resize', resize);

// 화면에 보이는 경기장 범위(논리단위)
function viewSpan() {
  const s = view.scale;
  return view.rot
    ? { x:canvas.height / s, y:canvas.width / s }    // 세로: 화면높이=필드x
    : { x:canvas.width / s,  y:canvas.height / s };
}

function updateCamera(dt) {
  const sp = viewSpan();
  // 공을 따라가되 경기장 밖이 보이지 않게 가둔다.
  // 보이는 범위가 경기장보다 크면 그 축은 가운데 고정.
  const tx = sp.x >= FW ? FW / 2 : Math.max(sp.x / 2, Math.min(FW - sp.x / 2, ball.x));
  const ty = sp.y >= FH ? FH / 2 : Math.max(sp.y / 2, Math.min(FH - sp.y / 2, ball.y));
  const k = 1 - Math.exp(-7 * dt);     // 부드럽게 따라감(즉시 스냅은 눈이 피로하다)
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
}

// 경기장 좌표 → 화면. 회전 시 필드 x=0(우리 골문)이 화면 아래로 온다.
function applyFieldTransform() {
  const s = view.scale;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (view.rot) {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.transform(0, -s, s, 0, 0, 0);
    // 이 translate 는 회전 '전' 좌표계에 적용되므로 필드 순서(x, y) 그대로다.
    // (y, x) 로 뒤집어 쓰면 카메라가 엉뚱한 곳을 보게 된다.
    ctx.translate(-cam.x, -cam.y);
  } else {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(s, s);
    ctx.translate(-cam.x, -cam.y);
  }
}

// ── 입력 ───────────────────────────────────────────────────────────
const keys = Object.create(null);
addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight',
       'ControlLeft','ControlRight','Enter','KeyQ','KeyO'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space') beginAction(0);
  if (e.code === 'ShiftLeft') act(0, 'pass');
  if (e.code === 'ControlLeft') act(0, 'through');
  if (e.code === 'KeyQ') act(0, 'switch');
  if (e.code === 'Enter') beginAction(1);
  if (e.code === 'ShiftRight') act(1, 'pass');
  if (e.code === 'ControlRight') act(1, 'through');
  if (e.code === 'KeyO') act(1, 'switch');
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space') endAction(0);
  if (e.code === 'Enter') endAction(1);
});
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  endAction(0); endAction(1);
});

const touchLayer = document.getElementById('touch');
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const STICK_MAX = 52;
let stick = { active:false, id:null, cx:0, cy:0, dx:0, dy:0 };
const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouch) touchLayer.classList.add('on');

touchLayer.addEventListener('pointerdown', e => {
  if (e.target.classList.contains('actbtn')) return;
  if (stick.active) return;
  stick.active = true; stick.id = e.pointerId;
  stick.cx = e.clientX; stick.cy = e.clientY; stick.dx = 0; stick.dy = 0;
  const r = touchLayer.getBoundingClientRect();
  stickEl.style.left = (e.clientX - r.left) + 'px';
  stickEl.style.top = (e.clientY - r.top) + 'px';
  stickEl.classList.add('on');
  knobEl.style.transform = 'translate(0,0)';
  touchLayer.setPointerCapture(e.pointerId);
});
touchLayer.addEventListener('pointermove', e => {
  if (!stick.active || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.cx, dy = e.clientY - stick.cy;
  const d = Math.hypot(dx, dy);
  if (d > STICK_MAX) { dx = dx / d * STICK_MAX; dy = dy / d * STICK_MAX; }
  stick.dx = dx / STICK_MAX; stick.dy = dy / STICK_MAX;
  knobEl.style.transform = `translate(${dx}px,${dy}px)`;
});
function endStick(e) {
  if (!stick.active || (e && e.pointerId !== stick.id)) return;
  stick.active = false; stick.id = null; stick.dx = stick.dy = 0;
  stickEl.classList.remove('on');
}
touchLayer.addEventListener('pointerup', endStick);
touchLayer.addEventListener('pointercancel', endStick);
const shootBtn = document.getElementById('shoot');
const passBtn = document.getElementById('pass');
shootBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); shootBtn.setPointerCapture(e.pointerId);
  shootBtn.classList.add('held'); beginAction(0);
});
shootBtn.addEventListener('pointerup', e => {
  e.preventDefault(); shootBtn.classList.remove('held'); endAction(0);
});
shootBtn.addEventListener('pointercancel', () => {
  shootBtn.classList.remove('held'); endAction(0);
});
let passHoldTimer = 0;
passBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); passBtn.setPointerCapture(e.pointerId);
  passBtn.classList.add('held'); passHoldTimer = performance.now();
});
passBtn.addEventListener('pointerup', e => {
  e.preventDefault(); passBtn.classList.remove('held');
  const owned = ctrl[0] && ball.owner === ctrl[0];
  act(0, owned ? (performance.now() - passHoldTimer >= 420 ? 'through' : 'pass') : 'switch');
});
passBtn.addEventListener('pointercancel', () => passBtn.classList.remove('held'));

// ── 상태 ───────────────────────────────────────────────────────────
let mode = '1p', state = 'title';
let clock = MATCH_SEC / 2, goalTimer = 0, lastScorer = -1;
let half = 1, addedBank = 0, inAdded = false, setpiece = null;
let offside = null, notice = { text:'', timer:0, color:'#F2CE7A' };
let competition = null, shootout = null, saveData = null;
const score = [0, 0];
const matchStats = {
  shots:[0,0], onTarget:[0,0], possession:[0,0], corners:[0,0],
  fouls:[0,0], cards:[0,0], offsides:[0,0], setpieces:{}, events:[]
};
const ball = {
  x:0, y:0, vx:0, vy:0, owner:null, lastTouch:null, freeCd:0,
  shotSide:-1, shotCounted:false
};
const teams = [[], []];              // teams[0] = 우리(왼쪽 골 수비), teams[1] = 상대
const attackDir = [1, -1];
const ctrl = [null, null];           // 사람이 조작 중인 선수 (1P, 2P)
const ctrlLock = [0, 0];

// 자기 골문(x=0) 기준 정규화 좌표.
const FORMATIONS = {
  '4-4-2': [

function shuffledOpponents(home, random = Math.random) {
  const a = TEAM_DEFS.map((_, i) => i).filter(i => i !== home);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, 3);
}

function createTournament(home, random = Math.random) {
  return {
    type:'tournament', userTeam:home, round:0,
    opponents:shuffledOpponents(home, random), history:[], shootout:null
  };
}

function penaltyFinished(pk) {
  const played = pk.shots[0];
  if (played < 5)
    return Math.abs(pk.scored[0] - pk.scored[1]) > 5 - played;
  return pk.scored[0] !== pk.scored[1];
}

function makeLeagueRounds(teamCount = TEAM_DEFS.length) {
  let ring = Array.from({length:teamCount}, (_, i) => i);
  const first = [];
  for (let r = 0; r < teamCount - 1; r++) {
    const fixtures = [];
    for (let i = 0; i < teamCount / 2; i++) {
      const a = ring[i], b = ring[teamCount - 1 - i];
      fixtures.push((r + i) % 2 ? [b, a] : [a, b]);
    }
    first.push(fixtures);
    ring = [ring[0], ring[ring.length - 1], ...ring.slice(1, -1)];
  }
  return first.concat(first.map(round => round.map(([a,b]) => [b,a])));
}

function emptyTable() {
  return TEAM_DEFS.map((_, team) => ({team,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
}

function applyTableResult(table, a, b, ga, gb) {
  const A = table[a], B = table[b];
  A.p++; B.p++; A.gf += ga; A.ga += gb; B.gf += gb; B.ga += ga;
  if (ga > gb) { A.w++; B.l++; A.pts += 3; }
  else if (gb > ga) { B.w++; A.l++; B.pts += 3; }
  else { A.d++; B.d++; A.pts++; B.pts++; }
}

function rankedTable(table) {
  return table.slice().sort((a,b) =>
    b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) ||
    b.gf - a.gf || a.team - b.team);
}

function createLeague(home, type = 'league', seasonNo = 1, trophies = null) {
  return {
    type, phase:'league', userTeam:home, round:0,
    rounds:makeLeagueRounds(), table:emptyTable(), history:[],
    seasonNo, trophies:trophies || {league:0,cup:0}, shootout:null
  };
}

function leagueUserFixture(c) {
  return c.rounds[c.round].find(pair => pair.includes(c.userTeam));
}

function sampleGoals(strength) {
  const lambda = Math.max(.55, Math.min(3.2, 1.65 + strength / 32));
  let p = 1, k = 0, limit = Math.exp(-lambda);
  do { k++; p *= Math.random(); } while (p > limit && k < 10);
  return k - 1;
}

function simulateFixture(a, b) {
  const diff = teamRating(TEAM_DEFS[a]) - teamRating(TEAM_DEFS[b]);
  return [sampleGoals(diff), sampleGoals(-diff)];
}

function clampStat(n) { return Math.max(1, Math.min(99, n)); }
function teamRating(t) {
  const s = t.stats;
  return (s.speed + s.shot + s.pass + s.defense + s.stamina + s.keeping) / 6;
}
function ratingBars(t) {
  const n = Math.max(1, Math.min(5, Math.round(teamRating(t) / 20)));
  return '●'.repeat(n) + '○'.repeat(5 - n);
}
function playerStats(team, f, i) {
  const s = team.stats, jitter = (i * 7 % 9) - 4;
  return {
    speed:clampStat(s.speed + jitter + (f.role === 'FW' ? 3 : 0)),
    shot:clampStat(s.shot + jitter + (f.role === 'FW' ? 10 : f.role === 'MF' ? 2 : -7)),
    pass:clampStat(s.pass - jitter + (f.role === 'MF' ? 8 : 0)),
    defense:clampStat(s.defense + (f.role === 'DF' ? 10 : f.role === 'FW' ? -8 : 0)),
    stamina:clampStat(s.stamina + jitter),
    keeping:clampStat(f.role === 'GK' ? s.keeping : 1)
  };
}

function teamTactics(side) {
  return tacticOverride[side] || TEAM_DEFS[selectedTeams[side]].tactics;
}

function buildTeams() {
  for (const side of [0, 1]) {
    const team = TEAM_DEFS[selectedTeams[side]];
    const formation = FORMATIONS[selectedFormation[side] || team.formation];
    teams[side] = formation.map((f, i) => {
      const stats = playerStats(team, f, i);
      return {
      side, role:f.role, no:i, isGK:f.role === 'GK',
      hx:f.x, hy:f.y,                       // 정규화 홈 위치
      stats,
      speedMul:.84 + stats.speed / 99 * .22,
      shotMul:.84 + stats.shot / 99 * .28,
      passMul:.84 + stats.pass / 99 * .26,
      defenseMul:.76 + stats.defense / 99 * .46,
      energy:1,
      // 골키퍼는 공에 대해서만 몸보다 넓게 닿는다 = 다이빙 선방.
      // 이게 없으면 골문을 실측(146)까지 좁혀도 경기당 7골이 넘는다.
      reach:f.role === 'GK'
        ? R_PLAYER * GK_REACH_MUL * (.82 + stats.keeping / 99 * .30) : R_PLAYER,
      x:0, y:0, vx:0, vy:0,
      kickCd:0, trapCd:0, tackleCd:0, tackleT:0,
      actShoot:0, actPass:0, actThrough:0, shootHeld:false, shootCharge:0,
      aimX:attackDir[side], aimY:0, manualAim:false, yellow:0,
      aiT:Math.random() * 0.3, aiTx:0, aiTy:0
    };
    });
  }
}

// 정규화 홈 위치 → 실제 좌표 (side 1 은 x 반전)
function homePos(p) {
  const nx = attackDir[p.side] === 1 ? p.hx : 1 - p.hx;
  return { x:nx * FW, y:p.hy * FH };
}

function resetPositions(kickSide) {
  for (const side of [0, 1]) for (const p of teams[side]) {
    const h = homePos(p);
    p.x = h.x; p.y = h.y; p.vx = p.vy = 0;
    p.kickCd = p.trapCd = p.tackleCd = p.tackleT = 0;
    p.actShoot = p.actPass = p.actThrough = 0;
    p.shootHeld = false; p.shootCharge = 0;
    p.yellow = 0; p.energy = 1;
    // 킥오프: 공을 넣는 팀만 센터서클 안으로 한 명 들여보낸다
    if (p.role === 'FW' && p.no === 9 && side === kickSide) {
      p.x = FW / 2 - attackDir[side] * R_PLAYER * 2;
      p.y = FH / 2;
    }
  }
  ball.x = FW / 2; ball.y = FH / 2; ball.vx = ball.vy = 0;
  ball.owner = ball.lastTouch = null; ball.freeCd = 0;
  ball.shotSide = -1; ball.shotCounted = false; offside = null;
  cam.x = FW / 2; cam.y = FH / 2;
  ctrl[0] = ctrl[1] = null;
  ctrlLock[0] = ctrlLock[1] = 0;
}

function penaltyGoal(shooter, keeper, guessed) {
  const shot = TEAM_DEFS[shooter].stats.shot;
  const keeping = TEAM_DEFS[keeper].stats.keeping;
  const chance = Math.max(.52, Math.min(.88, .72 + (shot - keeping) / 250));
  return Math.random() < chance * (guessed ? .46 : 1);
}

function updateShootoutText(last = '') {
  const sudden = shootout.shots[0] >= 5 ? ' · 서든데스' : '';
  document.getElementById('modeInfo').textContent =
    `${TEAM_DEFS[selectedTeams[0]].name} ${shootout.scored[0]} : ` +
    `${shootout.scored[1]} ${TEAM_DEFS[selectedTeams[1]].name}\n` +
    `${shootout.shots[0]}번째 킥${sudden}${last ? `\n${last}` : ''}`;
}

function takePenaltyRound(dir) {
  if (state !== 'shootout' || !shootout) return;
  const awayDir = Math.floor(Math.random() * 3);
  const awayKeeper = Math.floor(Math.random() * 3);
  const homeKeeper = Math.floor(Math.random() * 3);
  const hg = penaltyGoal(selectedTeams[0], selectedTeams[1], dir === awayKeeper);
  const ag = penaltyGoal(selectedTeams[1], selectedTeams[0], awayDir === homeKeeper);
  shootout.shots[0]++; shootout.shots[1]++;
  if (hg) shootout.scored[0]++;
  if (ag) shootout.scored[1]++;
  shootout.rounds.push([hg ? 1 : 0, ag ? 1 : 0]);
  updateShootoutText(`우리 ${hg ? '성공' : '실패'} · 상대 ${ag ? '성공' : '실패'}`);
  saveGame();
  if (penaltyFinished(shootout)) {
    const won = shootout.scored[0] > shootout.scored[1];
    setTimeout(() => finishTournamentMatch(won,
      `승부차기 ${shootout.scored[0]}:${shootout.scored[1]}`), 450);
  }
}

function finishTournamentMatch(won, result = `${score[0]}:${score[1]}`) {
  if (competition.type === 'season') {
    finishSeasonCupMatch(won, result); return;
  }
  const away = selectedTeams[1];
  competition.history.push({ away, result, won });
  competition.shootout = null; shootout = null;
  const ov = document.getElementById('overlay');
  if (!won) {
    const summary = tournamentText();
    competition = null; saveGame();
    state = 'end'; setConfigVisible(false);
    ov.querySelector('h1').textContent = '토너먼트 탈락';
    document.getElementById('howto').textContent = result;
    document.getElementById('modeInfo').textContent = summary;
    document.getElementById('btnTournament').textContent = '새 토너먼트';
    document.getElementById('btnCancelCompetition').hidden = true;
    ov.classList.remove('hidden');
    return;
  }
  competition.round++;
  if (competition.round >= 3) {
    const summary = tournamentText();
    competition = null; saveGame();
    state = 'end'; setConfigVisible(false);
    ov.querySelector('h1').textContent = '토너먼트 우승!';
    document.getElementById('howto').textContent = '3라운드를 모두 이겼습니다.';
    document.getElementById('modeInfo').textContent = summary;
    document.getElementById('btnTournament').textContent = '새 토너먼트';
    document.getElementById('btnCancelCompetition').hidden = true;
    ov.classList.remove('hidden');
    return;
  }
  selectedTeams[1] = competition.opponents[competition.round];
  saveGame();
  showTournamentReady();
}

function standingsText(c, limit = 8) {
  const ranked = rankedTable(c.table);
  return ranked.slice(0, limit).map((r, i) =>
    `${i + 1}. ${TEAM_DEFS[r.team].name} ${r.pts}점 ` +
    `${r.w}승${r.d}무${r.l}패 ${r.gf - r.ga >= 0 ? '+' : ''}${r.gf - r.ga}`
  ).join('\n');
}

function startLeagueMatch() {

  const opponent = fixture[0] === competition.userTeam ? fixture[1] : fixture[0];
  selectedTeams[0] = competition.userTeam; selectedTeams[1] = opponent;
  selectedFormation[1] = TEAM_DEFS[opponent].formation; tacticOverride[1] = null;
  saveGame(); startMatch('1p');
}

function finishLeagueMatch() {
  const fixture = leagueUserFixture(competition);
  const [a,b] = fixture;
  const userIsA = a === competition.userTeam;
  applyTableResult(competition.table, a, b,
    userIsA ? score[0] : score[1], userIsA ? score[1] : score[0]);
  for (const [x,y] of competition.rounds[competition.round]) {
    if (x === competition.userTeam || y === competition.userTeam) continue;
    const result = simulateFixture(x, y);
    applyTableResult(competition.table, x, y, result[0], result[1]);
  }
  competition.history.push({
    round:competition.round + 1, away:selectedTeams[1],
    gf:score[0], ga:score[1]
  });
  competition.round++;
  if (competition.round >= competition.rounds.length) finishLeagueStage();
  else { saveGame(); showLeagueReady(); }
}

function finishLeagueStage() {
  const ranked = rankedTable(competition.table);
  const rank = ranked.findIndex(r => r.team === competition.userTeam) + 1;
  const tableText = standingsText(competition);
  const ov = document.getElementById('overlay');
  if (competition.type === 'season') {
    if (rank === 1) competition.trophies.league++;
    competition.phase = 'cup'; competition.cupRound = 0;
    competition.cupOpponents = shuffledOpponents(competition.userTeam);
    competition.cupHistory = [];
    saveGame(); showCupReady(); return;
  }
  competition = null; saveGame(); state = 'end'; setConfigVisible(false);
  setModeButtons('btnLeague', '새 리그');
  document.getElementById('btnCancelCompetition').hidden = true;
  ov.querySelector('h1').textContent = `리그 ${rank}위`;
  document.getElementById('howto').textContent = '14경기를 모두 마쳤습니다.';
  document.getElementById('modeInfo').textContent = tableText;
  ov.classList.remove('hidden');
}

}

function startCupMatch() {
  const opponent = competition.cupOpponents[competition.cupRound];
  selectedTeams[0] = competition.userTeam; selectedTeams[1] = opponent;
  selectedFormation[1] = TEAM_DEFS[opponent].formation; tacticOverride[1] = null;
  saveGame(); startMatch('1p');
}

function finishSeasonCupMatch(won, result) {
  competition.cupHistory.push({
    round:competition.cupRound + 1, away:selectedTeams[1], result, won
  });
  competition.shootout = null; shootout = null;
  if (!won) {
    competition.phase = 'complete'; competition.cupWon = false;
    saveGame(); showSeasonComplete(false); return;
  }
  competition.cupRound++;
  if (competition.cupRound >= 3) {
    competition.trophies.cup++; competition.phase = 'complete';
    competition.cupWon = true;
    saveGame(); showSeasonComplete(true); return;
  }
  saveGame(); showCupReady();
}

function showSeasonComplete(cupWon) {
  state = 'end';
  const ov = document.getElementById('overlay');
  ov.querySelector('h1').textContent = `시즌 ${competition.seasonNo} 완료`;
  document.getElementById('howto').textContent =
    cupWon ? '컵 우승으로 시즌을 마쳤습니다.' : '컵에서 탈락해 시즌을 마쳤습니다.';
  document.getElementById('modeInfo').textContent =
    `누적 우승 · 리그 ${competition.trophies.league} / 컵 ${competition.trophies.cup}`;
  setConfigVisible(false); setModeButtons('btnSeason', '다음 시즌');
  document.getElementById('btnCancelCompetition').textContent = '시즌 끝내기';
  ov.classList.remove('hidden');
}

function beginAction(teamIdx) {
  if (state === 'setpiece' && setpiece && setpiece.side === teamIdx) {
    takeSetpiece('shoot'); return;
  }
  if (state !== 'play') return;
  const p = ctrl[teamIdx];
  if (!p) return;
  if (ball.owner === p) {
    p.shootHeld = true;
    p.shootCharge = Math.max(0.12, p.shootCharge);
  } else {
    act(teamIdx, 'tackle');
  }
}

function endAction(teamIdx) {
  const p = ctrl[teamIdx];
  if (!p || !p.shootHeld) return;
  p.shootHeld = false;
  p.actShoot = Math.max(0.25, Math.min(1, p.shootCharge));
  p.shootCharge = 0;
}

function act(teamIdx, kind) {
  if (state === 'setpiece' && setpiece && setpiece.side === teamIdx) {
    takeSetpiece(kind); return;
  }
  if (state !== 'play') return;
  const p = ctrl[teamIdx];
  if (!p) return;
  if (kind === 'switch') { cycleControlled(teamIdx); return; }
  if (kind === 'tackle') {
    if (ball.owner !== p && p.tackleCd <= 0) {
      p.tackleT = 0.22; p.tackleCd = 0.85;
    }
  } else if (ball.owner === p) {
    if (kind === 'pass') p.actPass = 0.25;
    if (kind === 'through') p.actThrough = 0.25;
  }
}

// ── 물리 ───────────────────────────────────────────────────────────
// 경기장이 1v1 판(1000x620)의 2배 이상이라 속도도 그만큼 올렸다.
const P_ACCEL = 2100, P_MAX = 470, P_FRICTION = 8;
const B_FRICTION = 0.55, B_MAX = 2000;
const TOUCH_V = 430, PASS_V = 950, SHOOT_V = 1650;
const TRAP_R = R_PLAYER + R_BALL + 7, TRAP_V = 620;
const OWNER_SPEED = 0.88, SPRINT_SPEED = 1.25, REOWN_CD = 0.35;
const OPPONENT_SPEED_MUL = [1, 1, 1];
const HUMAN_SHOOT_MUL = [1.18, 1.40, 1.18];
const HUMAN_TACKLE_BONUS = [0, 0.28, 0];
const HUMAN_GK_REACH_MUL = [1, 1.35, 1];

function movePlayer(p, ax, ay, dt, speedMul = 1) {
  const m = Math.hypot(ax, ay);
  if (m > 1) { ax /= m; ay /= m; }
  p.vx += ax * P_ACCEL * dt;
  p.vy += ay * P_ACCEL * dt;
  if (m < 0.01) { const f = Math.exp(-P_FRICTION * dt); p.vx *= f; p.vy *= f; }
  const cap = P_MAX * speedMul;
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > cap) { p.vx = p.vx / sp * cap; p.vy = p.vy / sp * cap; }
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, p.x));
  p.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, p.y));
  if (p.kickCd > 0) p.kickCd -= dt;
  if (p.trapCd > 0) p.trapCd -= dt;
  if (p.tackleCd > 0) p.tackleCd -= dt;
  if (p.tackleT > 0) p.tackleT -= dt;
  if (p.actShoot > 0) p.actShoot -= dt;
  if (p.actPass > 0) p.actPass -= dt;
  if (p.actThrough > 0) p.actThrough -= dt;
  if (p.shootHeld) p.shootCharge = Math.min(1, p.shootCharge + dt / 1.05);
}

const inGoalMouth = (y) => y > (FH - GOAL_H) / 2 && y < (FH + GOAL_H) / 2;

function defendingAtGoal(x) {
  const ownDir = x <= 0 ? 1 : -1;
  return attackDir[0] === ownDir ? 0 : 1;
}

function secondLastDefenderLine(side) {
  const dir = attackDir[side];
  const projected = teams[1 - side].map(p => p.x * dir).sort((a, b) => b - a);
  return projected.length > 1 ? projected[1] / dir : (dir === 1 ? FW : 0);
}

function markOffside(p) {
  if (level === 0) { offside = null; return; }
  const dir = attackDir[p.side];
  const lineX = secondLastDefenderLine(p.side);
  const threshold = Math.max(lineX * dir, ball.x * dir) + 18;
  const offenders = teams[p.side].filter(t =>
    t !== p && !t.isGK && (t.x - FW / 2) * dir > 0 && t.x * dir > threshold
  );
  offside = offenders.length ? { side:p.side, offenders, lineX, timer:3 } : null;
}

function callOffside(p) {
  if (!offside || offside.side !== p.side || !offside.offenders.includes(p)) return false;
  matchStats.offsides[p.side]++;
  notice = { text:'오프사이드', timer:1.2, color:'#F2CE7A' };
  const side = 1 - p.side;
  offside = null;
  beginSetpiece('free', side, { x:p.x, y:p.y });
  return true;
}

function outOfPlay(x, y) {
  const last = ball.lastTouch ? ball.lastTouch.side : 0;
  if (y < 0 || y > FH) {
    const spot = { x:Math.max(80, Math.min(FW - 80, x)), y:y < 0 ? 0 : FH };
    beginSetpiece('throw', 1 - last, spot);
    return true;
  }
  if (x < 0 || x > FW) {
    if (inGoalMouth(y)) {
      goal(1 - defendingAtGoal(x));
      return true;
    }
    const defender = defendingAtGoal(x);
    const attacker = 1 - defender;
    if (last === attacker) {
      const gx = x < 0 ? GA_D * 0.7 : FW - GA_D * 0.7;
      beginSetpiece('goalkick', defender, { x:gx, y:FH / 2 });
    } else {
      beginSetpiece('corner', attacker, {
        x:x < 0 ? 0 : FW, y:y < FH / 2 ? 0 : FH
      });
    }
    return true;
  }
  return false;
}

function updateBall(dt) {
  if (ball.freeCd > 0) ball.freeCd -= dt;
  if (ball.owner) {
    const p = ball.owner;
    let ax = p.aimX, ay = p.aimY;
    if (Math.hypot(ax, ay) < 0.1) {
      const v = Math.hypot(p.vx, p.vy);
      if (v > 10) { ax = p.vx / v; ay = p.vy / v; }
      else { ax = attackDir[p.side]; ay = 0; }
    }
    const d = R_PLAYER + R_BALL + 4;
    ball.x = p.x + ax * d;
    ball.y = p.y + ay * d;
    ball.vx = p.vx; ball.vy = p.vy;
    if (outOfPlay(ball.x, ball.y)) return;
    return;
  }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  const f = Math.pow(B_FRICTION, dt);
  ball.vx *= f; ball.vy *= f;
  if (Math.hypot(ball.vx, ball.vy) < 5) { ball.vx = 0; ball.vy = 0; }

  outOfPlay(ball.x, ball.y);
}

function takePossession(p) {
  if (p.trapCd > 0 || ball.freeCd > 0) return false;
  if (callOffside(p)) return true;
  if (offside && offside.side !== p.side) offside = null;
  ball.owner = p; ball.lastTouch = p;
  ball.shotSide = -1; ball.shotCounted = false;
  ball.vx = p.vx; ball.vy = p.vy;
  return true;
}

function releaseBall(p, vx, vy) {
  ball.owner = null; ball.lastTouch = p; ball.freeCd = 0.08;
  ball.shotSide = -1; ball.shotCounted = false;
  p.trapCd = REOWN_CD; p.kickCd = Math.max(p.kickCd, 0.22);
  const sp = Math.hypot(vx, vy);
  ball.vx = sp > B_MAX ? vx / sp * B_MAX : vx;
  ball.vy = sp > B_MAX ? vy / sp * B_MAX : vy;
}

const SET_WAIT = {
  throw:0.8, goalkick:1.0, corner:1.5, free:1.5, kickoff:0.7, penalty:2.0
};

function beginSetpiece(type, side, spot) {
  offside = null;
  matchStats.setpieces[type] = (matchStats.setpieces[type] || 0) + 1;
  if (matchStats.events.length < 20)
    matchStats.events.push({ event:type, side, x:Math.round(spot.x), y:Math.round(spot.y) });
  if (type === 'corner') matchStats.corners[side]++;
  ball.owner = null; ball.vx = ball.vy = 0; ball.freeCd = 0.1;
  ball.shotSide = -1; ball.shotCounted = false;
  ball.x = Math.max(0, Math.min(FW, spot.x));
  ball.y = Math.max(0, Math.min(FH, spot.y));
  let taker = null, bd = Infinity;
  for (const p of teams[side]) {
    if (p.isGK && type !== 'goalkick') continue;
    const d = Math.hypot(p.x - ball.x, p.y - ball.y);
    if (d < bd) { bd = d; taker = p; }
  }
  if (!taker) taker = teams[side][0];
  const inwardX = ball.x < FW / 2 ? 1 : -1;
  const inwardY = ball.y < FH / 2 ? 1 : -1;
  const ox = type === 'throw' ? 0 : -attackDir[side] * (R_PLAYER + R_BALL + 8);
  const oy = type === 'throw' ? inwardY * 90 : 0;
  taker.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, ball.x + ox));
  taker.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, ball.y + oy));
  taker.vx = taker.vy = 0;
  if (type === 'throw') {
    for (const sidePlayers of teams) for (const p of sidePlayers) {
      if (p !== taker) p.y = Math.max(120, Math.min(FH - 120, p.y));
    }
  }
  for (const p of teams[1 - side]) {
    if (type === 'penalty' && p.isGK) {
      const gx = attackDir[p.side] === 1 ? R_PLAYER : FW - R_PLAYER;
      p.x = gx; p.y = FH / 2; p.vx = p.vy = 0;
      continue;
    }
    const dx = p.x - ball.x, dy = p.y - ball.y;
    const d = Math.hypot(dx, dy);
    if (d < CIRCLE_R && d > 0) {
      p.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, ball.x + dx / d * CIRCLE_R));
      p.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, ball.y + dy / d * CIRCLE_R));
    } else if (d === 0) {
      p.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, ball.x + inwardX * CIRCLE_R));
    }
  }
  setpiece = {
    type, side, spot:{ x:ball.x, y:ball.y }, taker,
    timer:SET_WAIT[type] || 1, ready:false, auto:3
  };
  state = 'setpiece';
}

function takeSetpiece(kind = 'pass') {
  if (!setpiece) return;
  const s = setpiece, p = s.taker;
  let tx, ty, v;
  const target = passTarget(p, kind === 'through');
  if (s.type === 'penalty') {
    const a = aimAt(s.side); tx = a.x; ty = a.y; v = SHOOT_V;
    matchStats.shots[s.side]++;
  } else if (s.type === 'throw') {
    tx = Math.max(180, Math.min(FW - 180, ball.x + attackDir[s.side] * 180));
    ty = ball.y < FH / 2 ? 350 : FH - 350;
    v = 820;
  } else if (s.type === 'corner') {
    const goalX = attackDir[s.side] === 1 ? FW : 0;
    tx = goalX - attackDir[s.side] * PA_D * 0.55;
    ty = FH / 2; v = PASS_V;
  } else if (s.type === 'goalkick') {
    tx = p.x + attackDir[s.side] * 900;
    ty = FH / 2 + (Math.random() * 2 - 1) * 320; v = 1150;
  } else if (s.type === 'kickoff') {
    const mate = target || teams[s.side].find(t => t !== p && !t.isGK);
    tx = mate ? mate.x : p.x + attackDir[s.side] * 300;
    ty = mate ? mate.y : p.y; v = 650;
  } else if (target && kind !== 'shoot') {
    tx = target.x + (kind === 'through' ? attackDir[s.side] * 130 : 0);
    ty = target.y; v = s.type === 'throw' ? 720 : PASS_V * 0.9;
  } else {
    const a = aimAt(s.side); tx = a.x; ty = a.y;
    v = kind === 'shoot' ? SHOOT_V * 0.85 : PASS_V * 0.8;
  }
  const ang = Math.atan2(ty - ball.y, tx - ball.x);
  ball.lastTouch = p; ball.owner = null; ball.freeCd = 0.12;
  ball.vx = Math.cos(ang) * v; ball.vy = Math.sin(ang) * v;
  ball.shotSide = kind === 'shoot' ? p.side : -1;
  ball.shotCounted = false;
  if (kind === 'shoot') matchStats.shots[p.side]++;
  if (matchStats.events.length < 20)
    matchStats.events.push({ event:'kick', type:s.type, vx:Math.round(ball.vx), vy:Math.round(ball.vy) });
  p.kickCd = 0.3; setpiece = null; state = 'play';
}

function stepSetpiece(dt) {
  if (!setpiece) { state = 'play'; return; }
  advanceClock(dt, true);
  if (state !== 'setpiece') return;
  if (setpiece.timer > 0) {
    setpiece.timer -= dt;
    return;
  }
  const human = setpiece.side === 0 || (setpiece.side === 1 && mode === '2p');
  if (!human) { takeSetpiece('pass'); return; }
  setpiece.ready = true;
  setpiece.auto -= dt;
  if (setpiece.auto <= 0) takeSetpiece('pass');
}

// 목표 골문 방향으로 조준할 지점 (약간 골문 안쪽을 노린다)
function aimAt(side) {
  return { x:attackDir[side] === 1 ? FW : 0,
    y:FH / 2 + (Math.random() * 2 - 1) * GOAL_H * 0.3 };
}

// 패스 대상: 앞쪽에 있고 가까운 동료
function passTarget(p, through = false) {
  const dir = attackDir[p.side];
  const tactic = teamTactics(p.side);
  let best = null, bestScore = Infinity;
  for (const t of teams[p.side]) {
    if (t === p || t.isGK) continue;
    const ahead = (t.x - p.x) * dir;
    if (ahead < 40) continue;                        // 뒤나 옆은 제외
    const d = Math.hypot(t.x - p.x, t.y - p.y);
    if (d < 120) continue;                           // 너무 가까우면 의미 없다
    let laneRisk = 0;
    for (const o of teams[1 - p.side]) {
      const ux = t.x - p.x, uy = t.y - p.y;
      const u2 = ux * ux + uy * uy;
      const q = u2 ? Math.max(0, Math.min(1, ((o.x - p.x) * ux + (o.y - p.y) * uy) / u2)) : 0;
      const lane = Math.hypot(o.x - (p.x + ux * q), o.y - (p.y + uy * q));
      if (lane < 100) laneRisk += (100 - lane) * 4;
    }
    const edgePenalty = Math.max(0, 150 - Math.min(t.y, FH - t.y)) * 3;
    // 넓게 벌린 팀은 가까운 중앙 선수만 고르지 않고 빈 측면의 전진
    // 패스도 적극적으로 선택한다. 기본 폭(.30) 이하는 기존 판정을 유지한다.
    const outletReward = Math.abs(t.y - FH / 2) *
      Math.max(0, tactic.width - .30) * 4;
    const sc = d - ahead * (through ? 0.95 : 0.6) +
      laneRisk + edgePenalty - outletReward;
    if (sc < bestScore) { bestScore = sc; best = t; }
  }
  return best;
}

function kickOwned(p, kind, power = 0.65) {
  if (ball.owner !== p || p.kickCd > 0) return false;
  let tx, ty, v;
  const aimMag = Math.hypot(p.aimX, p.aimY);
  if (kind === 'shoot') {
    matchStats.shots[p.side]++;
    if (p.manualAim && aimMag > 0.2) {
      tx = p.x + p.aimX / aimMag * 1000; ty = p.y + p.aimY / aimMag * 1000;
    } else {
      const a = aimAt(p.side); tx = a.x;
      ty = mode === '1p' && p === ctrl[0]
        ? FH / 2 + (Math.random() < .5 ? -1 : 1) * GOAL_H * .38
        : a.y;
    }
    v = SHOOT_V * p.shotMul * (0.62 + 0.38 * power) *
      (mode === '1p' && p === ctrl[0] ? HUMAN_SHOOT_MUL[level] : 1);
  } else {
    const through = kind === 'through';
    const t = passTarget(p, through);
    if (t) {
      const lead = through ? Math.min(230, Math.hypot(t.vx, t.vy) * 0.55 + 90) : 0;
      const tm = Math.hypot(t.vx, t.vy);
      tx = t.x + (tm > 5 ? t.vx / tm : attackDir[p.side]) * lead;
      ty = t.y + (tm > 5 ? t.vy / tm : 0) * lead;
      const d = Math.hypot(tx - p.x, ty - p.y);
      v = Math.min(PASS_V * p.passMul * (through ? 1.12 : 1),
        420 + d * p.passMul * (through ? 1.0 : 0.9));
    } else if (aimMag > 0.2) {
      tx = p.x + p.aimX / aimMag * 800; ty = p.y + p.aimY / aimMag * 800;
      v = PASS_V * p.passMul * (through ? 0.95 : 0.8);
    } else {
      const a = aimAt(p.side); tx = a.x; ty = a.y; v = PASS_V * 0.8;
    }
  }
  if (kind === 'pass' || kind === 'through') markOffside(p);
  const ang = Math.atan2(ty - p.y, tx - p.x);
  releaseBall(p, Math.cos(ang) * v, Math.sin(ang) * v);
  if (kind === 'shoot') ball.shotSide = p.side;
  p.actShoot = p.actPass = p.actThrough = 0;
  return true;
}

function collide(p) {
  const dx = ball.x - p.x, dy = ball.y - p.y;
  const gkAssist = p.isGK && p.side === 0 && mode === '1p'
    ? HUMAN_GK_REACH_MUL[level] : 1;
  const d = Math.hypot(dx, dy), min = p.reach * gkAssist + R_BALL;
  if (d >= min || d === 0) return;
  const nx = dx / d, ny = dy / d;

  if (ball.owner) {
    const owner = ball.owner;
    if (owner === p || owner.side === p.side) return;
    const rel = Math.hypot(p.vx - owner.vx, p.vy - owner.vy);
    const assist = mode === '1p' && p.side === 0 ? HUMAN_TACKLE_BONUS[level] : 0;
    const contest = p.defenseMul / (p.defenseMul + owner.defenseMul);
    if ((p.tackleT > 0 && Math.random() < contest + .18 + assist) ||
        rel > P_MAX * 0.72) {
      owner.trapCd = REOWN_CD;
      ball.owner = null; ball.freeCd = 0.06; ball.lastTouch = p;
      ball.x = p.x + nx * min; ball.y = p.y + ny * min;
      ball.vx = p.vx * 0.75 + nx * TOUCH_V;
      ball.vy = p.vy * 0.75 + ny * TOUCH_V;
      p.tackleT = 0;
    }
    return;
  }

  ball.x = p.x + nx * min; ball.y = p.y + ny * min;

  // 골키퍼는 잡아서 앞으로 크게 걷어낸다. 다른 선수처럼 튕겨내면
  // 골문 앞에서 공이 계속 맴돌아 결국 실점한다.
  if (p.isGK) {
    if (ball.shotSide === 1 - p.side && !ball.shotCounted) {
      matchStats.onTarget[ball.shotSide]++; ball.shotCounted = true;
    }
    p.kickCd = 0.35;
    const dir = attackDir[p.side];
    const ang = Math.atan2((FH / 2 - p.y) * 0.6 + (Math.random() * 2 - 1) * 300, dir * 900);
    ball.vx = Math.cos(ang) * 1150;
    ball.vy = Math.sin(ang) * 1150;
    return;
  }

  let vx, vy;
  if (p.actShoot > 0 && p.kickCd <= 0) {
    p.actShoot = 0; p.kickCd = 0.3;
    matchStats.shots[p.side]++;
    ball.shotSide = p.side; ball.shotCounted = false;
    const a = aimAt(p.side);
      const ang = Math.atan2(a.y - p.y, a.x - p.x);
      vx = Math.cos(ang) * SHOOT_V * p.shotMul; vy = Math.sin(ang) * SHOOT_V * p.shotMul;
  } else if (p.actPass > 0 && p.kickCd <= 0) {
    p.actPass = 0; p.kickCd = 0.25;
    const t = passTarget(p);
    if (t) {
      const ang = Math.atan2(t.y - p.y, t.x - p.x);
      const d2 = Math.hypot(t.x - p.x, t.y - p.y);
      const v = Math.min(PASS_V * p.passMul, 420 + d2 * 0.9 * p.passMul);
      vx = Math.cos(ang) * v; vy = Math.sin(ang) * v;
    } else {
      const a = aimAt(p.side);
      const ang = Math.atan2(a.y - p.y, a.x - p.x);
      vx = Math.cos(ang) * PASS_V * 0.8 * p.passMul;
      vy = Math.sin(ang) * PASS_V * 0.8 * p.passMul;
    }
  } else if (p.actThrough > 0 && p.kickCd <= 0) {
    p.actThrough = 0; p.kickCd = 0.25;
    const t = passTarget(p, true);
    const tx = t ? t.x + attackDir[p.side] * 150 : p.x + attackDir[p.side] * 600;
    const ty = t ? t.y : p.y;
    const ang = Math.atan2(ty - p.y, tx - p.x);
    vx = Math.cos(ang) * PASS_V; vy = Math.sin(ang) * PASS_V;
  } else if (Math.hypot(ball.vx - p.vx, ball.vy - p.vy) < TRAP_V &&
             d < TRAP_R && takePossession(p)) {
    return;
  } else {
    // 빠른 공은 트래핑하지 못하고 몸에 튕긴다
    const carry = Math.max(0, p.vx * nx + p.vy * ny);
    const v = TOUCH_V + carry * 0.5;
    vx = nx * v + p.vx * 0.3; vy = ny * v + p.vy * 0.3;
  }
  const sp = Math.hypot(vx, vy);
  ball.vx = sp > B_MAX ? vx / sp * B_MAX : vx;
  ball.vy = sp > B_MAX ? vy / sp * B_MAX : vy;
}

function inPenaltyArea(side, x, y) {
  if (y < (FH - PA_W) / 2 || y > (FH + PA_W) / 2) return false;
  return attackDir[side] === 1 ? x > FW - PA_D : x < PA_D;
}

function callFoul(tackler, victim) {
  if (state !== 'play' || tackleFoulGuard) return;
  tackleFoulGuard = true;
  tackler.tackleT = 0; tackler.tackleCd = Math.max(tackler.tackleCd, 1);
  matchStats.fouls[tackler.side]++;
  const rel = Math.hypot(tackler.vx - victim.vx, tackler.vy - victim.vy);
  if (rel > 420) {
    tackler.yellow = 1; matchStats.cards[tackler.side]++;
    notice = { text:'파울 · 옐로카드', timer:1.2, color:'#F2CE4A' };
  } else {
    notice = { text:'파울', timer:1.0, color:'#F2F7F4' };
  }
  if (ball.owner) { ball.owner.trapCd = REOWN_CD; ball.owner = null; }
  if (inPenaltyArea(victim.side, victim.x, victim.y)) {
    beginSetpiece('penalty', victim.side, {
      x:attackDir[victim.side] === 1 ? FW - PEN_SPOT : PEN_SPOT, y:FH / 2
    });
  } else {
    beginSetpiece('free', victim.side, { x:victim.x, y:victim.y });
  }
}

// 선수끼리 겹치지 않게 (22명 → 231쌍, Canvas 2D 로 충분히 가볍다)
let tackleFoulGuard = false;
function separateAll() {
  tackleFoulGuard = false;
  const all = teams[0].concat(teams[1]);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy), min = R_PLAYER * 2;
    if (d >= min || d === 0) continue;
    if (a.side !== b.side) {
      const tackler = a.tackleT > 0 ? a : b.tackleT > 0 ? b : null;
      const victim = tackler === a ? b : a;
      if (tackler) {
        const ballDist = Math.hypot(ball.x - tackler.x, ball.y - tackler.y);
        if (ballDist > d + R_BALL * 0.6) {
          callFoul(tackler, victim);
          if (state !== 'play') return;
        }
      }
    }
    const push = (min - d) / 2, nx = dx / d, ny = dy / d;
    a.x -= nx * push; a.y -= ny * push;
    b.x += nx * push; b.y += ny * push;
    a.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, a.x));
    a.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, a.y));
    b.x = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, b.x));
    b.y = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, b.y));
  }
}

function goal(side) {
  if (ball.shotSide === side && !ball.shotCounted) matchStats.onTarget[side]++;
  score[side]++; lastScorer = side;
  ball.owner = null; setpiece = null;
  state = 'goal'; goalTimer = GOAL_PAUSE;
  syncHud();
}

// ── AI ─────────────────────────────────────────────────────────────
// 팀에서 공에 가장 가까운 필드 선수만 공을 쫓고, 나머지는 포메이션 위치를
// 공 위치에 따라 밀고 당긴 지점을 지킨다. 전원이 공만 쫓으면 뭉쳐버린다.
function nearestToBall(side, exclude) {
  let best = null, bd = Infinity;
  for (const p of teams[side]) {
    if (p.isGK || p === exclude) continue;
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function nearestChasers(side, exclude) {
  return teams[side]
    .filter(p => !p.isGK && p !== exclude)
    .sort((a, b) => Math.hypot(ball.x - a.x, ball.y - a.y) -
                    Math.hypot(ball.x - b.x, ball.y - b.y))
    .slice(0, teamTactics(side).chasers);
}

// 포메이션 위치를 공 쪽으로 이동시킨 목표 지점
function slotTarget(p) {
  const h = homePos(p);
  const tactic = teamTactics(p.side);
  const shiftX = (ball.x - FW / 2) * tactic.press;
  // 폭은 공 쪽으로 전원이 몰리는 정도가 아니라, 대형 자체가 좌우로
  // 벌어지는 정도다. 공을 따라가는 이동은 작게 유지해 넓은 전개가
  // 두 명 압박을 자연스럽게 분산시키게 한다.
  const spread = .72 + tactic.width * 1.55;
  const shiftY = (ball.y - FH / 2) * .18;
  let tx = h.x + shiftX;
  let ty = FH / 2 + (h.y - FH / 2) * spread + shiftY;
  // 수비는 자기 진영을 크게 벗어나지 않는다
  if (p.role === 'DF') {
    tx = attackDir[p.side] === 1
      ? Math.min(tx, FW * tactic.line)
      : Math.max(tx, FW * (1 - tactic.line));
  }
  if (level > 0 && (p.role === 'MF' || p.role === 'FW')) {
    const line = secondLastDefenderLine(p.side);
    tx = attackDir[p.side] === 1 ? Math.min(tx, line - 36) : Math.max(tx, line + 36);
  }
  return {
    x:Math.max(R_PLAYER, Math.min(FW - R_PLAYER, tx)),
    y:Math.max(100, Math.min(FH - 100, ty))
  };
}

function gkTarget(p) {
  const dir = attackDir[p.side];
  const gx = dir === 1 ? 0 : FW;
  // 골라인에서 조금 나와 공과 골문 중심을 잇는 선 위에 선다
  const t = Math.max(0, Math.min(1, 1 - Math.abs(ball.x - gx) / (FW * 0.35)));
  const out = 40 + t * (PA_D * 0.55);
  const keeping = .78 + p.stats.keeping / 99 * .18;
  const ty = FH / 2 + (ball.y - FH / 2) * keeping;
  return {
    x:gx + dir * out,
    y:Math.max((FH - GOAL_H) / 2 - 30, Math.min((FH + GOAL_H) / 2 + 30, ty))
  };
}

function aiPlayer(p, dt, L, isChaser) {
  p.aiT -= dt;
  if (p.aiT <= 0) {
    p.aiT = L.react * (p.isGK ? 0.5 : 1);
    let t;
    if (p.isGK) {
      t = gkTarget(p);
      // 골키퍼 반응은 별도 계수 — 난이도가 낮으면 늦게 붙는다
      t.y = FH / 2 + (t.y - FH / 2) * L.gk;
    } else if (ball.owner === p) {
      const dir = attackDir[p.side];
      t = { x:p.x + dir * 320, y:p.y + (FH / 2 - p.y) * 0.16 };
    } else if (isChaser) {
      const dir = attackDir[p.side];
      t = {
        x:ball.x - dir * (R_PLAYER + R_BALL + 4),
        y:ball.y + (Math.random() * 2 - 1) * L.aimErr
      };
    } else {
      t = slotTarget(p);
    }
    p.aiTx = Math.max(R_PLAYER, Math.min(FW - R_PLAYER, t.x));
    p.aiTy = Math.max(R_PLAYER, Math.min(FH - R_PLAYER, t.y));
  }

  let ax = p.aiTx - p.x, ay = p.aiTy - p.y;
  const d = Math.hypot(ax, ay);
  if (d > 6) { ax /= d; ay /= d; } else { ax = ay = 0; }

  // 공이 발 앞에 있으면 슛이나 패스
  const bd = Math.hypot(ball.x - p.x, ball.y - p.y);
  if (ball.owner && ball.owner.side !== p.side && bd < 92 && p.tackleCd <= 0) {
    p.tackleT = 0.22; p.tackleCd = 0.85;
  }
  if (bd < R_PLAYER + R_BALL + 24 && p.kickCd <= 0) {
    const dir = attackDir[p.side];
    const toGoal = dir === 1 ? FW - p.x : p.x;
    const exploitHighLine = teamTactics(p.side).width > .38 &&
      teamTactics(1 - p.side).line > .65;
    if (p.isGK) {
      // 처리는 collide() 안에서 직접 한다 (잡아서 걷어내기)
    } else if (toGoal < FW * 0.32 && Math.random() < L.shoot) {
      p.actShoot = 0.65;                                      // 골문 근처면 슛
    } else if (exploitHighLine && Math.random() < L.shoot * .8) {
      p.actThrough = 0.15;                                    // 높은 선 뒤 측면 침투
    } else if (Math.random() < L.shoot * 0.8) {
      p.actPass = 0.15;                                       // 아니면 전진 패스
    }
  }
  return { ax, ay };
}

// ── 사람 입력 ──────────────────────────────────────────────────────
function readHuman(i) {
  let sx = 0, sy = 0;
  if (i === 0) {
    if (keys.KeyA || keys.ArrowLeft) sx -= 1;
    if (keys.KeyD || keys.ArrowRight) sx += 1;
    if (keys.KeyW || keys.ArrowUp) sy -= 1;
    if (keys.KeyS || keys.ArrowDown) sy += 1;
    if (stick.active) { sx += stick.dx; sy += stick.dy; }
  } else {
    if (keys.KeyJ) sx -= 1;
    if (keys.KeyL) sx += 1;
    if (keys.KeyI) sy -= 1;
    if (keys.KeyK) sy += 1;
  }
  // 화면 위로 밀면 상대 골문(필드 +x) 쪽. 회전 시 입력도 같이 돌려야 한다.
  const sprint = i === 0
    ? !!(keys.KeyE || (stick.active && Math.hypot(stick.dx, stick.dy) > 0.92))
    : !!keys.KeyU;
  const base = view.rot ? { ax:-sy, ay:sx } : { ax:sx, ay:sy };
  const v = { ax:base.ax * attackDir[i], ay:base.ay * attackDir[i] };
  v.sprint = sprint; v.human = true; return v;
}

// 조작 대상 자동 전환. 히스테리시스를 둬서 두 선수가 비슷할 때 깜빡이지 않게 한다.
function pickControlled(teamIdx) {
  const side = teamIdx;
  const cur = ctrl[teamIdx];
  const best = nearestToBall(side, null);
  if (!cur) { ctrl[teamIdx] = best; return; }
  if (ctrlLock[teamIdx] > 0) return;
  if (cur.isGK) { ctrl[teamIdx] = best; return; }
  const dCur = Math.hypot(ball.x - cur.x, ball.y - cur.y);
  const dBest = best ? Math.hypot(ball.x - best.x, ball.y - best.y) : Infinity;
  if (best && best !== cur && dBest < dCur - 90) ctrl[teamIdx] = best;
}

function cycleControlled(teamIdx) {
  const players = teams[teamIdx]
    .filter(p => !p.isGK)
    .sort((a, b) => Math.hypot(ball.x - a.x, ball.y - a.y) -
                    Math.hypot(ball.x - b.x, ball.y - b.y));
  if (!players.length) return;
  const at = players.indexOf(ctrl[teamIdx]);
  ctrl[teamIdx] = players[(at + 1 + players.length) % players.length];
  ctrlLock[teamIdx] = 1.2;
}

function syncTouchActions() {
  const owned = ctrl[0] && ball.owner === ctrl[0];
  shootBtn.textContent = owned ? '슛' : '태클';
  passBtn.textContent = owned ? '패스' : '전환';
}

// ── 루프 ───────────────────────────────────────────────────────────
function endHalf() {
  if (half === 1) {
    half = 2;
    attackDir[0] *= -1; attackDir[1] *= -1;
    clock = MATCH_SEC / 2; addedBank = 0; inAdded = false;
    state = 'halftime'; goalTimer = 1.5;
    ball.owner = null; ball.vx = ball.vy = 0;
    syncClock();
  } else {
    clock = 0; endMatch();
  }
}

function advanceClock(dt, stopped = false) {
  clock -= dt;
  if (stopped && !inAdded) addedBank += dt;
  if (clock > 0) return;
  if (!inAdded && addedBank > 0.05) {
    clock = addedBank; addedBank = 0; inAdded = true;
  } else {
    clock = 0; endHalf();
  }
  syncClock();
}

function step(dt) {
  if (notice.timer > 0) notice.timer -= dt;
  if (offside) {
    offside.timer -= dt;
    if (offside.timer <= 0) offside = null;
  }
  if (state === 'halftime') {
    goalTimer -= dt;
    if (goalTimer <= 0) {
      resetPositions(1);
      beginSetpiece('kickoff', 1, { x:FW / 2, y:FH / 2 });
    }
    return;
  }
  if (state === 'setpiece') {
    stepSetpiece(dt); syncClock(); return;
  }
  if (state === 'goal') {
    advanceClock(dt, true);
    if (state !== 'goal') return;
    goalTimer -= dt;
    if (goalTimer <= 0) {
      const kick = lastScorer === 0 ? 1 : 0;
      resetPositions(kick);
      beginSetpiece('kickoff', kick, { x:FW / 2, y:FH / 2 });
    }
    return;
  }
  if (state !== 'play') return;

  advanceClock(dt, false);
  if (state !== 'play') return;
  if (ball.owner) matchStats.possession[ball.owner.side] += dt;

  const L = LEVELS[level];
  ctrlLock[0] = Math.max(0, ctrlLock[0] - dt);
  ctrlLock[1] = Math.max(0, ctrlLock[1] - dt);
  pickControlled(0);
  if (mode === '2p') pickControlled(1);

  const chaser = [
    new Set(nearestChasers(0, null)),
    new Set(nearestChasers(1, null))
  ];

  for (const side of [0, 1]) {
    const human = (side === 0) || (side === 1 && mode === '2p');
    const inp = human ? readHuman(side) : null;
    for (const p of teams[side]) {
      if (human && p === ctrl[side]) {
        const im = Math.hypot(inp.ax, inp.ay);
        p.manualAim = !!inp.human && im > 0.15;
        if (p.manualAim) { p.aimX = inp.ax / im; p.aimY = inp.ay / im; }
        const ownerMul = ball.owner === p ? OWNER_SPEED : 1;
        const sprinting = inp.sprint && p.energy > .05;
        p.energy = Math.max(0, Math.min(1,
          p.energy + dt * (sprinting ? -.12 * (1.2 - p.stats.stamina / 150) : .045)));
        movePlayer(p, inp.ax, inp.ay, dt,
          p.speedMul * ownerMul * (sprinting ? SPRINT_SPEED : 1));
      } else if (human) {
        // 사람 팀의 나머지 선수는 아군 AI (난이도와 무관하게 보통 수준)
        const a = aiPlayer(p, dt, LEVELS[1], chaser[side].has(p) && p !== ctrl[side]);
        movePlayer(p, a.ax, a.ay, dt, p.speedMul);
      } else {
        const a = aiPlayer(p, dt, L, chaser[side].has(p));
        movePlayer(p, a.ax, a.ay, dt,
          p.speedMul * (mode === '1p' ? OPPONENT_SPEED_MUL[level] : 1));
      }
    }
  }

  separateAll();
  if (state !== 'play') return;
  if (ball.owner) {
    const p = ball.owner;
    if (p.actShoot > 0) kickOwned(p, 'shoot', p.actShoot);
    else if (p.actThrough > 0) kickOwned(p, 'through');
    else if (p.actPass > 0) kickOwned(p, 'pass');
  }
  updateBall(dt);
  if (state !== 'play') return;                        // 득점으로 중단
  for (const side of [0, 1]) for (const p of teams[side]) collide(p);
  updateCamera(dt);
  syncClock();
  syncTouchActions();
}

function endMatch() {
  state = 'end';
  const summary = matchSummaryText();
  if (competition) competition.lastMatch = summary;
  if (mode === '1p') saveBest(score[0] - score[1]);
  const knockout = competition && (competition.type === 'tournament' ||
    (competition.type === 'season' && competition.phase === 'cup'));
  if (knockout) {
    if (score[0] === score[1]) { beginShootout(); return; }
    finishTournamentMatch(score[0] > score[1]);
    return;
  }
  if (competition && (competition.type === 'league' ||
      (competition.type === 'season' && competition.phase === 'league'))) {
    finishLeagueMatch(); return;
  }
  const ov = document.getElementById('overlay');
  const win = score[0] > score[1] ? '승리' : score[0] < score[1] ? '패배' : '무승부';
  ov.querySelector('h1').textContent = `${win}  ${score[0]} : ${score[1]}`;
  document.getElementById('howto').innerHTML = mode === '1p'
    ? `${LEVELS[level].name} 난이도 경기가 끝났습니다.` : '2인 대전이 끝났습니다.';
  document.getElementById('btn1p').textContent = '다시 하기';
  document.getElementById('btn2p').textContent = '처음으로';
  document.getElementById('levelRow').style.display = mode === '1p' ? '' : 'none';
  document.getElementById('lengthRow').style.display = '';
  document.getElementById('modeInfo').textContent = summary;
  ov.classList.remove('hidden');
  showBest();
}

function matchSummaryText() {
  const total = matchStats.possession[0] + matchStats.possession[1];
  const homePoss = total ? Math.round(matchStats.possession[0] / total * 100) : 50;
  const awayPoss = 100 - homePoss;
  return [
    `기록                우리  상대`,
    `점유율             ${homePoss}%   ${awayPoss}%`,
    `슛 / 유효슈팅      ${matchStats.shots[0]}/${matchStats.onTarget[0]}   ` +
      `${matchStats.shots[1]}/${matchStats.onTarget[1]}`,
    `코너               ${matchStats.corners[0]}     ${matchStats.corners[1]}`,
    `파울 / 카드        ${matchStats.fouls[0]}/${matchStats.cards[0]}   ` +
      `${matchStats.fouls[1]}/${matchStats.cards[1]}`
  ].join('\n');
}

// ── 그리기 ─────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#152528';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  applyFieldTransform();
  drawPitch();
  if (offside) drawOffsideLine();
  for (const side of [0, 1]) for (const p of teams[side]) drawPlayer(p);
  drawBall();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 경기장 전체가 이미 보이면 미니맵은 군더더기다
  if (!view.whole) drawMinimap();
  if (state === 'goal') drawGoalText();
  if (state === 'setpiece') drawSetpieceText();
  if (state === 'halftime') drawBannerText('하프타임', C.gold || '#F2CE7A');
  if (notice.timer > 0) drawNotice();
}

function drawOffsideLine() {
  ctx.save();
  ctx.strokeStyle = '#F2CE7A'; ctx.lineWidth = 5;
  ctx.setLineDash([18, 14]);
  ctx.beginPath(); ctx.moveTo(offside.lineX, 0); ctx.lineTo(offside.lineX, FH); ctx.stroke();
  ctx.restore();
}

function drawPitch() {
  ctx.fillStyle = C.turf;
  ctx.fillRect(0, 0, FW, FH);
  ctx.fillStyle = C.turfAlt;
  const stripes = 14, sw = FW / stripes;
  for (let i = 0; i < stripes; i += 2) ctx.fillRect(i * sw, 0, sw, FH);

  ctx.strokeStyle = C.line; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, FW - 4, FH - 4);
  ctx.beginPath(); ctx.moveTo(FW / 2, 0); ctx.lineTo(FW / 2, FH); ctx.stroke();
  ctx.beginPath(); ctx.arc(FW / 2, FH / 2, CIRCLE_R, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = C.line;
  ctx.beginPath(); ctx.arc(FW / 2, FH / 2, 7, 0, Math.PI * 2); ctx.fill();

  for (const gx of [0, FW]) {
    const dir = gx === 0 ? 1 : -1;
    ctx.strokeRect(gx === 0 ? 0 : FW - PA_D, (FH - PA_W) / 2, PA_D, PA_W);
    ctx.strokeRect(gx === 0 ? 0 : FW - GA_D, (FH - GA_W) / 2, GA_D, GA_W);
    ctx.beginPath(); ctx.arc(gx + dir * PEN_SPOT, FH / 2, 7, 0, Math.PI * 2); ctx.fill();
  }

  for (const x of [0, FW]) for (const y of [0, FH]) {
    const a0 = x === 0 ? (y === 0 ? 0 : -Math.PI / 2) : (y === 0 ? Math.PI / 2 : Math.PI);
    ctx.beginPath(); ctx.arc(x, y, 20, a0, a0 + Math.PI / 2); ctx.stroke();
  }

  // 골문
  const gy = (FH - GOAL_H) / 2;
  ctx.lineWidth = 10;
  ctx.strokeStyle = C.home;
  ctx.beginPath(); ctx.moveTo(3, gy); ctx.lineTo(3, gy + GOAL_H); ctx.stroke();
  ctx.strokeStyle = C.away;
  ctx.beginPath(); ctx.moveTo(FW - 3, gy); ctx.lineTo(FW - 3, gy + GOAL_H); ctx.stroke();
}

function drawPlayer(p) {
  const isCtrl = p === ctrl[0] || (mode === '2p' && p === ctrl[1]);
  const base = p.side === 0
    ? (p.isGK ? C.gkHome : C.home)
    : (p.isGK ? C.gkAway : C.away);

  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(p.x + 5, p.y + 7, R_PLAYER, R_PLAYER * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = base;
  ctx.beginPath(); ctx.arc(p.x, p.y, R_PLAYER, 0, Math.PI * 2); ctx.fill();

  // 조작 중인 선수는 흰 테두리 + 위쪽 삼각 표시 (22명 중에서 찾기 쉽게)
  if (isCtrl) {
    ctx.strokeStyle = '#F2F7F4'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(p.x, p.y, R_PLAYER + 6, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.translate(p.x, p.y - R_PLAYER - 22);
    if (view.rot) ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#F2F7F4';
    ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(-11, -6); ctx.lineTo(11, -6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (p.yellow) {
    ctx.fillStyle = '#F2CE4A';
    ctx.fillRect(p.x + R_PLAYER * 0.45, p.y - R_PLAYER * 1.15, 12, 17);
  }

  // 등번호는 세워서 그린다
  ctx.save();
  ctx.translate(p.x, p.y);
  if (view.rot) ctx.rotate(Math.PI / 2);
  ctx.fillStyle = '#152528';
  ctx.font = '700 24px ' + bodyFont();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.isGK ? 'GK' : String(p.no), 0, 1);
  ctx.restore();
}

function drawBall() {
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(ball.x + 3, ball.y + 5, R_BALL, R_BALL * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.ball;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R_BALL, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#152528';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R_BALL * 0.42, 0, Math.PI * 2); ctx.fill();
}

// 미니맵은 화면 좌표로 그린다(경기장 변환·회전과 무관하게 항상 가로).
// 위치는 우측 상단 — 아래쪽은 조이스틱(좌)과 슛·패스 버튼(우)이 차지한다.
function drawMinimap() {
  const pad = 10 * view.dpr;
  const mw = Math.min(canvas.width * 0.34, 260 * view.dpr);
  const mh = mw * (FH / FW);
  const mx = canvas.width - mw - pad, my = pad;
  const sx = mw / FW, sy = mh / FH;

  ctx.fillStyle = C.mapBg;
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = C.mapLine; ctx.lineWidth = 1 * view.dpr;
  ctx.strokeRect(mx + .5, my + .5, mw - 1, mh - 1);
  ctx.beginPath(); ctx.moveTo(mx + mw / 2, my); ctx.lineTo(mx + mw / 2, my + mh); ctx.stroke();

  // 현재 화면에 보이는 범위
  const sp = viewSpan();
  ctx.strokeStyle = 'rgba(242,247,244,.35)';
  ctx.strokeRect(mx + (cam.x - sp.x / 2) * sx, my + (cam.y - sp.y / 2) * sy, sp.x * sx, sp.y * sy);

  const r = Math.max(1.6 * view.dpr, mw * 0.012);
  for (const side of [0, 1]) for (const p of teams[side]) {
    ctx.fillStyle = p.side === 0 ? C.home : C.away;
    ctx.beginPath(); ctx.arc(mx + p.x * sx, my + p.y * sy, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = C.ball;
  ctx.beginPath(); ctx.arc(mx + ball.x * sx, my + ball.y * sy, r * 0.85, 0, Math.PI * 2); ctx.fill();
}

function drawGoalText() {
  ctx.fillStyle = 'rgba(21,37,40,.5)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = lastScorer === 0 ? C.home : C.away;
  ctx.font = '700 ' + Math.round(Math.min(canvas.width, canvas.height) * 0.16) + 'px ' + bodyFont();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('골!', canvas.width / 2, canvas.height / 2);
}

function drawBannerText(text, color = C.ball) {
  ctx.fillStyle = 'rgba(21,37,40,.48)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = color;
  ctx.font = '700 ' + Math.round(Math.min(canvas.width, canvas.height) * 0.10) + 'px ' + bodyFont();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
}

function drawSetpieceText() {
  if (!setpiece) return;
  const names = {
    throw:'스로인', goalkick:'골킥', corner:'코너킥',
    free:'프리킥', kickoff:'킥오프', penalty:'페널티킥'
  };
  ctx.fillStyle = 'rgba(21,37,40,.72)';
  ctx.fillRect(canvas.width / 2 - 90 * view.dpr, 12 * view.dpr, 180 * view.dpr, 34 * view.dpr);
  ctx.fillStyle = setpiece.side === 0 ? C.home : C.away;
  ctx.font = `700 ${14 * view.dpr}px ${bodyFont()}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(names[setpiece.type], canvas.width / 2, 29 * view.dpr);
}

function drawNotice() {
  ctx.fillStyle = 'rgba(21,37,40,.82)';
  ctx.fillRect(canvas.width / 2 - 110 * view.dpr, 52 * view.dpr, 220 * view.dpr, 36 * view.dpr);
  ctx.fillStyle = notice.color;
  ctx.font = `700 ${15 * view.dpr}px ${bodyFont()}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(notice.text, canvas.width / 2, 70 * view.dpr);
}

function bodyFont() { return getComputedStyle(document.body).fontFamily; }

// ── HUD·기록 ───────────────────────────────────────────────────────
function syncHud() {
  document.getElementById('sHome').textContent = score[0];
  document.getElementById('sAway').textContent = score[1];
  syncClock();
}
function syncClock() {
  const t = Math.max(0, Math.ceil(clock));
  document.getElementById('clock').textContent =
    `${half}H ` + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') +
    (inAdded ? '+' : '');
}

const OLD_KEY = 'ilbbang.soccer11.v1';
const SAVE_KEY = 'ilbbang.soccer11.v2';
function emptyRecord() { return { w:0, d:0, l:0, bestGd:0 }; }
function defaultSave() {
  return {
    version:2,
    settings:{ level:1, matchSec:180, teams:[0,0], formation:'4-4-2', tactics:null },
    records:{ 0:emptyRecord(), 1:emptyRecord(), 2:emptyRecord() },
    progress:null
  };
}

function loadSaveData() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch {}
  const hadV2 = !!data && data.version === 2;
  if (!hadV2) data = defaultSave();
  data.settings = Object.assign(defaultSave().settings, data.settings || {});
  data.records = data.records || {};
  for (let i = 0; i < 3; i++) {
    if (!hadV2 || !data.records[i]) {
      try {
        data.records[i] = JSON.parse(localStorage.getItem(OLD_KEY + '.rec' + i)) ||
          emptyRecord();
      } catch { data.records[i] = emptyRecord(); }
    }
  }
  try {
    if (!hadV2) {
      const oldLevel = +localStorage.getItem(OLD_KEY + '.lvl');
      const oldSec = +localStorage.getItem(OLD_KEY + '.matchSec');
      if (Number.isInteger(oldLevel) && oldLevel >= 0 && oldLevel <= 2)
        data.settings.level = oldLevel;
      if ([180,360,600].includes(oldSec)) data.settings.matchSec = oldSec;
    }
  } catch {}
  return data;
}

function saveGame() {
  if (!saveData) return;
  saveData.settings = {
    level, matchSec:MATCH_SEC, teams:selectedTeams.slice(),
    formation:selectedFormation[0],
    tactics:tacticOverride[0] ? Object.assign({}, tacticOverride[0]) : null
  };
  saveData.progress = competition ? JSON.parse(JSON.stringify(competition)) : null;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch {}
}

function loadRec(n = level) {
  return saveData && saveData.records[n] ? saveData.records[n] : emptyRecord();
}
function saveBest(gd) {
  const r = loadRec();
  if (gd > 0) r.w++; else if (gd === 0) r.d++; else r.l++;
  if (gd > r.bestGd) r.bestGd = gd;
  saveGame();
}
function showBest() {
  const r = loadRec();
  document.getElementById('best').textContent = (r.w + r.d + r.l)
    ? `${LEVELS[level].name} 전적 ${r.w}승 ${r.d}무 ${r.l}패 · 최다 득점차 +${r.bestGd}` : '';
}
function selectLevel(n) {
  level = n;
  for (const b of document.querySelectorAll('.lvl')) b.classList.toggle('sel', +b.dataset.lvl === n);
  saveGame();
  showBest();
}

function selectLength(sec) {
  MATCH_SEC = sec;
  for (const b of document.querySelectorAll('.len'))
    b.classList.toggle('sel', +b.dataset.sec === sec);
  saveGame();
  if (state === 'title') { clock = MATCH_SEC / 2; half = 1; syncClock(); }
}

function syncTeamPanel() {
  const team = TEAM_DEFS[selectedTeams[0]];
  document.getElementById('homeTeam').value = String(selectedTeams[0]);
  document.getElementById('awayTeam').value = String(selectedTeams[1]);
  document.getElementById('formationPick').value = selectedFormation[0];
  document.getElementById('teamRating').textContent =
    `${team.name} 종합 ${ratingBars(team)} · 속도/슛/패스/수비/체력/선방`;
  const t = teamTactics(0);
  document.getElementById('lineTactic').value = Math.round(t.line * 100);
  document.getElementById('pressTactic').value = Math.round(t.press * 100);
  document.getElementById('widthTactic').value = Math.round(t.width * 100);
  document.getElementById('chaserTactic').value = String(t.chasers);
}

function selectTeam(side, n) {
  selectedTeams[side] = Math.max(0, Math.min(TEAM_DEFS.length - 1, n));
  selectedFormation[side] = TEAM_DEFS[selectedTeams[side]].formation;
  tacticOverride[side] = null;
  syncTeamPanel();
  saveGame();
}

function initTeamUi() {
  for (const id of ['homeTeam', 'awayTeam']) {
    const el = document.getElementById(id);
    for (let i = 0; i < TEAM_DEFS.length; i++) {
      const o = document.createElement('option');
      o.value = String(i); o.textContent = `${TEAM_DEFS[i].name} ${ratingBars(TEAM_DEFS[i])}`;
      el.appendChild(o);
    }
  }
  const formation = document.getElementById('formationPick');
  for (const name of Object.keys(FORMATIONS)) {
    const o = document.createElement('option'); o.value = name; o.textContent = name;
    formation.appendChild(o);
  }
  document.getElementById('homeTeam').addEventListener('change', e => selectTeam(0, +e.target.value));
  document.getElementById('awayTeam').addEventListener('change', e => selectTeam(1, +e.target.value));
  formation.addEventListener('change', e => {
    selectedFormation[0] = e.target.value; saveGame();
  });
  for (const id of ['lineTactic','pressTactic','widthTactic','chaserTactic']) {
    document.getElementById(id).addEventListener('input', () => {
      tacticOverride[0] = {
        line:+document.getElementById('lineTactic').value / 100,
        press:+document.getElementById('pressTactic').value / 100,
        width:+document.getElementById('widthTactic').value / 100,
        chasers:+document.getElementById('chaserTactic').value
      };
      saveGame();
    });
  }
  syncTeamPanel();
}

// ── 시작 ───────────────────────────────────────────────────────────
const HOWTO = isTouch
  ? '공을 잡으면 이동 방향으로 조준합니다. <span class="keys">슛/태클</span> · <span class="keys">패스/선수전환</span> 버튼의 의미가 소유 여부에 따라 바뀝니다.<br>패스 버튼을 길게 누르면 스루패스, 스틱을 끝까지 밀면 스프린트입니다.'
  : '<span class="keys">WASD/방향키</span> 이동·조준 · <span class="keys">E</span> 스프린트 · <span class="keys">Space</span> 슛/태클 · <span class="keys">Shift</span> 패스 · <span class="keys">Ctrl</span> 스루패스 · <span class="keys">Q</span> 선수전환<br>2P: IJKL · U · Enter · 오른쪽 Shift/Ctrl · O';

function showTitle() {
  state = 'title';
  const ov = document.getElementById('overlay');
  ov.querySelector('h1').textContent = '동네 축구';
  document.getElementById('howto').innerHTML = HOWTO;
  document.getElementById('btn1p').textContent = 'AI와 대전';
  document.getElementById('btn2p').textContent = '2인 대전';
  setConfigVisible(true);
  document.getElementById('modeInfo').textContent = '';
  resetModeButtons();
  document.getElementById('btnCancelCompetition').textContent = '진행 포기';
  if (competition) {
    const id = competition.type === 'tournament' ? 'btnTournament' :
      competition.type === 'league' ? 'btnLeague' : 'btnSeason';
    setModeButtons(id, competition.type === 'tournament' ? '토너먼트 이어하기' :
      competition.type === 'league' ? '리그 이어하기' : '시즌 이어하기');
  }
  ov.classList.remove('hidden');
  showBest();
}

for (const b of document.querySelectorAll('.lvl'))
  b.addEventListener('click', () => selectLevel(+b.dataset.lvl));
for (const b of document.querySelectorAll('.len'))
  b.addEventListener('click', () => selectLength(+b.dataset.sec));
document.getElementById('btn1p').addEventListener('click', () => startMatch('1p'));
document.getElementById('btn2p').addEventListener('click', () => {
  if (state === 'end') showTitle(); else startMatch('2p');
});
document.getElementById('btnTournament').addEventListener('click', () => {
  if (!competition) startTournament();
  else if (competition.shootout) {
    shootout = competition.shootout; showShootoutScreen();
  } else startTournamentMatch();
});
document.getElementById('btnLeague').addEventListener('click', () => {
  if (!competition) startLeague('league'); else startLeagueMatch();
});
document.getElementById('btnSeason').addEventListener('click', () => {
  if (!competition) { startLeague('season'); return; }
  if (competition.shootout) {
    shootout = competition.shootout; showShootoutScreen(); return;
  }
  if (competition.phase === 'league') startLeagueMatch();
  else if (competition.phase === 'cup') startCupMatch();
  else {
    competition = createLeague(competition.userTeam, 'season',
      competition.seasonNo + 1, competition.trophies);
    saveGame(); showLeagueReady();
  }
});
document.getElementById('btnCancelCompetition').addEventListener('click', () => {
  competition = null; shootout = null; saveGame();
  document.getElementById('btnCancelCompetition').textContent = '진행 포기';
  showTitle();
});
for (const b of document.querySelectorAll('[data-pk]'))
  b.addEventListener('click', () => takePenaltyRound(+b.dataset.pk));

document.getElementById('howto').innerHTML = HOWTO;
saveData = loadSaveData();
const settings = saveData.settings;
competition = saveData.progress &&
  ['tournament','league','season'].includes(saveData.progress.type)
  ? saveData.progress : null;
selectedTeams[0] = Math.max(0, Math.min(TEAM_DEFS.length - 1, +(settings.teams || [0])[0] || 0));
selectedTeams[1] = Math.max(0, Math.min(TEAM_DEFS.length - 1, +(settings.teams || [0,0])[1] || 0));
selectedFormation[0] = FORMATIONS[settings.formation]
  ? settings.formation : TEAM_DEFS[selectedTeams[0]].formation;
selectedFormation[1] = TEAM_DEFS[selectedTeams[1]].formation;
tacticOverride[0] = settings.tactics || null;
if (competition) {
  selectedTeams[0] = competition.userTeam;
  const restoredOpponent = competition.type === 'tournament'
    ? competition.opponents[competition.round]
    : competition.phase === 'cup'
      ? competition.cupOpponents[competition.cupRound]
      : competition.phase === 'league'
        ? (leagueUserFixture(competition) || []).find(n => n !== competition.userTeam)
        : selectedTeams[1];
  selectedTeams[1] = restoredOpponent ?? 0;
  selectedFormation[1] = TEAM_DEFS[selectedTeams[1]].formation;
  shootout = competition.shootout || null;
}
initTeamUi();
selectLevel(Math.min(2, Math.max(0, +settings.level || 1)));
selectLength([180,360,600].includes(+settings.matchSec) ? +settings.matchSec : 180);
if (competition) {
  if (shootout) showShootoutScreen();
  else if (competition.type === 'tournament') showTournamentReady();
  else if (competition.phase === 'league') showLeagueReady();
  else if (competition.phase === 'cup') showCupReady();
  else showSeasonComplete(!!competition.cupWon);
}

resize();
buildTeams();
resetPositions(0);

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);   // 백그라운드 복귀 시 점프 방지
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
